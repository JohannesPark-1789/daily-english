<title>듣보잡 영어 복습 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  /* 자막(캡션)을 모티프로 삼았다 — 출처가 쇼츠 영상이고, 카드가 하는 일도
     화면 아래 자막처럼 "한 줄을 띄우고 뜻을 붙이는" 것이라서. */
  :root {
    --bg: #e9ecec; --surface: #ffffff; --plate: #16181c;
    --ink: #14161a; --on-plate: #f4f6f6; --muted: #5f6872; --line: #d6dbda;
    --accent: #f0c000; --accent-ink: #7a6000;
    --no: #b8384f; --mid: #4f7396; --ok: #2c7f57;
    --shadow: 0 1px 2px rgba(16,20,24,.05), 0 10px 30px rgba(16,20,24,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1013; --surface: #181b20; --plate: #05060700;
      --ink: #eef1f2; --on-plate: #f4f6f6; --muted: #99a2ac; --line: #262b32;
      --accent: #ffd54a; --accent-ink: #ffd54a;
      --no: #e0697e; --mid: #85a9cd; --ok: #62b98c;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1013; --surface: #181b20; --plate: #05060700;
    --ink: #eef1f2; --on-plate: #f4f6f6; --muted: #99a2ac; --line: #262b32;
    --accent: #ffd54a; --accent-ink: #ffd54a;
    --no: #e0697e; --mid: #85a9cd; --ok: #62b98c;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    line-height: 1.5;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 540px; margin: 0 auto; padding: 18px 16px 36px; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, "Consolas", monospace; font-variant-numeric: tabular-nums; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  h1 em { font-style: normal; color: var(--muted); font-weight: 400; }
  .counter { font-size: 12px; color: var(--muted); letter-spacing: .04em; }

  .tabs { display: flex; gap: 8px; margin-bottom: 8px; }
  .tab {
    flex: 1; padding: 10px 8px; border: 1px solid var(--line); background: var(--surface);
    color: var(--muted); border-radius: 4px; font-family: inherit; font-size: 13px;
    font-weight: 500; cursor: pointer;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-color: var(--ink); font-weight: 600; }

  .modes { display: flex; gap: 0; margin-bottom: 18px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .mode {
    flex: 1; padding: 8px 4px; border: 0; border-right: 1px solid var(--line); background: var(--surface);
    color: var(--muted); font-family: inherit; font-size: 12px; cursor: pointer;
  }
  .mode:last-child { border-right: 0; }
  .mode[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }

  /* 스크럽 바 — 영상 진행바처럼 */
  .scrub { height: 2px; background: var(--line); margin-bottom: 18px; position: relative; }
  .scrub i { position: absolute; inset: 0 auto 0 0; background: var(--accent); width: 0; transition: width .2s ease; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: var(--shadow); overflow: hidden; cursor: pointer; user-select: none;
  }
  .card .stamp {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 14px; border-bottom: 1px solid var(--line);
    font-size: 11px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase;
  }
  .card .stamp b { color: var(--accent-ink); font-weight: 500; }
  .face {
    padding: 46px 22px; min-height: 190px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .face .line { font-size: 26px; font-weight: 600; letter-spacing: -.02em; text-wrap: balance; word-break: keep-all; }
  .face .line.en { font-size: 24px; letter-spacing: -.01em; }
  .prompt { margin-top: 20px; font-size: 12px; color: var(--muted); }

  /* 뒷면 — 자막 판 */
  .plate { background: var(--plate); padding: 24px 20px; text-align: center; }
  .plate .lbl { font-size: 10px; letter-spacing: .14em; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; }
  .plate .txt { font-size: 22px; font-weight: 600; color: var(--on-plate); text-wrap: balance; word-break: keep-all; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .plate { border-top: 1px solid var(--line); }
    :root:not([data-theme="light"]) .plate .txt { color: var(--accent); }
  }
  :root[data-theme="dark"] .plate { border-top: 1px solid var(--line); }
  :root[data-theme="dark"] .plate .txt { color: var(--accent); }
  .plate a { display: inline-block; margin-top: 14px; font-size: 12px; color: var(--muted); text-decoration: none; border-bottom: 1px solid currentColor; }
  .plate .links { display: flex; gap: 16px; justify-content: center; }

  /* 상세 설명 — 헷갈릴 때만 펼친다 */
  .detail {
    margin-top: 12px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 6px; overflow: hidden;
  }
  .detail summary {
    padding: 15px 16px; font-size: 15px; font-weight: 700; color: var(--ink);
    background: var(--accent); cursor: pointer; list-style: none;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .detail summary::-webkit-details-marker { display: none; }
  .detail summary .lbl-txt { display: flex; align-items: center; gap: 8px; }
  .detail summary::after { content: '▾'; font-size: 13px; opacity: .8; }
  .detail[open] summary { border-bottom: 1px solid var(--line); }
  .detail[open] summary::after { content: '▴'; }
  /* 노란 바탕 위 글자는 어느 테마에서든 어두워야 읽힌다 */
  .detail summary, :root[data-theme="dark"] .detail summary { color: #14161a; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .detail summary { color: #14161a; }
  }
  .detail .body {
    padding: 18px 16px 22px; font-size: 15px; line-height: 1.8;
    word-break: keep-all; text-align: left; color: var(--ink);
  }
  .detail .body > * + * { margin-top: 14px; }
  .detail .body p { margin: 0; }

  /* 절 제목 — 자막 모티프에 맞춰 노란 세로선 */
  .detail h4 {
    margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.01em;
    padding-left: 10px; border-left: 3px solid var(--accent); color: var(--ink);
  }

  /* 문단 안에 섞인 영어 — 눈이 걸리게 굵게 + 다른 색 (노랑은 뜻·핵심 전용) */
  .detail .w { font-weight: 700; color: var(--mid); font-style: normal; }
  /* 따옴표로 묶인 한국어 뜻 — 밑줄 */
  .detail .q {
    text-decoration: underline; text-decoration-color: var(--accent);
    text-decoration-thickness: 2px; text-underline-offset: 3px;
  }
  /* 첫 문단은 요약 성격이라 조금 크게 */
  .detail .lead { font-size: 16px; font-weight: 500; }

  /* "짧은 대화:" 같은 꼬리표 */
  .detail .label {
    font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  /* A: / B: 대화 */
  .detail .dlg {
    padding: 12px 14px; background: var(--bg); border-radius: 6px;
    border-left: 3px solid var(--line); display: flex; flex-direction: column; gap: 3px;
  }
  .detail .dlg .who { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .08em; }
  .detail .dlg .en { font-weight: 600; }
  .detail .dlg .ko { color: var(--muted); font-size: 14px; }
  .detail .body > h4 + * { margin-top: 8px; }
  .detail .body > * + h4 { margin-top: 22px; }

  /* 뜻·풀이 화살표 줄 */
  .detail .arrow { color: var(--accent-ink); font-weight: 600; margin: 0; }
  .detail .arrows { display: flex; flex-direction: column; gap: 4px; }

  /* 영어 예시와 그 해석을 한 덩어리로 */
  .detail .ex {
    padding: 12px 14px; background: var(--bg); border-radius: 6px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .detail .ex .en { font-weight: 600; }
  .detail .ex .ko { color: var(--muted); font-size: 14px; }

  /* 핵심 한 줄 — 아침 카톡에 나가는 그 문장 */
  .detail .key {
    padding: 14px 16px; border-radius: 6px; background: var(--plate);
    color: var(--on-plate); font-weight: 600; font-size: 15px;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .detail .key::before { content: '💡'; flex: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .detail .key { border: 1px solid var(--accent); color: var(--accent); }
  }
  :root[data-theme="dark"] .detail .key { border: 1px solid var(--accent); color: var(--accent); }

  .grade { display: none; gap: 8px; margin-top: 12px; }
  .grade.on { display: flex; }
  .grade button {
    flex: 1; padding: 14px 4px; border-radius: 4px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); font-family: inherit; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }
  .grade .g0 { border-color: var(--no); color: var(--no); }
  .grade .g1 { border-color: var(--mid); color: var(--mid); }
  .grade .g2 { border-color: var(--ok); color: var(--ok); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 12px; color: var(--muted); }
  .foot a { color: var(--muted); }

  .done { text-align: center; padding: 34px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  .done h2 { font-size: 18px; margin: 0 0 6px; font-weight: 600; }
  .done p { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .tally { display: flex; gap: 18px; justify-content: center; margin-bottom: 22px; font-size: 11px; color: var(--muted); letter-spacing: .08em; }
  .tally b { display: block; font-size: 24px; font-weight: 600; }
  .btn {
    padding: 12px 18px; border-radius: 4px; border: 1px solid var(--ink); background: var(--ink);
    color: var(--bg); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; margin: 0 4px;
  }
  .btn.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  .empty { text-align: center; color: var(--muted); padding: 48px 12px; font-size: 13px; line-height: 1.7; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>듣보잡 영어 <em>복습 카드</em></h1>
    <div class="counter mono" id="count"></div>
  </header>

  <div class="tabs">
    <button class="tab" id="tabWeek" aria-selected="true">이번 주</button>
    <button class="tab" id="tabAll" aria-selected="false">누적 연습</button>
  </div>

  <div class="modes">
    <button class="mode" data-dir="ko2en" aria-pressed="true">한글 → 영어</button>
    <button class="mode" data-dir="en2ko" aria-pressed="false">영어 → 한글</button>
    <button class="mode" data-dir="mix" aria-pressed="false">섞기</button>
  </div>

  <div class="scrub"><i id="prog"></i></div>
  <div id="stage"></div>

  <div class="foot">
    <span id="footNote"></span>
    <a href="#" id="reset">기록 지우기</a>
  </div>
</div>

<script>
var DATA = {"startDate":"2026-08-24","skipNos":[2,3,5,6,8],"priorNos":[2,3,5,6,8],"cards":[{"no":1,"en":"I WOULDN\u0027T EVEN KNOW WHERE TO START","ko":"어디서부터 시작해야 할지도 모르겠어","url":"https://www.youtube.com/shorts/xOGL7_knAyg","note":"I WOULDN\u0027T EVEN KNOW WHERE TO START\n→ 어디서부터 시작해야 할지도 모르겠어.\n\nstart는 ‘시작하다’이고, where to start는 ‘어디서 시작할지’입니다. 여기서 where는 실제 장소보다는 일의 출발점을 가리킵니다. 방을 정리한다면 옷부터 치울지 책부터 정리할지, 복잡한 사건을 설명한다면 어느 대목부터 이야기할지를 뜻합니다. 할 일이 너무 많거나 사정을 전혀 모르면, 일을 해내기는커녕 출발점조차 정하지 못할 수 있습니다.\n\n그 느낌을 강하게 만드는 말이 even입니다. ‘심지어’라고 기계적으로 옮기기보다 ‘그 가장 기본적인 단계조차’라고 이해하시면 자연스럽습니다. 전체 문장은 “내가 그걸 한다고 해도, 어디서 시작해야 할지조차 모르겠다”라는 흐름입니다. 한국어의 “엄두가 안 나요”, “뭐부터 손대야 할지 막막해요”와 비슷한 감각입니다.\n\nwouldn\u0027t는 여기서 과거를 나타내지 않습니다. ‘내가 그런 상황에 놓인다면’이라는 가정을 배경에 깔아 줍니다. 복잡한 기계를 고쳐 달라는 부탁을 받았을 때, 아직 실제로 수리를 시도하지 않았더라도 이렇게 말할 수 있습니다. 자기 능력을 냉정하게 평가하기도 하고, 상대가 얼마나 어려운 일을 해냈는지 놀라워하는 말로 쓰기도 합니다.\n\n비슷한 표현인 I don\u0027t know where to start는 지금 실제로 무엇부터 해야 할지 모르겠다는 상태를 직접 말합니다. I wouldn\u0027t know where to start는 ‘나라면 맡아도 감이 없겠다’라는 가정의 느낌이 더 살아 있습니다. I won\u0027t start라고 하면 ‘시작하지 않겠다’라는 의지나 미래의 행동을 말하므로, 막막해서 출발점이 안 보인다는 뜻과 달라집니다.\n\n짧은 대화:\nA: Could you build a website like this? / 너도 이런 웹사이트 만들 수 있어?\nB: I wouldn\u0027t even know where to start. / 어디서부터 시작해야 할지도 모르겠어.\n\n이 대답은 단순히 “싫어”라는 거절이 아닙니다. 필요한 지식이나 접근 방법이 없다는 점을 강조합니다. 다만 직접 도움을 요청받은 자리에서는 사실상 거절로 받아들여질 수 있습니다. 반대로 전문가의 작업을 보며 말하면 “나는 시작도 못 하겠는데 정말 대단하다”라는 감탄이 됩니다.\n\n기억 고리: 일을 끝내는 문제가 아니라, 첫발을 어디에 놓을지도 안 보이는 막막함입니다."},{"no":2,"en":"YOUR GUESS IS AS GOOD AS MINE","ko":"나도 너만큼 몰라","url":"https://www.youtube.com/shorts/B4j3i5W4lfc","note":"YOUR GUESS IS AS GOOD AS MINE\n→ 나도 너만큼 몰라.\n\nguess는 확실한 지식 없이 해 보는 ‘추측’입니다. as good as는 둘의 수준이 같다고 비교하는 구조이므로, 글자대로 보면 “네 추측도 내 추측만큼 괜찮다”입니다. 언뜻 상대의 추리 실력을 칭찬하는 것 같지만, 보통은 “내가 가진 정보도 네 것보다 나을 게 없다”라는 뜻으로 사용합니다.\n\n질문을 받은 사람에게 특별한 정보가 있을 거라고 기대했는데, 정작 그 사람도 아는 것이 없는 장면을 떠올리시면 됩니다. “왜 갑자기 회의가 취소됐지?”라는 질문에 이 표현으로 답하면, “내가 추측한다고 더 정확하겠어? 나도 몰라”라는 말입니다. 상대와 자신이 같은 출발선에 있다는 점을 이용해서 무지를 표현하는 것이죠.\n\n한국어의 “내가 알면 너한테 물어보겠냐”와 일부 감각이 통하지만, 그만큼 날카롭거나 짜증 섞인 표현은 아닙니다. 편안하게 말하면 “글쎄, 나도 모르겠네”에 가깝습니다. 특히 이유나 결과를 예측할 근거가 없을 때 잘 어울립니다. 정답이 정해진 문제에서도 쓸 수 있지만, 주로 현재 두 사람 모두 답에 접근할 정보가 없다는 뜻입니다.\n\nI don\u0027t know는 모른다는 사실만 전달합니다. Your guess is as good as mine은 거기에 “나한테 더 나은 답을 기대해도 소용없다”라는 관계적인 의미를 덧붙입니다. 반면 I agree with you는 상대의 의견에 동의한다는 말입니다. 이 표현은 상대의 추측이 옳다고 인정하는 것도, 실제로 두 추측을 비교해서 같은 점수를 주는 것도 아닙니다.\n\n짧은 대화:\nA: Why is the restaurant closed today? / 오늘 식당은 왜 문을 닫았지?\nB: Your guess is as good as mine. / 나도 너만큼 몰라.\n\n상대가 중요한 문제로 진지하게 도움을 구한다면, 이 말만 던지는 것은 다소 무심하게 들릴 수 있습니다. 그러나 함께 버스를 기다리거나 예상 못 한 상황을 지켜보는 사이에서는 자연스러운 반응입니다. “우리 둘 다 모르니 함께 추측할 수밖에 없다”라는 가벼운 동료 의식도 생깁니다.\n\n기억 고리: 네 추측을 높이 평가하는 말이라기보다, 내게도 더 좋은 정보가 없다는 말입니다."},{"no":3,"en":"WORKS LIKE A CHARM","ko":"효과가 아주 좋아","url":"https://www.youtube.com/shorts/xNx0VsGPYlI","note":"WORKS LIKE A CHARM\n→ 효과가 아주 좋아.\n\nwork의 기본 뜻을 ‘일하다’로만 외우면 이 표현이 어색해집니다. 기계나 방법을 주어로 쓰는 work는 ‘제 기능을 하다’, ‘원하는 결과를 내다’라는 뜻입니다. 새 충전기가 제대로 작동하는 것도 work이고, 잠들기 위해 시도한 방법이 실제로 도움이 되는 것도 work입니다. 사람의 노동보다 기능과 효과에 초점이 있습니다.\n\ncharm에는 사람을 끄는 ‘매력’이라는 뜻 외에 ‘부적’이나 ‘주문’이라는 뜻도 있습니다. 여기서는 마법의 힘을 가진 부적이나 주문의 이미지를 떠올리시면 됩니다. 어떤 방법을 썼는데 문제가 신기할 만큼 매끄럽게 해결되면 “마법이라도 부린 것처럼 잘 듣는다”라고 말하는 것입니다. 실제 초자연적인 힘을 믿는다는 뜻은 아닙니다.\n\n한국어에서도 약이 잘 들으면 “귀신같이 잘 듣네”라고 하고, 간단한 요령이 문제를 해결하면 “이거 마법이네”라고 합니다. 같은 방식으로 효과를 인상적으로 표현합니다. 따라서 ‘매력적으로 일한다’가 아니라 ‘아주 잘 작동한다’, ‘효과가 확실하다’로 이해하셔야 합니다. 기계뿐 아니라 요령, 도구, 해결책에도 두루 쓸 수 있습니다.\n\nWorks like a charm은 대화에서 It works like a charm의 주어를 생략한 형태로 자주 등장합니다. 보통 직접 써 보고 효과가 좋았다고 평가하거나, 이미 믿을 만한 방법이라고 소개할 때 사용합니다. “아마 도움이 될지도 몰라”처럼 가능성만 조심스럽게 말하는 표현보다 확신과 만족감이 훨씬 큽니다.\n\n짧은 대화:\nA: Did restarting the router help? / 공유기 다시 켜니까 해결됐어?\nB: Yep. Works like a charm. / 응. 아주 잘 돼.\n\n비슷한 표현인 It works는 일단 작동하거나 효과가 있다는 뜻입니다. It works like a charm은 그 작동이 아주 만족스럽고 매끄럽다는 평가까지 보탭니다. 반면 charming은 보통 사람이나 장소가 매력적이라는 뜻이므로 같은 방향으로 해석하면 안 됩니다. 누군가를 설득하는 방법에도 쓸 수 있지만, 그때도 중심은 사람의 매력이 아니라 방법의 효과입니다.\n\n기억 고리: work는 제 기능을 하는 것이고, like a charm은 마법처럼 잘된다는 만족감을 더합니다."},{"no":4,"en":"THAT\u0027S NOT A THING","ko":"그런 건 없어","url":"https://www.youtube.com/shorts/tUAHzvO7nxc","note":"THAT\u0027S NOT A THING\n→ 그런 건 없어.\n\nthing의 기본 뜻은 ‘것’이나 ‘물건’이지만, 회화에서는 범위가 훨씬 넓습니다. 사람들이 실제로 하는 행동, 인정하는 개념, 통용되는 규칙, 하나의 현상도 a thing이라고 할 수 있습니다. 따라서 여기서 부정하는 것은 반드시 눈에 보이는 물건의 존재가 아닙니다. “그런 게 실제로 성립하느냐”가 핵심입니다.\n\n예를 들어 누군가 “월요일에는 인사를 안 해도 된다는 규칙이 있잖아”라고 말한다면, 이 표현은 “그런 규칙은 없어”라는 뜻이 됩니다. 누군가 엉뚱한 유행을 있는 것처럼 소개한다면 “그런 게 어디 있어”라고 반응할 수도 있습니다. that이 무엇을 가리키느냐에 따라 관습, 제도, 현상, 분류 자체를 부정하는 말이 됩니다.\n\n한국어의 “그런 말이 어디 있어요”, “그런 건 인정 안 되죠”와 연결하시면 감각이 잘 잡힙니다. 다만 화자가 실제로 모든 사실을 조사해서 존재하지 않는다고 증명했다는 뜻은 아닙니다. 자기에게 낯설거나 터무니없게 느껴져서 단정적으로 말할 때도 있습니다. 그래서 상대가 “실제로 있어”라고 반박할 여지가 충분합니다.\n\n비슷한 표현인 That\u0027s not true는 어떤 주장이나 정보가 사실이 아니라고 말합니다. That\u0027s not a thing은 그 주장에 등장하는 개념이나 관행 자체가 성립하지 않는다고 말하는 쪽에 가깝습니다. That\u0027s not my thing은 전혀 다릅니다. 존재는 인정하되 “그건 내 취향이 아니다”, “나는 그런 걸 좋아하지 않는다”라는 뜻입니다.\n\n짧은 대화:\nA: I get a free dessert because it\u0027s my half-birthday. / 오늘 내 반 생일이니까 디저트 공짜로 받는 거지.\nB: That\u0027s not a thing here. / 여기엔 그런 건 없어.\n\n예시의 here는 부정하는 범위를 ‘이곳’으로 좁혀 줍니다. 이런 말이 없으면 훨씬 넓게 “그런 관행 자체가 없다”라고 들릴 수 있습니다. 친한 사이에서는 장난스럽지만, 상대의 문화나 경험을 두고 사용하면 무시하는 말처럼 들리기도 합니다. 단순한 정보 부족을 표현하는 말보다 강한 부정이라는 점을 기억하시면 좋습니다.\n\n기억 고리: 여기서 thing은 물건이 아니라, 실제로 통용되는 하나의 개념이나 관행입니다."},{"no":5,"en":"I\u0027M WITH YOU SO FAR","ko":"여기까지는 이해했어","url":"https://www.youtube.com/shorts/WtYJH0N0BNo","note":"I\u0027M WITH YOU SO FAR\n→ 여기까지는 이해했어.\n\nwith의 기본 감각은 ‘함께’입니다. 실제로 같은 장소에 있는 경우뿐 아니라, 생각이나 설명을 따라가며 함께 움직이는 경우에도 사용할 수 있습니다. 누군가 단계별로 설명할 때 I\u0027m with you라고 하면, “네가 가는 생각의 길을 나도 따라가고 있다”라는 뜻이 됩니다. 그래서 ‘지금 설명을 이해하고 있다’로 자연스럽게 이어집니다.\n\nso far는 ‘지금까지’, ‘여기까지’입니다. 멀리까지 이어진 길에서 현재 도착한 지점을 표시한다고 생각하시면 됩니다. 설명이 아직 끝나지 않았을 때 “현재 단계까지는 따라왔어요”라고 알려 주는 것이죠. 전체 내용을 완전히 이해했다는 선언이 아니라, 중간 점검에 대한 대답입니다.\n\n한국어의 “응, 거기까지는 따라왔어”가 아주 비슷합니다. 상대가 어려운 계산이나 복잡한 사건의 순서를 설명하면서 이해했는지 물을 때 특히 잘 맞습니다. 이 말을 들은 상대는 앞부분을 다시 설명할 필요 없이 다음 단계로 넘어갈 수 있습니다. 듣는 사람이 설명의 흐름에 참여하고 있다는 신호이기도 합니다.\n\n다만 so far를 썼다고 반드시 “이제부터는 못 알아듣겠다”라는 뜻이 되는 것은 아닙니다. 뒤에 반박이나 질문이 이어질 수는 있지만, 그저 설명이 진행 중이라 현재까지의 이해를 표시할 수도 있습니다. 한국어 번역의 ‘는’ 때문에 불필요하게 부정적인 뉘앙스를 강하게 넣지 않는 것이 좋습니다.\n\n짧은 대화:\nA: First, we divide the total by the number of people. / 먼저 총액을 사람 수로 나누는 거야.\nB: I\u0027m with you so far. What happens next? / 여기까지는 이해했어. 다음엔 어떻게 해?\n\n비슷한 표현인 I agree with you는 상대의 의견이 옳다고 동의하는 말입니다. 설명의 논리를 이해하는 것과 그 결론에 찬성하는 것은 다릅니다. I\u0027m with you 자체는 문맥에 따라 지지나 동의도 나타내지만, 설명 도중 so far와 함께 쓰이면 ‘이해하며 따라가고 있다’는 의미가 두드러집니다. “무슨 말인지는 알겠지만 동의하지는 않는다”라는 상태에서도 사용할 수 있습니다.\n\n기억 고리: 상대의 설명을 하나의 길로 보고, 지금 지점까지는 함께 따라왔다는 말입니다."},{"no":6,"en":"THAT DOES IT","ko":"이제 더는 못 참아","url":"https://www.youtube.com/shorts/madiKAnQslA","note":"THAT DOES IT\n→ 이제 더는 못 참아.\n→ 일을 마무리하는 상황에서는 “됐어, 이걸로 끝이야.”\n\ndo는 ‘하다’이지만, 문맥에 따라 ‘필요한 일을 해내다’, ‘충분한 결과를 만들다’라는 뜻도 됩니다. 여기서 it은 앞뒤 상황에서 이미 알려진 일을 가리킵니다. That does it의 공통적인 감각은 “바로 그것이 결정적인 결과를 만든다”입니다. 무엇이 끝나는지는 상황이 정하므로, 항상 화내는 말로만 외우면 놓치는 부분이 생깁니다.\n\n화를 내는 장면에서는 that이 방금 벌어진 마지막 사건을 가리킵니다. 앞에서 여러 번 참았는데 상대가 또 선을 넘었다면, 그 행동이 인내를 끝내는 결정타가 됩니다. 한국어의 “이제 됐어”, “너 이걸로 끝이야”, “더는 못 참아”와 비슷합니다. 지금 막 처음 불쾌해졌다는 말보다, 한계에 도달했다는 느낌이 강합니다.\n\n반대로 수리나 정리를 마무리하는 장면에서는 필요한 일이 끝났다는 뜻입니다. 나사를 마지막으로 조이고 That does it이라고 하면 “됐어, 이걸로 마무리야”가 됩니다. 같은 문장이 정반대처럼 느껴지는 이유는, 한쪽에서는 참는 과정이 끝나고 다른 쪽에서는 작업이 끝나기 때문입니다. 공통점은 마지막 한 번의 행동이 상황을 마무리한다는 것입니다.\n\n비슷한 표현인 That should do it은 “그 정도면 될 거야”라는 예상이 들어갑니다. 실제 결과를 아직 완전히 확인하지 않았거나 조심스럽게 판단하는 말입니다. That does it은 지금 그 행동으로 필요한 선에 도달했다고 더 직접적으로 말합니다. 또 That did it은 과거형이므로, 앞서 한 행동이 효과를 냈거나 문제를 일으켰다는 식으로 결과를 돌아봅니다.\n\n짧은 대화:\nA: He deleted my work again. / 걔가 내 작업물을 또 지웠어.\nB: That does it. I\u0027m changing the password. / 이제 더는 못 참아. 비밀번호 바꿀 거야.\n\n이 예시에서는 비밀번호를 바꾸겠다는 후속 행동이 표현의 뜻을 분명하게 만듭니다. 실제 회화에서도 표정, 억양, 뒤따르는 행동을 함께 보셔야 합니다. 화난 목소리로 강하게 끊으면 최후통첩처럼 들리지만, 작업 후 편안하게 말하면 만족스러운 완료 선언입니다.\n\n기억 고리: 방금 그 일이 마지막 한 방이 되어, 인내든 작업이든 끝에 도달한 것입니다."},{"no":7,"en":"IS THAT RIGHT?","ko":"아, 그래?","url":"https://www.youtube.com/shorts/m4xqO3oxJQI","note":"IS THAT RIGHT?\n→ 아, 그래?\n→ 확인하는 상황에서는 “그게 맞아?”\n\nright의 기본 뜻 가운데 하나는 ‘맞는’, ‘정확한’입니다. 따라서 문장 구조만 보면 “그것이 맞나요?”라는 확인 질문입니다. 그런데 대화에서는 이미 전달받은 말을 다시 확인하는 행동 자체가 관심과 놀라움을 나타낼 수 있습니다. 그래서 실제로는 시험 답안을 검사하듯 정확성을 묻기보다, 상대의 이야기를 받아 주는 반응으로 자주 쓰입니다.\n\n친구가 “다음 달에 이사해”라고 말했을 때 Is that right?라고 하면, 대개 “아, 그래?”, “정말?”에 가깝습니다. 상대가 거짓말을 했다고 의심하는 것이 아니라 새로운 소식을 접했다는 표시입니다. 한국어에서도 “그래요?”는 글자대로라면 사실 여부를 묻지만, 실제로는 상대에게 계속 이야기해 달라는 맞장구가 되곤 합니다.\n\n이 표현은 억양의 영향이 큽니다. 밝게 올려 말하면 흥미나 가벼운 놀라움이 됩니다. 낮고 차갑게 말하거나 right에 힘을 주면 “그래? 정말 그렇단 말이지?”라는 의심이나 도전으로 들릴 수 있습니다. 단어 자체에 항상 친절함이나 비꼼이 들어 있는 것은 아니므로, 한 가지 감정으로 고정해서 외우지 않는 것이 좋습니다.\n\n비슷한 표현인 Is that correct?는 정보가 정확한지를 보다 명시적으로 확인하는 느낌입니다. 계산 결과나 예약 내용을 점검할 때 잘 맞습니다. Are you sure?는 상대의 확신을 묻기 때문에, 이미 들은 내용을 의심하거나 재확인하는 힘이 더 큽니다. Is that right?는 상황에 따라 그런 확인도 할 수 있지만, 가벼운 맞장구로 쓰이는 범위가 넓습니다.\n\n짧은 대화:\nA: I used to live in Busan. / 나 예전에 부산에 살았어.\nB: Is that right? For how long? / 아, 그래? 얼마나 살았는데?\n\n이 대화에서는 뒤에 이어지는 질문이 관심을 분명하게 보여 줍니다. 상대가 부산에 살았다는 주장을 검증하려는 것이 아니라, 새로 알게 된 사실을 받아들이며 대화를 확장하는 것입니다. 반면 영수증 금액을 가리키며 같은 말을 하면 정말 계산이 맞는지 묻는 질문이 됩니다. 먼저 ‘소식에 대한 반응인지, 정보 검증인지’를 구분하시면 자연스럽게 해석됩니다.\n\n기억 고리: “맞아?”라는 확인의 모양으로, 실제 대화에서는 “아, 그래?”라는 관심을 건넬 수 있습니다."},{"no":8,"en":"COMES WITH THE TERRITORY","ko":"그 일을 하면 감수해야 하는 거야","url":"https://www.youtube.com/shorts/vDjn7uwvgEQ","note":"COMES WITH THE TERRITORY\n→ 그 일을 하면 감수해야 하는 거야.\n\ncome with는 어떤 것이 다른 것에 ‘함께 따라오다’라는 뜻입니다. 물건을 사면 설명서가 딸려 오고, 큰 집을 가지면 관리할 일도 함께 늘어납니다. territory의 기본 뜻은 ‘영역’, ‘지역’입니다. 이 표현에서는 직업이나 역할, 처한 상황을 하나의 영역처럼 바라봅니다. 그 영역에 들어가면 자연스럽게 따라오는 조건이 있다는 것입니다.\n\n예를 들어 식당을 운영하면 손님이 몰리는 시간에 바쁜 것이 따라오고, 유명해지면 사생활에 대한 관심이 따라올 수 있습니다. 그 일을 선택하면서 좋은 부분만 떼어 가지고 불편한 부분을 완전히 제거하기는 어렵다는 감각입니다. 한국어의 “그 일을 하려면 그 정도는 감수해야죠”, “그 자리에 있으면 따라오는 일이죠”와 연결됩니다.\n\n목록의 표현은 보통 It comes with the territory에서 주어가 생략된 형태로 쓰입니다. 앞서 언급한 문제나 부담을 it으로 받아 말하는 것입니다. 문장에 ‘나쁜 일’이라는 단어가 없는데도 부담을 설명하는 경우가 많은 이유는, 불편한 일을 두고 “왜 이런 것까지 해야 해?”라고 할 때 이 표현이 유용하기 때문입니다. 다만 본질적으로 부정적인 결과에만 한정되는 말은 아닙니다.\n\n비슷한 표현인 That\u0027s part of the job은 업무의 일부라는 뜻을 직접 말합니다. Comes with the territory는 직무 목록에 명시되지 않아도 역할상 자연스럽게 따라오는 조건까지 포함합니다. 또 It\u0027s your fault는 책임이나 잘못을 따지는 말이지만, 이 표현 자체는 잘못을 비난하기보다 상황에 수반되는 현실을 설명합니다.\n\n짧은 대화:\nA: Do you have to work weekends as a chef? / 요리사는 주말에도 일해야 해?\nB: Sometimes. It comes with the territory. / 가끔은. 이 일을 하면 감수해야 하는 거야.\n\n자신의 어려움을 담담하게 말할 때는 현실을 받아들이는 태도가 느껴집니다. 그러나 남이 겪는 심각한 문제를 향해 무심하게 말하면 “원래 그런 거니까 참아”처럼 들릴 수 있습니다. 어떤 일이 흔히 따라온다는 것과 그것이 정당하거나 반드시 개선할 수 없다는 것은 별개의 문제입니다. 표현의 핵심은 동반되는 조건이지, 모든 불편을 정당화하는 데 있지는 않습니다.\n\n기억 고리: 어떤 영역에 들어가면, 그 영역에 딸린 조건도 함께 따라옵니다."},{"no":9,"en":"WOULDN\u0027T THAT BE SOMETHING?","ko":"그렇게 되면 정말 대단하겠다","url":"https://www.youtube.com/shorts/_ONdvsvycik","note":"WOULDN\u0027T THAT BE SOMETHING?\n→ 그렇게 되면 정말 대단하겠다.\n\nsomething의 기본 뜻은 특정하지 않은 ‘무언가’입니다. 그런데 사람이나 사건을 두고 특별한 억양으로 something이라고 하면, 단순히 존재하는 무엇이 아니라 ‘보통이 아닌 것’, ‘눈에 띄는 것’이라는 평가가 실릴 수 있습니다. 한국어의 “그거 참 물건이네”, “정말 한 건이겠다”처럼 구체적인 형용사 없이 특별함을 나타내는 방식입니다.\n\nwould be는 아직 현실이 아닌 상황을 머릿속으로 그립니다. 따라서 Wouldn\u0027t that be something?은 “그 일이 실제로 일어난다면 꽤 특별하지 않겠어?”라는 흐름입니다. 부정 의문문의 형태로 상대에게 감탄을 함께 나누자고 하는 것입니다. 특별하지 않을 거라는 부정적인 예측이 아니라, 오히려 ‘참 대단하겠다’라는 반응을 기대하는 경우가 많습니다.\n\n예를 들어 무명인 친구의 노래가 세계적으로 인기를 얻는 상황을 상상하며 사용할 수 있습니다. 한국어로 “그렇게 되면 진짜 볼 만하겠다”, “와, 그러면 엄청나겠다”라고 하는 느낌입니다. 결과가 좋은 쪽이면 기대와 감탄이 되고, 터무니없거나 우스운 상황이면 놀라움이나 빈정거림이 섞일 수도 있습니다.\n\n비슷한 표현인 Wouldn\u0027t that be nice?는 그 일이 기분 좋고 바람직하다는 쪽에 초점이 있습니다. Wouldn\u0027t that be something?은 그 일이 인상적이거나 특별하다는 쪽에 더 열려 있습니다. 반드시 ‘좋다’만을 뜻하지는 않는 것이죠. 또 Isn\u0027t that something?은 눈앞에 벌어졌거나 이미 알려진 사실에 감탄할 때 자연스럽고, wouldn\u0027t는 상상 속 가능성과 더 잘 어울립니다.\n\n짧은 대화:\nA: Imagine if our little film won an award. / 우리 작은 영화가 상이라도 받는다고 상상해 봐.\nB: Wouldn\u0027t that be something? / 그렇게 되면 정말 대단하겠다.\n\n여기서 대답하는 사람은 수상 가능성을 분석하거나 성공을 약속하지 않습니다. 상대가 꺼낸 상상을 잠시 함께 바라보며 그 의미를 즐기는 것입니다. 그래서 확률이 낮아도 사용할 수 있습니다. “진짜 그렇게 되겠어?”라고 의심하는 말과 달리, 우선 그 장면이 얼마나 특별할지를 감정적으로 공유하는 데 중심이 있습니다.\n\n기억 고리: something을 ‘보통 아닌 일’로 잡으면, 아직 오지 않은 특별한 장면에 함께 감탄하는 말입니다."},{"no":10,"en":"WHO AM I KIDDING?","ko":"내가 누굴 속이겠어","url":"https://www.youtube.com/shorts/GsrM81O0x6I","note":"WHO AM I KIDDING?\n→ 내가 무슨 말도 안 되는 소리를 하는 거야.\n\nkid는 명사로 ‘아이’이지만, 동사로는 ‘농담하다’, ‘놀리다’, ‘속이다’라는 뜻이 있습니다. 여기서는 아이와 연결해서 해석할 필요가 없습니다. Who am I kidding?은 글자대로 “내가 지금 누구를 속이고 있는 거지?”입니다. 대개 실제로 속이고 있는 사람의 이름을 묻는 질문이 아니라, 자기 말이나 생각이 현실과 맞지 않는다는 것을 스스로 깨닫는 말입니다.\n\n예를 들어 매일 늦잠을 자던 사람이 “내일부터 새벽 다섯 시에 일어나야지”라고 말한 뒤 이 표현을 붙일 수 있습니다. 앞의 다짐이 불가능하다고 논리적으로 증명하는 것이 아니라, 자기 습관을 생각하면 너무 낙관적인 소리였다고 인정하는 것입니다. “남은커녕 나 자신도 못 속이겠네”라는 자각에 가깝습니다.\n\n한국어의 “내가 그렇지, 무슨”, “말은 잘한다”, “내가 지금 무슨 꿈같은 소리를 하냐”와 닮았습니다. 진지한 자기반성에도 쓰지만, 자기 약점을 가볍게 웃어넘기는 말로도 많이 사용합니다. 중요한 점은 앞서 한 말에서 한발 물러나 현실적인 판단으로 돌아온다는 흐름입니다.\n\n비슷한 표현인 Who are you kidding?은 대상을 상대방으로 바꿉니다. “지금 누구를 속이려고 해?”라는 뜻이 되어 상대의 말이 설득력 없다고 지적하므로 훨씬 공격적으로 들릴 수 있습니다. I\u0027m kidding은 “농담이야”라는 뜻입니다. Who am I kidding?은 앞말이 단순한 농담이었다고 설명하는 것이 아니라, 스스로도 믿기 어려운 말이었다고 인정합니다.\n\n짧은 대화:\nA: Are you going to save the rest of the cake? / 남은 케이크는 나중에 먹을 거야?\nB: Yeah… Who am I kidding? I\u0027ll eat it now. / 응… 내가 무슨 말도 안 되는 소리를 하냐. 지금 먹을 거야.\n\n이 대화에서 화자는 상대를 속이려다가 발각된 것이 아닙니다. 잠깐 그럴듯하게 말해 봤지만 자기 욕구를 알고 있어서 곧바로 말을 고칩니다. 그래서 문장 중간에 잠시 멈추었다가 이 표현을 말하면, 스스로 정신을 차리는 느낌이 살아납니다. 자기비하로만 외우기보다 ‘희망 섞인 말에서 현실로 돌아오는 전환점’으로 이해하시면 활용하기 쉽습니다.\n\n기억 고리: 남을 속이는 문제가 아니라, 나 자신도 안 믿는 소리를 했다는 자각입니다."},{"no":11,"en":"THAT\u0027S A BIG IF","ko":"그 ‘만약’부터가 불확실하잖아","url":"https://www.youtube.com/shorts/gtCUMeUjWW0","note":"THAT\u0027S A BIG IF\n→ 그 ‘만약’부터가 불확실하잖아.\n\nif는 보통 ‘만약 ~라면’이라는 조건을 이끄는 말입니다. 그런데 이 표현에서는 a가 붙은 명사처럼 사용됩니다. 상대가 말한 조건 하나를 떼어 내어 “바로 그 ‘만약’”이라고 부르는 것입니다. big 역시 물리적인 크기보다는 그 조건에 걸린 불확실성이나 중요성이 크다는 뜻으로 이해하시면 됩니다.\n\n누군가 “투자만 받으면 바로 사업을 확장할 수 있어”라고 말한다고 생각해 보세요. 듣는 사람은 확장 계획 자체보다 ‘투자를 받는다’는 전제가 얼마나 확실한지 문제 삼을 수 있습니다. That\u0027s a big if는 “그 조건이 충족된다는 걸 너무 쉽게 넘어가는 거 아니야?”라는 지적입니다. 계획의 뒷부분을 논의하기 전에 앞부분의 불확실성을 보자는 것입니다.\n\n한국어의 “일단 그게 돼야 말이지”, “그 ‘되면’이 문제잖아요”와 사고방식이 같습니다. 어떤 결과가 조건부로는 가능하더라도, 그 조건 자체가 성립하기 어려우면 현실적인 계획으로 보기 어렵습니다. 이 표현은 바로 그 간격을 짚습니다. 조건이 얼마나 중대한지 강조할 수는 있지만, 반드시 절대로 불가능하다고 단정하는 것은 아닙니다.\n\n비슷한 표현인 That\u0027s impossible은 실현 가능성을 훨씬 강하게 부정합니다. That\u0027s a big if는 가능성은 남겨 두되, 확실한 전제로 삼기에는 부담이 크다고 말합니다. What if는 “만약 이러면 어떨까?” 하고 새로운 조건을 꺼내는 표현이고, a big if는 이미 나온 조건을 평가하는 표현이라는 차이도 있습니다.\n\n짧은 대화:\nA: If we win the contract, we can hire five more people. / 계약을 따내면 다섯 명 더 뽑을 수 있어.\nB: That\u0027s a big if. We haven\u0027t even submitted a proposal. / 그 ‘만약’부터가 불확실하잖아. 아직 제안서도 안 냈어.\n\n이 예시에서 반대하는 사람은 채용 자체를 싫어하는 것이 아닙니다. 계약 성사를 당연한 일처럼 놓고 이야기하는 태도를 경계합니다. 그래서 토론이나 계획 회의에서 유용하지만, 상대의 기대를 한순간에 꺾을 수도 있습니다. 말의 중심을 ‘네 계획이 틀렸다’보다 ‘그 계획의 핵심 조건이 아직 확보되지 않았다’에 두시면 뉘앙스가 정확해집니다.\n\n기억 고리: 결과보다 먼저, 그 결과를 가능하게 할 ‘만약’이 얼마나 불확실한지 보자는 말입니다."},{"no":12,"en":"ONE LESS THING TO WORRY ABOUT","ko":"걱정거리 하나 줄었네","url":"https://www.youtube.com/shorts/zb2i_BMD6Jg","note":"ONE LESS THING TO WORRY ABOUT\n→ 걱정거리 하나 줄었네.\n\nthing은 여기서 ‘일’이나 ‘문제’를 뜻하고, to worry about은 그 일이 어떤 종류인지 설명합니다. 즉 thing to worry about은 ‘걱정할 일’입니다. 여기에 one less가 붙으면 기존에 여러 개 있던 걱정거리 가운데 하나가 줄었다는 뜻이 됩니다. 전체 걱정이 사라졌다는 말이 아니라, 부담의 목록에서 한 항목을 지운다는 감각입니다.\n\n한국어의 “한시름 덜었네요”와 아주 가깝습니다. 여행 준비를 하면서 숙소, 교통, 짐, 날씨를 모두 신경 쓰고 있었는데 숙소 예약이 확정되면 이렇게 말할 수 있습니다. 해결된 일이 인생을 바꿀 정도로 크지 않아도 괜찮습니다. 머릿속에서 계속 확인하던 일을 더는 붙잡고 있지 않아도 된다는 안도감이 중심입니다.\n\n목록의 형태는 완전한 문장이라기보다, 상황에 맞춰 바로 꺼내는 명사구입니다. That\u0027s one less thing to worry about에서 앞부분을 생략한 것으로 이해하셔도 좋습니다. 이런 생략은 회화에서 자연스럽습니다. 상대가 문제를 해결해 주었을 때 반응으로 쓰기도 하고, 자신이 일을 하나 끝낸 뒤 혼잣말처럼 하기도 합니다.\n\nless는 줄어든 양을 나타냅니다. one less thing 전체를 ‘일 하나가 덜 있는 상태’로 잡으시면 됩니다. 셀 수 있는 명사 앞에서는 fewer를 배운 학습자가 낯설게 느낄 수 있지만, one less thing은 자연스럽게 굳어진 일상 표현입니다. 여기서 중요한 것은 문법 규칙을 억지로 끼워 맞추는 것보다 ‘기존보다 하나 줄었다’라는 비교의 기준을 보는 것입니다.\n\n짧은 대화:\nA: I\u0027ve already booked the hotel. / 호텔은 내가 벌써 예약했어.\nB: Great. One less thing to worry about. / 잘됐다. 걱정거리 하나 줄었네.\n\n비슷한 표현인 Nothing to worry about은 ‘걱정할 것이 없다’는 뜻으로, 해당 상황에 대한 걱정 자체를 덜어 줍니다. One less thing to worry about은 다른 걱정은 남아 있을 수 있음을 전제로 합니다. 또 One more thing to worry about이라고 하면 반대로 부담이 하나 추가됩니다. 같은 목록에서 항목 하나를 지우는지 더하는지에 따라 감정이 정반대로 바뀌는 셈입니다.\n\n기억 고리: 머릿속 걱정 목록에서 체크 표시 하나를 지우며 내쉬는 안도의 말입니다."},{"no":13,"en":"NOT BY A LONG SHOT","ko":"어림도 없어","url":"https://www.youtube.com/shorts/X70Pw7FUwl8","note":"NOT BY A LONG SHOT\n→ 전혀 아니야.\n→ 정도의 차이를 말할 때는 “아직 한참 멀었어.”\n\nshot의 기본 뜻 가운데 하나는 ‘발사’나 ‘한 번의 시도’입니다. long shot을 이해할 때는 멀리 있는 목표를 겨누는 장면을 보조 이미지로 떠올릴 수 있습니다. 다만 이 표현 전체를 해석할 때 핵심은 특정한 역사적 유래를 상상하는 데 있지 않고, ‘목표나 기준에 가까이 가지도 못했다’라는 강한 거리감에 있습니다.\n\nNot by a long shot은 보통 앞의 질문이나 판단을 단호하게 부정합니다. “거의 끝났어?”라는 질문에 쓰면 “아니, 아직 한참 남았어”가 됩니다. “그 사람이 최고의 선수야?”라는 말에 쓰면 “전혀 아니야”, “최고라고 하기엔 한참 멀었어”가 됩니다. 단순히 기준을 조금 못 넘은 정도가 아니라 차이가 크다는 느낌입니다.\n\n한국어의 “어림도 없죠”, “택도 없어요”, “아직 멀었어요”와 통합니다. 따라서 언제나 똑같이 ‘절대로’라고 번역하기보다는 무엇을 부정하는지 보셔야 합니다. 완료 여부를 묻는 상황에서는 남은 일이 많다는 뜻이고, 비교 평가에서는 상대가 제시한 수준과 실제 수준 사이에 큰 간격이 있다는 뜻입니다.\n\n비슷한 표현인 Not quite는 “완전히 그렇지는 않다”, “조금 부족하다”처럼 상대적으로 부드러운 부정에 잘 어울립니다. Not by a long shot은 그보다 훨씬 강하게 거리를 벌립니다. 또 It\u0027s a long shot은 어떤 시도가 성공할 가능성이 낮다는 뜻입니다. Not by a long shot 전체를 ‘가능성이 낮지 않다’처럼 조각내어 계산하면 실제 의미와 어긋납니다.\n\n짧은 대화:\nA: Are we done packing? / 우리 짐 다 싼 거야?\nB: Not by a long shot. We still have three rooms left. / 아직 한참 멀었어. 방이 세 개나 남았잖아.\n\n이 대답에는 “거의 끝났다고 생각했다면 상황을 잘못 본 거야”라는 교정의 힘이 있습니다. 그래서 친한 사이에서는 실감 나는 반응이지만, 다른 사람의 실력이나 성과를 평가할 때는 상당히 냉정하게 들릴 수 있습니다. 단순한 no보다 훨씬 강한 표현이라는 점을 염두에 두시면 좋습니다. 그 강함은 미래가 영원히 불가능하다는 뜻이 아니라, 지금 제시한 판단이 실제와 멀다는 데서 나옵니다.\n\n기억 고리: 살짝 빗나간 것이 아니라, 맞다고 하기에는 기준에서 한참 떨어져 있다는 부정입니다."},{"no":14,"en":"DON\u0027T HOLD THAT AGAINST ME","ko":"그걸로 나 나쁘게 보진 마","url":"https://www.youtube.com/shorts/p8amDqyC7WI","note":"DON\u0027T HOLD THAT AGAINST ME\n→ 그걸로 나 나쁘게 보진 마.\n\nhold의 기본 감각은 무언가를 ‘잡고 놓지 않다’입니다. against는 서로 맞서거나 반대 방향에 놓인 관계를 나타냅니다. hold something against someone이라는 덩어리는 어떤 일을 마음에 붙들어 두고, 그 사람을 나쁘게 평가하는 이유로 삼는다는 뜻입니다. 과거의 실수나 마음에 들지 않는 특징을 계속 불리한 증거처럼 가지고 있는 모습을 떠올리시면 됩니다.\n\n따라서 Don\u0027t hold that against me는 “그 사실을 나한테 불리하게 계속 들이대지는 말아 줘”라는 흐름입니다. 한국어의 “그걸로 미워하지는 마요”, “그거 하나 가지고 사람 판단하지 마세요”와 연결됩니다. that은 방금 말한 실수일 수도 있고, 상대와 다른 취향이나 조금 민망한 고백일 수도 있습니다.\n\n예를 들어 유명한 영화를 한 번도 본 적이 없다고 밝힌 뒤 장난스럽게 사용할 수 있습니다. 실제로 큰 잘못을 저지른 상황뿐 아니라, 상대가 의외라고 생각할 만한 사실을 말할 때도 쓰는 것입니다. “나 이런 면이 있는데, 그렇다고 나를 너무 깎아 보지는 마”라는 가벼운 방어막이 됩니다.\n\n비슷한 표현인 Don\u0027t blame me는 책임을 자신에게 돌리지 말라는 뜻입니다. Don\u0027t hold that against me는 책임 소재보다 상대가 자신에게 부정적인 감정을 갖거나 평가를 낮추는 것을 걱정합니다. 또 Don\u0027t hold it against him이라고 하면 제삼자를 두둔하는 말이 됩니다. 잘못이 없다고 주장하는 것과, 그 일 때문에 계속 나쁘게 보지 말라고 부탁하는 것은 다릅니다.\n\n짧은 대화:\nA: You\u0027ve never seen Star Wars? / 스타워즈를 한 번도 안 봤다고?\nB: No. Don\u0027t hold that against me. / 응. 그걸로 나 나쁘게 보진 마.\n\n진지한 갈등에서는 과거의 일을 앞으로도 계속 들춰내지 말아 달라는 의미로 들릴 수 있습니다. 하지만 이 한마디만으로 사과를 대신할 수 있는 것은 아닙니다. 상대가 실제로 피해를 입었다면 “그냥 넘어가 달라”는 요구로 느껴질 수 있기 때문입니다. 친근한 농담에서는 가볍고 귀엽지만, 무거운 잘못을 두고 쓰면 자기 편의적인 말이 될 수 있다는 상황 차이를 보시면 좋습니다.\n\n기억 고리: 그 일을 마음속에 붙잡아 두고 나를 깎아내리는 근거로 쓰지는 말아 달라는 부탁입니다."},{"no":15,"en":"I WOULDN\u0027T COUNT ON IT","ko":"너무 기대하진 않겠어","url":"https://www.youtube.com/shorts/SR-Dhiu2tnY","note":"I WOULDN\u0027T COUNT ON IT\n→ 너무 기대하진 않겠어.\n\ncount의 가장 익숙한 뜻은 ‘세다’입니다. count on의 감각을 잡을 때는 계획을 세우면서 어떤 사람이나 결과를 믿을 만한 요소로 계산에 넣는 장면이 도움이 됩니다. 누군가를 count on한다는 것은 그 사람이 필요한 역할을 해 줄 것이라고 믿고 의지한다는 뜻입니다. 단순히 숫자를 세는 행위와 같지는 않지만, ‘믿고 셈에 넣는다’라는 연결이 이해에 유용합니다.\n\nit이 앞으로 일어날 수 있는 일을 가리키면 count on it은 ‘그 일이 일어날 것으로 믿고 기대하다’가 됩니다. 예를 들어 친구가 차를 빌려줄 것이라고 생각해서 다른 교통편을 알아보지 않는다면, 그 가능성을 계획의 확실한 재료로 삼고 있는 것입니다. 이 표현은 그렇게까지 믿어도 되는지 조심하라고 말합니다.\n\nwouldn\u0027t는 여기서 과거의 거절이 아닙니다. “나라면 그렇게 기대하지 않겠다”라는 가정적인 판단을 나타냅니다. 상대가 놓인 상황을 자신에게 대입해서 조언하는 느낌입니다. 꼭 특정한 조건절이 문법적으로 생략되었다고 단정할 필요는 없지만, ‘내가 판단한다면’이라는 거리를 두는 효과가 있어 직접적인 명령보다 부드럽게 경고할 수 있습니다.\n\n비슷한 표현인 I won\u0027t count on it은 앞으로 자신이 그것에 기대지 않겠다는 결정에 더 가깝습니다. I wouldn\u0027t count on it은 상대의 기대를 낮추는 조언으로 자주 쓰입니다. 또 It won\u0027t happen은 그 일이 일어나지 않을 것이라고 결과를 예측하지만, 이 표현은 가능성을 완전히 닫기보다 ‘확실한 것으로 믿기에는 부족하다’는 데 초점이 있습니다.\n\n짧은 대화:\nA: Do you think he\u0027ll finish it tonight? / 걔 오늘 밤에 그거 끝낼 것 같아?\nB: I wouldn\u0027t count on it. / 너무 기대하진 않겠어.\n\n이 말을 들었다고 반드시 포기해야 한다는 뜻은 아닙니다. 혹시 안 되더라도 곤란하지 않도록 다른 선택지를 마련하라는 취지일 수 있습니다. 한국어의 “그거 믿고 있다가 낭패 보지 마요”와 닮았습니다. 말투가 무심하거나 단호하면 사실상 “거의 안 될걸”이라는 강한 회의감도 전달되지만, 표현의 기본 중심은 기대의 신뢰도를 낮추는 데 있습니다.\n\n기억 고리: 일어날 수도 있지만, 확실한 일처럼 계산에 넣고 기대하지는 말라는 뜻입니다."},{"no":16,"en":"I REST MY CASE","ko":"이걸로 내 말이 맞다는 게 증명됐네","url":"https://www.youtube.com/shorts/VOF6ntV8oXc","note":"I REST MY CASE\n→ 이걸로 내 말이 맞다는 게 증명됐네.\n\ncase는 ‘상자’라는 뜻도 있지만, 여기서는 자신의 입장을 뒷받침하는 ‘논거’나 법정의 ‘사건’을 가리킵니다. rest는 보통 ‘쉬다’이지만, 법정에서 자신의 입증을 마친다는 맥락으로 쓰입니다. I rest my case는 법정에서는 더 이상의 증거 제시를 마치겠다는 말이고, 일상에서는 그 장면을 빌려 자신의 주장이 충분히 뒷받침되었다고 선언합니다.\n\n예를 들어 “저 사람은 늘 약속에 늦는다”라고 이야기하고 있는데, 바로 그 사람이 또 늦는다는 연락을 보내왔다고 생각해 보세요. 이때 I rest my case라고 하면 “봐요, 제가 더 설명할 필요가 없잖아요”라는 뜻입니다. 방금 벌어진 일이 자기 주장의 증거가 되었다는 것을 재치 있게 강조하는 것입니다.\n\n한국어의 “내 말이 그 말이라니까요”, “이쯤 되면 더 말할 것도 없죠”와 비슷합니다. 다만 단순히 대화를 끝내고 싶다는 뜻은 아닙니다. 자신이 옳다는 쪽으로 논쟁이 정리되었다고 보는 태도가 들어갑니다. 그래서 상대가 인정하지 않았더라도, 화자 혼자 승리를 선언하는 듯이 들릴 수 있습니다.\n\n비슷한 표현인 I\u0027m done talking은 더 이상 말하지 않겠다는 뜻으로, 지쳤거나 대화를 거부할 때도 쓸 수 있습니다. I rest my case는 말하지 않는 이유가 ‘이미 충분한 증거가 나왔다’는 데 있습니다. 또 법정에서 이 말을 했다고 재판에서 실제로 이겼다는 뜻은 아닙니다. 일상적인 쓰임에서 나타나는 “내 말이 증명됐다”라는 뉘앙스와 법적 결과를 구분하셔야 합니다.\n\n짧은 대화:\nA: You said this printer always breaks. It just stopped again. / 네가 이 프린터 맨날 고장 난다고 했지? 방금 또 멈췄어.\nB: I rest my case. / 이걸로 내 말이 맞다는 게 증명됐네.\n\n가벼운 대화에서는 상황이 너무 절묘하게 맞아떨어졌을 때 웃음을 만드는 표현입니다. 반면 진지한 갈등에서 반복하면 상대 말을 들을 생각이 없다는 인상을 줄 수 있습니다. 스스로 “증거는 끝났다”라고 선언하는 말이기 때문입니다. 실제 논증의 완성도와 별개로, 화자가 ‘더 설명할 필요가 없다’고 느낀다는 점을 읽으시면 정확합니다.\n\n기억 고리: 내 주장을 뒷받침하는 장면이 나왔으니, 더 증거를 낼 필요도 없다는 선언입니다."},{"no":17,"en":"GET A LOAD OF THIS","ko":"이것 좀 봐","url":"https://www.youtube.com/shorts/vx1lP2q2JW0","note":"GET A LOAD OF THIS\n→ 이것 좀 봐.\n\nload의 기본 뜻은 짐이나 한 번에 실리는 ‘분량’입니다. 이 표현은 단어를 하나씩 직역해서 “이것의 짐을 받아라”라고 이해하면 뜻이 연결되지 않습니다. 덩어리 전체가 상대의 주의를 강하게 끌어 “이것을 한번 보거나 들어 보라”는 회화 표현으로 쓰입니다. 의미를 기억할 때는 눈이나 귀로 들어오는 정보를 한 덩어리 받아 보라는 이미지를 보조적으로 활용할 수 있습니다.\n\n그냥 정보를 전달하기보다, 상대가 보고 놀라거나 웃거나 어이없어할 만한 것을 소개할 때 잘 어울립니다. 황당한 가격표, 기묘한 사진, 예상 못 한 문자 메시지를 보여 주기 직전에 꺼내는 식입니다. 한국어의 “야, 이것 좀 봐요”, “이 얘기 한번 들어 봐요”처럼 반응을 미리 끌어올리는 말입니다.\n\nthis가 가리키는 대상이 꼭 눈앞에 있는 물건일 필요는 없습니다. 바로 다음에 할 이야기일 수도 있습니다. 그래서 상황에 따라 “이것 좀 들어 봐”가 더 자연스러운 번역이 됩니다. 중심은 시각인지 청각인지가 아니라, ‘지금부터 네 주의를 끌 만한 것이 있다’는 예고입니다.\n\n비슷한 표현인 Look at this는 대상을 보라고 비교적 직접적으로 말합니다. Get a load of this에는 “이거 꽤 놀랍지?”, “이거 정말 황당해”라는 화자의 평가가 미리 묻어나기 쉽습니다. Check this out도 흥미로운 것을 보여 줄 때 자주 쓰지만, Get a load of this는 특히 놀람이나 조롱을 담은 소개에 잘 어울립니다. 그렇다고 언제나 비꼬는 뜻으로 한정되는 것은 아닙니다.\n\n짧은 대화:\nA: Get a load of this. They want twenty dollars for a coffee. / 이것 좀 봐. 커피 한 잔에 20달러를 달래.\nB: You\u0027re joking. / 농담이지?\n\n이 대화에서는 가격이 지나치다는 평가가 표현의 분위기를 결정합니다. 신기한 발명품을 보여 주면 감탄을 유도하는 말이 될 수 있습니다. 반면 사람을 가리키며 사용하면 그 사람을 구경거리로 삼거나 우습게 보는 느낌이 생길 수 있으므로, 사물을 소개할 때와 같은 가벼움으로 받아들여지지 않을 수 있습니다. 친근하고 구어적인 주의 환기 표현이라는 점도 함께 기억하시면 좋습니다.\n\n기억 고리: 단순히 보라는 말에, “네가 반응할 만한 게 여기 있어”라는 예고를 얹는 표현입니다."},{"no":18,"en":"I\u0027LL GRANT YOU THAT","ko":"그 점은 인정할게","url":"https://www.youtube.com/shorts/41xouw08M9s","note":"I\u0027LL GRANT YOU THAT\n→ 그 점은 인정할게.\n\ngrant의 기본 감각은 무엇을 공식적으로 ‘주다’, ‘허락하다’, ‘인정하다’입니다. 돈이나 권리를 부여하는 데 쓰이기도 하지만, 논의에서는 상대가 제시한 어떤 점을 타당한 것으로 인정한다는 뜻이 됩니다. I\u0027ll grant you that은 “네가 말한 그 부분은 내가 인정해 줄게”라는 구조입니다.\n\n중요한 것은 that이 가리키는 범위입니다. 보통 상대의 주장 전체가 아니라 특정한 사실이나 장점 하나를 가리킵니다. 어떤 휴대전화가 비싸다고 비판하면서도 “성능이 좋은 건 인정할게”라고 말할 수 있습니다. 상대에게 논점 하나를 내어 주되, 자기의 전체적인 판단까지 철회하지는 않는 것입니다.\n\n한국어의 “그건 그렇죠”, “그 점은 인정해요”와 닮았습니다. 특히 뒤에 but을 붙여 다른 문제를 제기하기 좋습니다. “편한 건 인정하지만 너무 비싸다”라는 식입니다. 다만 반드시 뒤에 반박이 나와야 하는 문법 규칙은 아닙니다. 독립적으로 말해도 상대가 지적한 부분을 받아들이는 반응이 됩니다.\n\nwill은 여기서 먼 미래에 인정하겠다는 약속보다, 지금 대화에서 인정하기로 하는 태도를 나타냅니다. 한국어의 “그래, 그 부분은 인정할게”와 같은 현재의 양보입니다. grant가 약간 격식 있는 단어여서, 가벼운 말싸움에서는 논쟁의 심판처럼 장난스러운 느낌이 나기도 합니다. 억양에 따라 마지못해 인정하는 듯한 분위기도 생깁니다.\n\n짧은 대화:\nA: This apartment is expensive, but the location is great. / 이 아파트는 비싸지만 위치는 정말 좋잖아.\nB: I\u0027ll grant you that, but it\u0027s too small. / 그 점은 인정할게. 그래도 너무 좁아.\n\n비슷한 표현인 I agree with you는 상대의 의견에 동의한다는 뜻이며, 문맥에 따라 더 넓은 동의를 나타낼 수 있습니다. I\u0027ll grant you that은 ‘바로 그 점’으로 범위를 한정하는 힘이 더 두드러집니다. You win은 상대가 논쟁에서 이겼다고 인정하는 말이지만, 여기서는 논쟁 전체의 승패가 결정되지 않았을 수 있습니다. 상대의 장점을 인정하면서 자기 판단을 유지하는 장면에 특히 잘 맞습니다.\n\n기억 고리: 주장 전체를 받아들이는 대신, 상대에게 논점 하나를 인정해 주는 말입니다."},{"no":19,"en":"COULD\u0027VE FOOLED ME","ko":"난 전혀 그렇게 안 보이던데","url":"https://www.youtube.com/shorts/AKse2KXC5m8","note":"COULD\u0027VE FOOLED ME\n→ 난 전혀 그렇게 안 보이던데.\n\nfool은 명사로 ‘바보’이지만, 동사로는 ‘속이다’입니다. could\u0027ve는 could have의 줄임말이므로, 완전한 형태를 떠올리면 “나를 속일 수도 있었겠다” 정도가 됩니다. 그러나 이 표현은 보통 사기꾼의 능력을 칭찬하지 않습니다. 상대가 설명한 사실과 자신이 겉으로 보고 받은 인상이 정반대일 때 쓰는 관용적인 반응입니다.\n\n누군가 “걔는 정말 신나 있어”라고 말하는데, 당사자는 내내 무표정했다고 생각해 보세요. Could\u0027ve fooled me는 “그렇다니 알겠지만, 내가 보기에는 전혀 안 그랬어”라는 뜻입니다. 겉모습만으로 판단했다면 사실과 반대로 믿었을 것이라는 감각입니다. 한국어의 “말 안 했으면 전혀 몰랐겠다”, “난 딱 반대인 줄 알았는데요”와 연결됩니다.\n\n여기서 속인 주체를 실제 사람 하나로 찾으려고 하면 어색해집니다. 상대의 태도, 눈앞의 증거, 상황 전체가 잘못된 인상을 주었다고 이해하는 편이 자연스럽습니다. 또한 could have가 들어갔다고 반드시 오래전 일을 회상하는 것은 아닙니다. 방금 들은 설명에 지금 반응하면서도 흔히 사용할 수 있습니다.\n\n비슷한 표현인 I had no idea는 몰랐다는 사실을 비교적 중립적으로 말합니다. Could\u0027ve fooled me는 보이는 모습이 설명과 다르다는 지적을 덧붙입니다. You fooled me는 실제로 상대에게 속았다고 직접 말하지만, 이 표현은 대개 “네 설명과 달리 그렇게 보이지는 않았다”라는 빈정거림이나 의심에 가깝습니다.\n\n짧은 대화:\nA: He says he\u0027s really excited about the trip. / 걔는 이번 여행 엄청 기대된대.\nB: Could\u0027ve fooled me. He hasn\u0027t smiled once. / 난 전혀 그렇게 안 보이던데. 한 번도 안 웃었잖아.\n\n이 대답은 상대의 전달 내용을 정면으로 거짓말이라고 단정하지 않으면서도, 관찰된 모습이 뒷받침하지 않는다고 말합니다. 가볍게 하면 재치 있는 반응이지만, 당사자에게 직접 말하면 “진심이면 좀 티를 내든가”라는 비판으로 들릴 수 있습니다. 반대로 누군가 “나 사실 엄청 긴장했어”라고 할 때 사용하면, 겉으로는 침착해 보였다는 칭찬이 될 수도 있습니다.\n\n기억 고리: 네 설명을 듣기 전에는, 겉모습 때문에 정반대로 믿을 뻔했다는 말입니다."},{"no":20,"en":"YOU TOOK THE WORDS RIGHT OUT OF MY MOUTH","ko":"딱 내가 하려던 말이야","url":"https://www.youtube.com/shorts/wAt3gf1bj2M","note":"YOU TOOK THE WORDS RIGHT OUT OF MY MOUTH\n→ 딱 내가 하려던 말이야.\n\ntake는 ‘가져가다’, out of는 ‘안에서 밖으로’입니다. 문장을 그대로 그리면 상대가 내 입 안에 있던 말을 꺼내 가져간 장면이 됩니다. 실제로 입속에 말이 물건처럼 들어 있다는 뜻은 물론 아닙니다. 내가 곧 말하려던 내용을 상대가 먼저 말했을 때, 마치 내 말을 미리 꺼내 간 것처럼 표현하는 것입니다.\n\nright는 여기서 ‘옳은’이라는 형용사가 아니라 정확함을 강조합니다. right out of my mouth는 ‘바로 내 입에서 쏙’이라는 느낌입니다. 상대의 말이 대충 비슷한 수준을 넘어, 내가 생각하던 핵심과 정확하게 맞아떨어졌다는 반응이 됩니다. 한국어의 “내 입에서 나올 말을 네가 했네”, “내 말이 바로 그 말이야”와 감각이 같습니다.\n\n이 표현은 자신의 생각을 상대가 먼저 잘 정리해 주었을 때 특히 자연스럽습니다. 실제로 입을 열려던 순간이어야 하는 것은 아닙니다. 대화를 듣다가 ‘나도 바로 그렇게 느끼고 있었다’고 깨달아도 쓸 수 있습니다. 생각의 일치와 말의 타이밍을 함께 강조하는 표현이라고 보시면 됩니다.\n\n비슷한 표현인 I agree는 상대의 의견에 동의한다는 뜻입니다. You took the words right out of my mouth는 “나도 이미 같은 말을 하려던 참이었다”라는 느낌이 더해집니다. 반대로 You put words in my mouth는 내가 하지 않은 말을 했다고 몰아간다는 뜻입니다. out of는 내 말을 먼저 꺼내 준 일치이고, put은 남의 말을 내 입에 억지로 넣는 왜곡이라는 차이가 있습니다.\n\n짧은 대화:\nA: We should stop working and get some food. / 이제 일 그만하고 뭐 좀 먹자.\nB: You took the words right out of my mouth. / 딱 내가 하려던 말이야.\n\n이 대화에서 말을 ‘가져갔다’고 해서 상대를 나무라는 것은 아닙니다. 보통 반갑게 공감하거나, 서로 생각이 잘 맞는다는 것을 표현합니다. 누가 먼저 아이디어를 냈는지 공로를 따지는 장면과도 구분하시면 좋습니다. 긴 문장이지만 회화에서는 한 덩어리로 자주 쓰이며, 특히 right out of 부분이 정확히 맞아떨어진 느낌을 살려 줍니다. 입이라는 구체적인 이미지 덕분에 단순한 동의보다 생생하게 들립니다.\n\n기억 고리: 내가 꺼내려던 말을 상대가 먼저 꺼냈을 만큼 생각이 정확하게 겹친 것입니다."},{"no":21,"en":"YOU\u0027RE ON THIN ICE","ko":"너 지금 아슬아슬해","url":"https://www.youtube.com/shorts/LnK8OwfQYS8","note":"YOU\u0027RE ON THIN ICE\n→ 너 지금 아슬아슬해.\n\nthin은 ‘얇은’, ice는 ‘얼음’입니다. 얇은 얼음 위에 서 있으면 아직 물에 빠지지는 않았지만, 조금만 더 무게가 실리거나 움직임이 커져도 깨질 수 있습니다. 이 표현은 그 불안정한 상태를 인간관계나 규칙의 상황에 옮깁니다. 상대가 아직 처벌이나 관계 단절을 겪지는 않았지만, 더 잘못하면 위험하다는 경고입니다.\n\n핵심은 이미 문제가 생겼거나 신뢰가 약해진 상태라는 점입니다. 한 번도 실수하지 않은 사람에게 막연히 조심하라고 하는 말보다, 여러 번 지각했거나 경고를 받은 사람에게 “지금 더 실수하면 안 돼”라고 말할 때 잘 맞습니다. 한국어의 “너 지금 간당간당해요”, “한 번만 더 그러면 끝이에요”와 연결됩니다.\n\n얼음이 아직 깨지지 않았다는 점도 중요합니다. 완전히 끝장난 상태를 말하는 것이 아니라, 마지막으로 행동을 조심할 여지가 남아 있습니다. 그래서 대놓고 처벌을 선언하는 대신 현재의 위태로운 위치를 알려 주는 방식입니다. 다만 “정확히 한 번만 더 기회가 있다”는 횟수까지 문장에 들어 있는 것은 아닙니다.\n\n비슷한 표현인 You\u0027re in trouble은 이미 곤란한 상황에 있거나 문제에 휘말렸다는 말입니다. You\u0027re on thin ice는 지금의 불안정함과 다음 실수의 위험을 특히 강조합니다. Be careful은 훨씬 넓고 중립적인 주의입니다. 이 표현은 보통 화자가 상대를 평가하거나 결과를 줄 수 있는 위치에 있을 때 더 강한 경고로 들립니다.\n\n짧은 대화:\nA: I know I\u0027m late again, but it was only ten minutes. / 또 늦은 건 아는데, 고작 10분이잖아요.\nB: You\u0027re on thin ice. Don\u0027t let it happen again. / 너 지금 아슬아슬해. 다시는 이런 일 없게 해.\n\n친구끼리는 사소한 장난을 두고 웃으며 사용할 수도 있습니다. 예를 들어 계속 놀리는 친구에게 장난스럽게 말하면 “너 계속 그러면 혼난다” 정도가 됩니다. 반면 상사나 교사가 진지하게 말하면 경고의 무게가 큽니다. 문장 자체가 관계 속의 인내나 신뢰가 약해진 상태를 그리므로, 단순히 몸이 위험한 장소에 있다는 뜻으로만 해석하지 않으시면 됩니다.\n\n기억 고리: 아직 얼음은 안 깨졌지만, 다음 행동 하나가 결과를 바꿀 수 있는 상태입니다."},{"no":22,"en":"DON\u0027T SELL YOURSELF SHORT","ko":"너 자신을 너무 과소평가하지 마","url":"https://www.youtube.com/shorts/js0l3I-2GBs","note":"DON\u0027T SELL YOURSELF SHORT\n→ 너 자신을 너무 과소평가하지 마.\n\nsell은 ‘팔다’이고, short에는 기대되는 양이나 수준에 ‘못 미치는’ 감각이 있습니다. 이 표현을 이해할 때는 가치 있는 물건에 제값보다 낮은 가격표를 붙이는 장면이 도움이 됩니다. yourself가 들어가므로, 낮게 매기는 대상은 물건이 아니라 자기 능력과 가치입니다. “너 자신에게 너무 싼 값을 매기지 마”가 과소평가하지 말라는 격려로 이어집니다.\n\n예를 들어 충분한 경력이 있는 사람이 “나는 그 자리에 지원할 수준이 안 돼”라고 말할 때 쓸 수 있습니다. 말하는 사람은 상대가 실제보다 자기 가능성을 낮게 보고 있다고 판단합니다. 한국어의 “네가 뭐가 부족해서 그래요”, “너무 자신을 낮춰 보지 마세요”와 비슷한 사고방식입니다.\n\n이 표현은 무조건 자신이 최고라고 믿으라는 뜻은 아닙니다. 자신의 능력을 부풀리라는 요구보다, 이미 가진 장점과 성취를 제대로 인정하라는 쪽입니다. 취업이나 협상처럼 실제 금액과 연결되는 상황에서도 유용하지만, 판매나 돈에 한정되지는 않습니다. 인간관계, 취미, 학업처럼 자기 평가가 필요한 장면에도 사용할 수 있습니다.\n\n비슷한 표현인 Don\u0027t be so modest는 “너무 겸손하게 굴지 마”라는 뜻입니다. 상대가 자기 실력을 알면서도 말을 낮추는 상황에도 잘 맞습니다. Don\u0027t sell yourself short는 말투의 겸손함보다 실제 자기 평가가 지나치게 낮다는 점에 초점이 있습니다. Don\u0027t underestimate yourself는 의미가 매우 가깝지만, 제값보다 싸게 내놓는다는 이미지 없이 직접적으로 말합니다.\n\n짧은 대화:\nA: I don\u0027t think I\u0027m good enough to lead the team. / 난 팀을 이끌 만큼 실력이 있는 것 같진 않아.\nB: Don\u0027t sell yourself short. You\u0027ve done this before. / 너 자신을 너무 과소평가하지 마. 전에도 해 봤잖아.\n\n이 예시에서 뒤에 경험을 언급하면 격려가 더 구체적이고 설득력 있게 들립니다. 상대가 왜 자신감을 가져도 되는지 근거를 붙여 주는 것입니다. 반면 현실적인 준비가 부족한 사람에게 무작정 쓰면 막연한 응원이 될 수 있습니다. 표현의 건강한 중심은 ‘부족한 점을 무시하라’가 아니라 ‘있는 가치까지 없는 것처럼 취급하지 말라’에 있습니다.\n\n기억 고리: 자신에게 너무 낮은 가격표를 붙이지 말고, 가진 가치만큼은 인정하라는 격려입니다."},{"no":23,"en":"HOW\u0027S THAT WORKING OUT FOR YOU?","ko":"그렇게 해 보니까 어때?","url":"https://www.youtube.com/shorts/GBdBEaIiouY","note":"HOW\u0027S THAT WORKING OUT FOR YOU?\n→ 그렇게 해 보니까 어때?\n→ 비꼬는 상황에서는 “그래서 그렇게 해서 잘됐어?”\n\nwork out은 여기서 운동한다는 뜻이 아닙니다. 일이 진행되어 어떤 결과로 이어지는 것을 뜻합니다. How is that working out은 “그 선택이나 방법이 실제로 어떤 결과를 내고 있느냐”를 묻습니다. for you는 그 결과가 상대에게 어떤지 범위를 잡아 줍니다. 이론적으로 그럴듯한지보다 직접 해 본 뒤의 사정을 묻는 질문입니다.\n\n친구가 재택근무로 바꾸었거나 새로운 공부법을 시작했을 때 진심 어린 관심으로 사용할 수 있습니다. “해 보니까 잘 맞아요?”, “실제로는 어때요?”라는 뜻입니다. 현재 진행형이므로 이미 해 보고 있는 방법의 진행 상황과 효과를 함께 살펴보는 느낌이 납니다. 반드시 일이 완전히 끝나야 결과를 물을 수 있는 것은 아닙니다.\n\n하지만 이 표현은 비꼬는 용법으로도 자주 쓰입니다. 상대가 고집한 방법이 눈에 띄게 실패했을 때 “그래서 그렇게 해서 잘됐어?”라고 묻는 것입니다. 문장 안에 실패를 뜻하는 단어는 없지만, 답이 좋지 않다는 것을 서로 아는 상황에서 굳이 결과를 묻기 때문에 비꼼이 생깁니다. 한국어에서도 같은 질문을 표정과 억양에 따라 걱정으로도, 빈정거림으로도 사용할 수 있습니다.\n\n비슷한 표현인 How\u0027s it going?은 일이나 생활이 전반적으로 어떤지 넓게 묻습니다. How\u0027s that working out for you?는 앞서 나온 특정한 선택이나 방법에 초점을 맞춥니다. Does it work?는 효과가 있는지 없는지 묻는 데 가깝고, 이 표현은 실제 경험이 어떤지 더 폭넓은 설명을 기대할 수 있습니다.\n\n짧은 대화:\nA: I started studying before breakfast. / 아침 먹기 전에 공부하기 시작했어.\nB: How\u0027s that working out for you? / 그렇게 해 보니까 어때?\n\n이 예시에는 실패를 암시하는 정보가 없으므로 자연스럽게 관심 어린 질문으로 읽힙니다. 반대로 상대가 잠을 줄이겠다고 했다가 계속 졸고 있다면 같은 말이 빈정거림으로 들릴 수 있습니다. 따라서 표현 자체를 ‘비꼬는 말’로만 외우지 마시고, 질문하는 사람이 좋은 결과도 진심으로 들을 준비가 되어 있는지 살펴보시면 좋습니다.\n\n기억 고리: 네가 택한 방법을 현실에 적용해 보니, 너한테 어떤 결과가 나오고 있느냐는 질문입니다."},{"no":24,"en":"AIN\u0027T THAT THE TRUTH?","ko":"진짜 그 말이 맞아","url":"https://www.youtube.com/shorts/jk5R3AT_PTQ","note":"AIN\u0027T THAT THE TRUTH?\n→ 진짜 그 말이 맞아.\n\ntruth는 ‘진실’이나 ‘사실’입니다. ain\u0027t는 매우 구어적인 부정형으로, 이 문장에서는 isn\u0027t에 해당합니다. 글자대로 보면 “그게 사실 아니야?”라는 부정 의문문입니다. 그러나 보통 진위 여부를 몰라서 묻는 질문이 아니라, 상대의 말에 강하게 동의하며 “정말 그렇다”라고 호응하는 표현입니다.\n\n상대가 많은 사람이 공감할 만한 경험을 이야기할 때 특히 잘 맞습니다. “주말은 눈 깜짝할 사이에 끝나”라는 말에 이 표현으로 반응하면, 자기 경험으로도 너무 잘 아는 사실이라는 느낌이 납니다. 한국어의 “그러게 말이에요”, “진짜 맞는 말이네요”처럼 새 정보를 받아들이기보다 이미 몸으로 아는 사실에 고개를 끄덕이는 것입니다.\n\n부정 의문문이라고 해서 부정적인 답을 예상하는 것은 아닙니다. 한국어에서도 “그렇지 않아요?”는 ‘그렇다’는 공감을 요청할 수 있습니다. Ain\u0027t that the truth?도 같은 방향으로 움직입니다. 말하는 사람은 사실상 답을 알고 있고, 상대와 그 확신을 함께 나누는 것입니다. 그래서 물음표가 있어도 실제 기능은 감탄이나 강한 맞장구에 가깝습니다.\n\n비슷한 표현인 Is that true?는 어떤 정보가 사실인지 확인하는 질문입니다. Ain\u0027t that the truth?는 대체로 이미 사실이라고 받아들인 내용을 힘주어 인정합니다. That\u0027s true도 동의이지만, 이 표현에는 더 구어적이고 정서적인 공감이 실리기 쉽습니다. ‘논리적으로 맞다’뿐 아니라 ‘내가 겪어 봐서 정말 안다’라는 분위기가 잘 어울립니다.\n\n짧은 대화:\nA: It takes longer to choose a movie than to watch one. / 영화 보는 것보다 고르는 데 시간이 더 걸려.\nB: Ain\u0027t that the truth? / 진짜 그 말이 맞아.\n\nain\u0027t는 여러 영어 방언과 편한 구어에서 사용되지만, 격식 있는 글이나 표준 문법을 요구하는 상황에서는 보통 피합니다. 그렇다고 사용하는 사람의 지적 수준을 판단할 근거가 되는 것은 아닙니다. 학습할 때는 이 표현의 캐주얼한 분위기를 함께 익히시면 됩니다. 또 상대의 슬픈 경험에 쓰면 함께 한숨 쉬는 공감이 되고, 우스운 일상 관찰에 쓰면 웃으며 맞장구치는 말이 됩니다.\n\n기억 고리: 사실인지 묻는 모양을 빌려, “내 경험으로도 정말 맞다”라고 강하게 공감하는 말입니다."},{"no":25,"en":"I HEAR THAT","ko":"그 말 완전 공감돼","url":"https://www.youtube.com/shorts/liKY3lOSVYo","note":"I HEAR THAT\n→ 그 말 완전 공감돼.\n\nhear의 기본 뜻은 소리가 귀에 ‘들리다’입니다. 그런데 대화에서 상대의 말을 듣는다는 것은 소리를 감지하는 데서 끝나지 않습니다. 그 말에 담긴 경험이나 감정을 받아들이는 단계로 확장될 수 있습니다. I hear that은 특정한 회화 맥락에서 “네 말이 어떤 느낌인지 알겠다”, “나도 그렇다”라는 공감의 반응이 됩니다.\n\n예를 들어 친구가 “이번 주는 너무 길게 느껴진다”라고 하소연했을 때 이렇게 답할 수 있습니다. 단순히 “목소리가 들린다”는 보고가 아니라, 그 피곤함이나 답답함이 자기에게도 익숙하다는 뜻입니다. 한국어의 “내 말이 그 말이야”, “그 마음 알죠”와 가깝습니다. 짧지만 상대의 말에 같은 편으로 서는 반응입니다.\n\nthat은 상대가 방금 한 말을 하나의 내용으로 받아 줍니다. 자신이 완전히 똑같은 일을 경험했어야만 하는 것은 아닙니다. 비슷한 감정을 알거나 상대의 불만이 납득될 때도 사용할 수 있습니다. 다만 이 용법은 편한 구어에 어울립니다. 공식적인 자리에서 자세한 이해나 동의를 보여 줘야 한다면, 무엇을 이해했는지 더 구체적으로 설명하는 편이 분명합니다.\n\n비슷한 표현인 I can hear you는 주로 상대의 목소리가 들린다는 뜻입니다. 통화 품질을 확인할 때 자연스럽습니다. I hear you도 이해와 공감을 나타내지만, 뒤에 반대 의견을 붙여 “무슨 말인지는 알겠지만”이라는 양보로 쓰기도 합니다. I hear that은 짧은 맞장구로 사용될 때 “정말 그래”라는 공감이 더 두드러지는 경우가 많습니다.\n\n짧은 대화:\nA: I need a weekend with absolutely no plans. / 아무 약속도 없는 주말이 필요해.\nB: I hear that. / 그 말 완전 공감돼.\n\n또 I hear that 뒤에 주어와 동사가 이어지면 구조가 달라질 수 있습니다. 예를 들어 I hear that he\u0027s moving은 “그가 이사한다고 들었어”라는 정보 전달입니다. 목록의 표현처럼 that에서 문장을 끝내며 상대의 말에 반응하는 경우와 구분하셔야 합니다. 똑같은 단어 배열이라도 뒤에 내용이 이어지는지, 이미 나온 말을 가리키며 끝나는지에 따라 듣는 방식이 달라집니다.\n\n기억 고리: 소리만 귀에 들어온 것이 아니라, 그 말에 담긴 마음까지 와닿았다는 반응입니다."},{"no":26,"en":"THAT\u0027S NOT HOW THIS WORKS","ko":"이건 그런 식으로 하는 게 아니야","url":"https://www.youtube.com/shorts/xw6K6sjwVYQ","note":"THAT\u0027S NOT HOW THIS WORKS\n→ 이건 그런 식으로 하는 게 아니야.\n\nhow는 ‘어떻게’, work는 여기서 ‘작동하다’입니다. 따라서 전체 구조는 “그것은 이것이 작동하는 방식이 아니다”입니다. that은 상대가 방금 제안하거나 시도한 방식을 가리키고, this는 지금 다루는 제도나 절차, 활동 전체를 가리킵니다. 두 지시어가 서로 다른 대상을 받는다는 점을 이해하면 문장의 구조가 선명해집니다.\n\n예를 들어 시험지를 제출한 뒤 답을 바꾸겠다는 사람에게 사용할 수 있습니다. 상대가 원하는 결과를 부정하는 데 그치지 않고, 그 결과를 얻으려는 방식이 절차와 맞지 않는다고 지적하는 것입니다. 한국어의 “그렇게 되는 게 아니에요”, “이건 그런 식으로 돌아가는 게 아니죠”와 같은 사고방식입니다.\n\n여기서 work는 기계에만 해당하지 않습니다. 환불 규정, 채용 과정, 인간관계, 토론의 원칙처럼 어떤 일이 성립하는 방식에도 쓸 수 있습니다. “내가 사과했으니까 너는 당장 기분이 풀려야 해”라는 말에 사용하면, 감정이나 화해가 그런 공식대로 작동하지는 않는다는 뜻이 됩니다.\n\n비슷한 표현인 That doesn\u0027t work는 특정한 방법이 효과를 내지 못한다는 말입니다. That\u0027s not how this works는 그 방법이 해당 체계의 규칙이나 원리를 잘못 이해했다는 점에 초점이 있습니다. That\u0027s not a thing은 개념이나 관행 자체를 부정하지만, 이 표현은 활동의 존재를 인정하면서 ‘방법이 틀렸다’고 교정합니다.\n\n짧은 대화:\nA: I returned half the sandwich. Can I get a full refund? / 샌드위치 반 남겨서 가져왔는데 전액 환불돼?\nB: That\u0027s not how this works. / 이건 그런 식으로 하는 게 아니야.\n\n이 말은 상대의 이해가 잘못되었다고 직접 지적하므로, 설명 없이 단독으로 쓰면 답답함이나 짜증이 강하게 느껴질 수 있습니다. 친구끼리 우스운 주장을 받아칠 때는 재치 있지만, 처음 배우는 사람에게 말하면 무안하게 만들 수도 있습니다. 차분하게 사용하려면 무엇이 올바른 절차인지 뒤에 붙이면 됩니다. 핵심은 “네가 싫다”가 아니라 “네가 전제한 작동 원리가 맞지 않는다”라는 교정입니다.\n\n기억 고리: 상대가 제시한 방식과, 이 일이 실제로 성립하는 방식 사이의 어긋남을 짚는 말입니다."},{"no":27,"en":"I WALKED RIGHT INTO THAT ONE","ko":"내가 딱 걸려들었네","url":"https://www.youtube.com/shorts/IFtcsvl2Yh8","note":"I WALKED RIGHT INTO THAT ONE\n→ 내가 딱 걸려들었네.\n\nwalk into의 기본 모습은 어떤 공간 ‘안으로 걸어 들어가는’ 것입니다. 그런데 들어간 곳이 함정이라면, 스스로 움직여 곤란한 상황에 빠졌다는 의미가 생깁니다. 이 표현에서는 실제 함정보다 상대가 던질 농담이나 반격에 자기 말로 좋은 빌미를 제공한 상황을 가리키는 경우가 많습니다.\n\nright는 여기서 ‘정확히’, ‘그대로’라는 강조입니다. 피하거나 눈치채지 못하고 함정 한가운데로 곧장 들어갔다는 느낌입니다. that one은 방금 나온 농담, 놀림, 함정 질문 같은 것을 받습니다. 단순히 남에게 공격당했다는 말이 아니라 “내가 너무 좋은 기회를 줬네”라고 자신의 역할을 인정하는 것이 핵심입니다.\n\n한국어의 “내가 빌미를 줬네”, “제 발로 걸려들었네요”와 비슷합니다. 예를 들어 자신을 칭찬해 달라는 뜻으로 질문했는데 상대가 그 구조를 이용해 놀렸다면, 민망함을 웃어넘기며 사용할 수 있습니다. 보통 심각한 자책보다는 상대의 재치에 패배를 인정하는 가벼운 분위기와 잘 맞습니다.\n\n비슷한 표현인 You got me는 “당했네”, “들켰네”, “모르겠네”처럼 여러 상황에서 쓸 수 있습니다. I walked right into that one은 그중에서도 자기 말이나 행동이 상대의 반격을 쉽게 만들었다는 점을 강조합니다. I had it coming은 이전의 잘못 때문에 좋지 않은 결과를 당할 만했다는 뜻이므로, 반드시 말장난이나 순간적인 함정에 걸린 상황을 가리키지는 않습니다.\n\n짧은 대화:\nA: Why does everyone think I\u0027m lazy? / 왜 다들 내가 게으르다고 생각하지?\nB: Want me to answer, or is that too much work for you? / 대답해 줄까, 아니면 듣는 것도 귀찮아?\nA: I walked right into that one. / 내가 딱 걸려들었네.\n\n이 예시에서 마지막 말은 “네가 부당하게 공격했다”는 항의가 아닙니다. 자기 질문이 놀리기 좋은 공을 던져 주었다는 인정입니다. 그래서 분위기를 부드럽게 만들고, 자신도 농담을 받아들일 줄 안다는 것을 보여 줍니다. 다만 실제로 심각한 사기나 함정에 빠진 상황에서도 비유적으로 가능하므로, 항상 유쾌한 뜻이라고 고정할 필요는 없습니다.\n\n기억 고리: 상대가 친 함정에 끌려간 것이 아니라, 내 말로 길을 열고 스스로 들어간 것입니다."},{"no":28,"en":"I\u0027LL TAKE THAT AS A YES","ko":"그럼 동의한 걸로 알게","url":"https://www.youtube.com/shorts/2vMWnkz8ufU","note":"I\u0027LL TAKE THAT AS A YES\n→ 그럼 동의한 걸로 알게.\n\ntake는 ‘가져가다’ 외에 어떤 말을 특정한 뜻으로 ‘받아들이다’, ‘해석하다’라는 의미로도 쓰입니다. take A as B는 ‘A를 B로 받아들이다’라는 구조입니다. 따라서 I\u0027ll take that as a yes는 상대가 방금 보인 반응을 긍정의 대답으로 해석하겠다는 말입니다. 물리적으로 yes라는 물건을 가져간다는 뜻은 아닙니다.\n\nthat이 가리키는 것은 반드시 실제로 말한 “응”이 아닙니다. 미소, 고개를 끄덕이는 행동, 반가운 표정, 애매한 대답일 수 있습니다. 상대가 명확한 긍정문을 말하지 않았기 때문에 화자가 그 반응의 의미를 정리해 주는 것입니다. 한국어의 “그럼 좋다는 뜻으로 알게요”, “찬성한 걸로 이해할게요”와 같은 흐름입니다.\n\nwill은 여기서 먼 미래의 계획보다 지금의 해석을 선언하는 역할을 합니다. “나는 방금 그 반응을 이렇게 받아들일게”라는 뜻입니다. a yes처럼 관사가 붙는 것은 yes를 하나의 긍정 응답으로 취급하기 때문입니다. 영어에서는 이런 식으로 평소에는 명사가 아닌 말을 하나의 답변이나 선택으로 묶어 표현할 수 있습니다.\n\n비슷한 표현인 Is that a yes?는 상대에게 확인을 요청합니다. I\u0027ll take that as a yes는 화자가 먼저 긍정으로 해석하겠다고 선언합니다. 그래서 장난스럽고 자신감 있게 들릴 수 있지만, 반응이 불분명한 상황에서는 자기 편의적으로 결론을 내리는 말처럼 들릴 수도 있습니다. 상대의 침묵이 언제나 동의가 된다는 원칙을 말하는 표현은 아닙니다.\n\n짧은 대화:\nA: Want the last slice of pizza? / 마지막 피자 한 조각 먹을래?\nB: I\u0027ve been staring at it for five minutes. / 나 5분째 그것만 보고 있었어.\nA: I\u0027ll take that as a yes. / 그럼 먹겠다는 걸로 알게.\n\n이 대화에서는 상대가 먹고 싶다는 뜻을 충분히 드러냈기 때문에 자연스럽고 유쾌합니다. 반대로 중요한 결정에서 상대가 난처해하며 대답하지 못한다면 같은 말이 압박처럼 들릴 수 있습니다. 표현을 이해할 때는 화자가 ‘명확한 대답을 들은 것’과 ‘반응을 해석한 것’ 사이의 차이를 남겨 두고 있다는 점을 보시면 좋습니다.\n\n기억 고리: 상대가 직접 yes라고 하지는 않았지만, 방금 반응을 긍정으로 받아들이겠다는 말입니다."},{"no":29,"en":"WHAT ELSE IS NEW?","ko":"뭐, 늘 그렇지","url":"https://www.youtube.com/shorts/XwdB__DA87M","note":"WHAT ELSE IS NEW?\n→ 뭐, 늘 그렇지.\n\nnew는 ‘새로운’이고, else는 ‘그 밖의 다른’이라는 뜻입니다. 글자대로 보면 “그 밖에 새 소식은 뭐가 있어?”라는 질문입니다. 실제로 다른 소식을 요청하는 뜻으로 사용할 수도 있지만, 관용적으로는 방금 들은 이야기가 너무 익숙하고 예상 가능해서 새로울 것이 없다는 반응으로 자주 쓰입니다.\n\n친구가 “걔 또 늦는대”라고 말했을 때 What else is new?라고 하면, 보통 다른 뉴스를 들려 달라는 요청이 아닙니다. “걔가 늦는 게 하루 이틀 일이야?”라는 뜻입니다. 말의 표면에서는 새로운 것을 묻지만, 실제로는 지금 들은 내용이 하나도 새롭지 않다고 평가하는 것이죠.\n\n한국어의 “뭐, 새삼스럽게”, “늘 있는 일이지”, “하루 이틀이냐”와 감각이 잘 맞습니다. 대체로 반복되는 불편, 나쁜 습관, 예상 가능한 문제를 두고 체념하거나 가볍게 비꼬는 경우가 많습니다. 새로운 정보에 놀라는 대신, 너무 익숙해서 놀랄 힘도 없다는 분위기가 들어갈 수 있습니다.\n\n비슷한 표현인 What\u0027s new?는 오랜만에 만난 사람에게 “새로운 일 있어?” 하고 근황을 물을 때 자연스럽습니다. What else is new?도 문맥에 따라 추가 소식을 물을 수 있지만, 뻔한 문제를 들은 직후 짧게 말하면 관용적인 체념으로 읽히기 쉽습니다. That\u0027s surprising은 예상 밖이라는 반응이므로 감정의 방향이 반대입니다.\n\n짧은 대화:\nA: The meeting started late again. / 회의가 또 늦게 시작했어.\nB: What else is new? / 뭐, 늘 그렇지.\n\n이 대답은 회의가 늦게 시작한 사실을 부정하지 않습니다. 오히려 늘 반복되는 일이라는 전제를 받아들입니다. 그래서 상대가 처음 겪은 일에 진지하게 속상해하고 있다면 무심하게 들릴 수 있습니다. 반대로 두 사람이 같은 문제를 여러 번 겪었다면, 설명 없이도 피곤함을 공유하는 한마디가 됩니다. 실제로 질문의 답을 기다리는지, 어깨를 으쓱하며 대화를 마무리하는지를 보면 문자 그대로의 질문과 관용적 반응을 구분하기 쉽습니다.\n\n기억 고리: 새 소식을 묻는 척하면서, 방금 이야기는 너무 뻔해서 새롭지도 않다고 말하는 표현입니다."},{"no":30,"en":"THAT\u0027S A HARD PASS","ko":"그건 절대 사양할게","url":"https://www.youtube.com/shorts/aJsQhTUHamo","note":"THAT\u0027S A HARD PASS\n→ 그건 절대 사양할게.\n\npass의 기본 뜻에는 ‘지나가다’가 있습니다. 선택이나 참여의 기회 앞에서 그 차례를 넘기면, 그 제안을 받아들이지 않고 지나간다는 의미가 됩니다. 카드 게임에서 차례를 넘기거나, 권유받은 것을 사양하는 장면을 연결해 보시면 됩니다. 여기서 a pass는 하나의 거절이나 불참 의사로 이해하시면 자연스럽습니다.\n\nhard는 여기서 ‘어려운’보다 ‘단단한’, ‘강한’, ‘확고한’ 쪽입니다. 따라서 hard pass는 결정하기 어려운 선택이 아니라, 흔들릴 여지가 거의 없는 단호한 거절입니다. “고민해 봤는데 약간 망설여져”가 아니라 “그건 생각만 해도 싫어”, “나는 확실히 안 할래”라는 반응에 가깝습니다.\n\n한국어의 “그건 진짜 사양할게요”, “그건 됐어요”, “절대 안 해요”와 연결됩니다. that은 방금 나온 제안이나 선택지를 가리킵니다. 높은 곳에서 뛰어내리는 활동, 마음에 들지 않는 음식, 터무니없는 조건의 부탁처럼 자신이 분명히 원하지 않는 것에 사용할 수 있습니다. 이유를 길게 설명하지 않고도 거절의 강도를 전달합니다.\n\n비슷한 표현인 I\u0027ll pass는 “난 사양할게”라는 비교적 담백한 거절입니다. That\u0027s a hard pass는 거기에 강한 비호감이나 단호함을 더합니다. Maybe another time은 다음에는 가능할 수도 있다는 여지를 남기지만, hard pass는 보통 지금 제시된 선택지를 확실하게 닫습니다. 그렇다고 어떤 상황에서도 영원히 바뀌지 않을 맹세까지 뜻하는 것은 아닙니다.\n\n짧은 대화:\nA: Want to go camping somewhere with no bathrooms? / 화장실 없는 데로 캠핑 갈래?\nB: That\u0027s a hard pass. / 그건 절대 사양할게.\n\n이 대화에서는 상대가 제안한 조건이 거절의 이유를 쉽게 짐작하게 해 줍니다. 친구끼리는 과장된 반응으로 웃음을 만들 수 있지만, 정성 들인 제안을 한 사람에게 말하면 냉정하게 들릴 수 있습니다. 특히 hard가 거절을 세게 만들기 때문에, 공손하게 마음만 전하고 싶은 상황의 기본 표현으로 삼기보다는 확실히 선을 긋고 싶은 장면에 맞추는 것이 좋습니다. ‘어려워서 못 한다’보다 ‘선택할 생각이 없다’가 중심입니다.\n\n기억 고리: pass로 제안을 넘기고, hard로 그 거절에 흔들리지 않는 선을 긋는 말입니다."},{"no":31,"en":"I CAN\u0027T QUITE PLACE IT","ko":"어디서 접했는지 딱 떠오르진 않아","url":"https://www.youtube.com/shorts/2lmbXciB0V8","note":"I CAN\u0027T QUITE PLACE IT\n→ 어디서 접했는지 딱 떠오르진 않아.\n→ 정체가 생각나지 않을 때는 “뭔지 알 것 같은데 정확히는 모르겠어.”\n\nplace는 명사로 ‘장소’이지만, 동사로는 무언가를 특정한 자리에 ‘놓다’라는 뜻입니다. 기억과 관련해서 쓰이면, 지금 보고 듣는 것을 머릿속의 알맞은 자리에 연결하는 느낌이 됩니다. 어떤 얼굴을 예전에 만났던 상황에 연결하거나, 익숙한 멜로디를 특정한 노래에 연결하는 것입니다. 그 연결에 성공해야 “아, 그 사람이구나” 하고 정체를 알아볼 수 있습니다.\n\nI can\u0027t place it은 익숙한 느낌은 있는데 그것이 무엇인지, 어디서 접했는지 정확히 짚지 못한다는 뜻입니다. 완전히 처음 보는 것이라 아무 느낌도 없는 상태와는 다릅니다. 한국어의 “분명 어디서 봤는데”, “혀끝에서 맴도는데 생각이 안 나네요”와 닮았습니다. 다만 이름이 생각나지 않는 경우뿐 아니라 냄새, 목소리, 분위기의 출처를 못 찾을 때도 쓸 수 있습니다.\n\nquite는 여기서 ‘꽤’보다 ‘정확히’, ‘완전히’에 가깝습니다. can\u0027t quite라는 조합은 능력이 전혀 없다는 강한 부정보다, 거의 닿을 듯한데 마지막으로 정확하게 잡히지 않는 상태를 나타냅니다. 기억의 실마리는 있는데 연결 고리 하나가 빠져 있는 셈입니다. 그래서 문장 전체에 답답하면서도 조심스러운 느낌이 생깁니다.\n\n비슷한 표현인 I don\u0027t recognize it은 그것을 알아보지 못한다는 뜻입니다. I can\u0027t quite place it은 대개 어느 정도의 익숙함이나 인식이 있다는 뉘앙스를 남깁니다. I can\u0027t remember it은 기억해 내지 못한다는 넓은 말이지만, place를 쓰면 현재의 감각을 과거의 특정한 사람이나 상황에 연결하지 못한다는 점이 더 선명해집니다.\n\n짧은 대화:\nA: Do you know this song? / 이 노래 알아?\nB: It sounds familiar, but I can\u0027t quite place it. / 익숙하긴 한데 어디서 들었는지 딱 떠오르진 않아.\n\n목록의 it은 사물이나 소리 등을 가리킵니다. 사람을 두고 말할 때는 문맥에 맞게 him, her, you 등을 사용할 수 있습니다. 중요한 것은 ‘장소를 모른다’고만 해석하지 않는 것입니다. 실제로 어디에서 만났는지를 찾는 경우도 있지만, 더 넓게는 기억 속에서 대상의 정체와 출처를 찾아 정확히 연결하는 정신적인 작업을 뜻합니다.\n\n기억 고리: 익숙한 조각은 손에 있는데, 기억 속 어느 자리에 끼워야 할지 아직 못 찾은 상태입니다."},{"no":32,"en":"I\u0027M GONNA WING IT","ko":"그냥 즉흥적으로 해 볼게","url":"https://www.youtube.com/shorts/l2_ZqRJ8rZE","note":"I\u0027M GONNA WING IT\n→ 그냥 즉흥적으로 해 볼게.\n\nwing의 기본 뜻은 ‘날개’이지만, wing it은 단어를 따로 직역하기보다 하나의 동사 표현으로 익히는 것이 좋습니다. 충분히 준비하거나 세부 계획을 세우지 않은 채, 그 순간의 판단과 능력으로 일을 해낸다는 뜻입니다. 날개를 펴고 일단 움직이는 이미지는 기억에 도움이 될 수 있지만, 그것을 이 표현의 실제 어원이라고 단정해서는 안 됩니다.\n\n이 말의 중심은 ‘아무 생각 없이 한다’보다 ‘미리 짜 놓은 대본 없이 대응한다’에 있습니다. 발표 내용을 완벽하게 외우지 못했지만 아는 내용을 바탕으로 설명하거나, 여행 일정을 촘촘히 정하지 않고 현장에서 결정하는 상황에 쓸 수 있습니다. 한국어의 “그때그때 봐서 할게요”, “일단 감으로 해 볼게요”와 비슷합니다.\n\ngonna는 일상적인 발음과 표기에서 going to를 줄인 형태입니다. 여기서는 앞으로 그렇게 하겠다는 계획을 나타냅니다. 준비가 없다는 사실을 태연하게 받아들이는 말일 수도 있고, 준비할 시간이 부족해서 어쩔 수 없이 선택하는 말일 수도 있습니다. 따라서 항상 자신감 넘치는 태도를 뜻하는 것은 아닙니다. 목소리에 따라 여유도, 불안함도 실릴 수 있습니다.\n\n비슷한 표현인 improvise도 즉흥적으로 대응하거나 만들어 낸다는 뜻입니다. wing it은 특히 사전 준비가 충분하지 않다는 분위기가 잘 드러납니다. 반면 make it up은 이야기나 설명을 지어낸다는 뜻으로 쓰일 수 있으므로, 사실을 날조한다는 오해가 생길 수 있습니다. wing it 자체는 거짓말을 하겠다는 뜻도, 반드시 실패할 것이라는 뜻도 아닙니다.\n\n짧은 대화:\nA: Have you written your speech? / 연설문 써 뒀어?\nB: Not really. I\u0027m gonna wing it. / 딱히. 그냥 즉흥적으로 해 볼게.\n\n익숙한 주제라면 준비 없이도 잘할 수 있지만, 전혀 모르는 일을 맡는 상황에서는 무모하게 들릴 수 있습니다. 이 표현은 결과의 질을 보장하는 말이 아니라 준비 방식에 대한 설명입니다. 또 일 전체를 즉흥적으로 할 수도 있고, 몇 가지 핵심만 준비한 뒤 세부 내용은 현장에서 채울 수도 있습니다. 준비의 유무를 절대적인 이분법으로 보기보다, 미리 정한 틀에 얼마나 의존하지 않는지에 초점을 맞추시면 좋습니다.\n\n기억 고리: 미리 만든 대본 대신, 그 순간의 판단으로 빈칸을 채워 가겠다는 말입니다."},{"no":33,"en":"I\u0027M NOT CUT OUT FOR THIS","ko":"난 이 일에 안 맞는 것 같아","url":"https://www.youtube.com/shorts/ffdYsDjjlxE","note":"I\u0027M NOT CUT OUT FOR THIS\n→ 난 이 일에 안 맞는 것 같아.\n\ncut은 ‘자르다’이고, cut out은 재료에서 일정한 모양을 ‘잘라 내다’라는 뜻으로 쓰일 수 있습니다. 옷감을 어떤 형태로 재단하면 그 모양에 맞는 용도가 생깁니다. be cut out for는 이런 ‘알맞게 만들어진 형태’를 떠올리며 이해하기 좋은 표현입니다. 어떤 활동이나 역할에 필요한 성향과 능력을 갖추고 있다는 뜻입니다.\n\nI\u0027m not cut out for this는 “나는 이 역할에 맞는 모양으로 만들어진 사람이 아닌 것 같다”라는 감각입니다. 실제로 누가 자신을 재단했다는 뜻이 아니라, 자기 성격이나 적성, 감당할 수 있는 방식과 일이 잘 맞지 않는다는 판단입니다. 한국어의 “이건 내 체질이 아닌가 봐요”, “난 이쪽 적성은 아닌 것 같아요”와 연결됩니다.\n\n예를 들어 사람을 계속 설득해야 하는 일을 해 보니 감정적으로 너무 소모되거나, 아이들을 돌보는 일을 하며 필요한 인내심이 부족하다고 느낄 때 쓸 수 있습니다. 단순히 오늘 힘들다는 말보다 자신과 역할 사이의 적합성을 문제 삼습니다. 다만 지친 순간에 과장해서 말하기도 하므로, 항상 평생 바뀌지 않을 냉정한 결론인 것은 아닙니다.\n\n비슷한 표현인 I\u0027m not good at this는 현재 이 일을 잘하지 못한다는 뜻입니다. 연습이나 경험이 부족할 수도 있습니다. I\u0027m not cut out for this는 능력뿐 아니라 성향과 적성이 맞지 않는다는 판단이 더 강합니다. I\u0027m not up for this는 지금 하고 싶은 마음이나 에너지가 없다는 뜻으로 쓰일 수 있어, 장기적인 적합성과는 구분됩니다.\n\n짧은 대화:\nA: How was your first day in sales? / 영업 첫날 어땠어?\nB: I\u0027m not cut out for this. I hate pressuring people. / 난 이 일에 안 맞는 것 같아. 사람들한테 부담 주는 게 싫어.\n\n이 예시에서는 단순히 매출이 적었다는 결과보다 일을 하는 방식이 자기 성향과 부딪친다는 점이 이유가 됩니다. 그래서 “더 연습하면 돼”라는 답이 항상 충분하지 않을 수 있습니다. 반대로 상대가 실패 한 번으로 성급하게 이렇게 말한다면, 아직 적성을 판단하기에는 경험이 부족하다는 격려도 가능합니다. 표현이 가리키는 것은 객관적인 진단보다 화자가 느끼는 자기 적합성입니다.\n\n기억 고리: 일을 못 끝냈다는 말보다, 그 역할의 모양과 내 성향이 잘 맞지 않는다는 말입니다."},{"no":34,"en":"I\u0027LL SIT THIS ONE OUT","ko":"이번엔 난 빠질게","url":"https://www.youtube.com/shorts/Dej_o4Z1lds","note":"I\u0027LL SIT THIS ONE OUT\n→ 이번엔 난 빠질게.\n\nsit은 ‘앉다’입니다. sit out은 어떤 활동이 진행되는 동안 참여하지 않고 지나가게 둔다는 뜻으로 쓰입니다. 모두가 경기장이나 무도장에 들어갈 때 자신은 바깥에 앉아 한 차례를 보내는 장면을 떠올리시면 감각이 잘 잡힙니다. 실제로 꼭 의자에 앉아 있어야 하는 것은 아니며, 중심은 활동에 끼지 않는 데 있습니다.\n\nthis one은 지금 제안된 한 번의 활동이나 이번 차례를 가리킵니다. 그래서 I\u0027ll sit this one out은 “나는 아예 이런 것을 안 해”라는 선언보다 “이번 것은 참여하지 않을게”라는 뜻에 가깝습니다. 다음 경기, 다음 모임, 다음 기회에는 참여할 여지를 남깁니다. 한국어의 “이번 판은 쉴게요”, “이번에는 구경만 할게요”와 비슷합니다.\n\n이 표현은 거절의 초점을 활동의 가치보다 자기 참여 여부에 둡니다. “그건 재미없어”라고 평가하는 대신, 나는 이번에 빠지겠다고 말하는 것입니다. 피곤해서 쉴 수도 있고, 몸 상태가 좋지 않거나 단순히 내키지 않을 수도 있습니다. 이유 자체는 표현에 들어 있지 않으므로 필요하면 뒤에 덧붙이면 됩니다.\n\n비슷한 표현인 I\u0027ll pass도 제안을 사양한다는 뜻입니다. I\u0027ll sit this one out은 다른 사람들이 계속하는 동안 자신이 한 차례 빠져 있는 모습이 더 선명합니다. I\u0027m quitting은 일을 그만두거나 참여를 중단한다는 뜻으로, 훨씬 장기적이거나 최종적인 결정일 수 있습니다. sit this one out은 보통 지금 정해진 활동 단위를 넘기는 데 초점이 있습니다.\n\n짧은 대화:\nA: We\u0027re playing another round. Are you in? / 한 판 더 할 건데 너도 할래?\nB: I\u0027ll sit this one out. My ankle hurts. / 이번엔 난 빠질게. 발목이 아파.\n\n이 대화에서는 다친 발목을 쉬게 하면서 다른 사람들이 게임을 계속하도록 둡니다. 반드시 자리를 떠난다는 뜻은 아닙니다. 옆에서 응원하거나 구경할 수도 있습니다. 또한 경기나 게임뿐 아니라 특정한 투자, 논쟁, 모임에 참여하지 않을 때도 쓸 수 있습니다. 다만 업무상 반드시 해야 하는 일을 두고 사용하면 가벼운 선택처럼 들릴 수 있으므로, 참여 여부를 스스로 정할 수 있는 상황인지 살펴보시면 좋습니다.\n\n기억 고리: 모두가 한 차례 움직이는 동안, 나는 이번 순서만 바깥에서 보내겠다는 말입니다."},{"no":35,"en":"WE\u0027RE WAY PAST THAT","ko":"우린 이미 그 단계를 한참 지났어","url":"https://www.youtube.com/shorts/sbYaHNChQbQ","note":"WE\u0027RE WAY PAST THAT\n→ 우린 이미 그 단계를 한참 지났어.\n\npast는 어떤 지점이나 시점을 ‘지나서’ 있다는 뜻입니다. 시간을 말할 때뿐 아니라 문제 해결의 단계, 관계의 수준, 논의의 진행 정도에도 쓸 수 있습니다. We\u0027re past that은 우리가 이미 그 지점을 넘어섰다는 뜻이고, way는 그 거리를 강하게 강조합니다. 조금 지난 정도가 아니라 ‘한참’, ‘훨씬’ 넘어왔다는 말입니다.\n\n예를 들어 사소한 오해를 설명하면 해결될 단계가 이미 지났거나, 초보적인 규칙을 다시 검토할 필요 없이 일이 많이 진행된 상황에서 사용할 수 있습니다. 한국어의 “이제 그런 얘기 할 때는 지났어요”, “그 단계는 벌써 넘어섰죠”와 연결됩니다. 과거의 기준으로 현재 상황을 판단하지 말라는 교정이 들어갈 수 있습니다.\n\nthat이 무엇을 가리키는지에 따라 긍정적일 수도, 부정적일 수도 있습니다. 두 사람이 처음 만났을 때의 어색함을 가리키면 관계가 가까워졌다는 뜻입니다. 단순한 사과로 해결할 수 있는 시점을 가리키면 갈등이 더 심각해졌다는 뜻입니다. 표현 자체가 상황이 좋아졌는지 나빠졌는지를 결정하지 않고, 이미 넘어선 기준점만 표시합니다.\n\n비슷한 표현인 We\u0027re past that는 같은 구조이지만 way가 없어서 강조가 약합니다. We\u0027re over that는 어떤 문제나 감정에서 벗어났다는 뜻으로 쓰일 수 있습니다. We\u0027re way past that는 감정을 극복했다는 뜻에 한정되지 않고, 논의나 상황의 진행 단계가 해당 지점을 크게 넘어섰다는 점을 강조합니다. 반드시 ‘용서했다’고 해석해서는 안 됩니다.\n\n짧은 대화:\nA: Should we first decide whether we need a website? / 먼저 웹사이트가 필요한지부터 정할까?\nB: We\u0027re way past that. The launch is next week. / 우린 이미 그 단계를 한참 지났어. 다음 주가 공개일이야.\n\n여기서 화자는 상대가 너무 이전 단계의 질문을 하고 있다고 지적합니다. 논의를 처음부터 다시 시작하고 싶지 않다는 태도가 실릴 수 있습니다. 그래서 단호하고 효율적인 말이 되기도 하지만, 새로운 참가자의 질문을 무시하는 것처럼 들릴 수도 있습니다. 문장을 이해할 때는 ‘우리가 어떤 선을 넘었는가’와 ‘지금 그 선으로 돌아갈 수 있는가’를 함께 생각하시면 상황의 긴장감까지 읽을 수 있습니다.\n\n기억 고리: 상대가 가리키는 기준점은, 우리가 지금 서 있는 자리에서 이미 한참 뒤에 있습니다."},{"no":36,"en":"IT CUTS BOTH WAYS","ko":"그건 양쪽에 다 적용돼","url":"https://www.youtube.com/shorts/0KMB_Wvx0e8","note":"IT CUTS BOTH WAYS\n→ 그건 양쪽에 다 적용돼.\n→ 장단점을 말할 때는 “그건 좋게도 나쁘게도 작용해.”\n\ncut은 ‘자르다’이고, both ways는 ‘양쪽 방향으로’입니다. 한쪽으로만 힘을 미치는 것이 아니라 반대 방향으로도 같은 작용이 돌아간다는 이미지를 떠올리시면 됩니다. 이 표현은 어떤 원칙이나 주장, 조건이 한 사람에게만 유리하게 적용되는 것이 아니라 상대편이나 다른 측면에도 영향을 미친다는 뜻입니다.\n\n예를 들어 “친구라면 내 사정을 이해해 줘야지”라는 말에 사용할 수 있습니다. 친구 사이의 이해가 한쪽만 제공하는 것이 아니라면, 자신도 상대의 사정을 이해해야 합니다. 한국어의 “그건 서로 마찬가지죠”, “그 논리는 반대로도 적용돼요”와 비슷합니다. 자신에게 유리한 방향으로만 원칙을 사용하는 태도를 짚는 데 잘 맞습니다.\n\n다른 경우에는 한 가지 조건이 장점과 단점을 모두 만든다는 뜻이 됩니다. 어디서든 일할 수 있다는 자유는 편리하지만, 쉬는 시간에도 일이 따라올 수 있습니다. 이때 cuts both ways는 같은 특성이 좋은 결과와 좋지 않은 결과를 함께 가져온다는 뜻입니다. 따라서 항상 두 사람 사이의 공평함만 이야기하는 것은 아닙니다.\n\n비슷한 표현인 It works both ways는 상호 적용이나 상호성을 보다 중립적으로 말할 수 있습니다. It cuts both ways는 영향이 되돌아오거나 유리함과 불리함이 함께 있다는 점을 강조하기 좋습니다. A double-edged sword도 장단점이 공존한다는 뜻으로 가깝지만, cuts both ways는 “네가 세운 그 원칙은 너에게도 적용된다”라는 논리적 반박에도 자연스럽습니다.\n\n짧은 대화:\nA: She should make time for me. We\u0027re friends. / 친구면 걔가 나한테 시간을 내 줘야지.\nB: It cuts both ways. You never call her either. / 그건 서로 마찬가지야. 너도 걔한테 연락 안 하잖아.\n\n이 대화에서는 친구에게 요구하는 기준을 자신에게도 적용하라는 뜻입니다. 상대가 반드시 같은 정도로 잘못했다는 객관적 판정을 내리는 문장은 아닙니다. 화자가 일방적인 주장에 균형을 요구하는 방식입니다. 그래서 어떤 문맥에서는 조언이 되고, 어떤 문맥에서는 상대의 논리를 되받아치는 날카로운 반박이 됩니다. 앞서 나온 ‘그것’이 원칙인지, 관계인지, 조건인지 먼저 찾아보시면 뜻이 분명해집니다.\n\n기억 고리: 한쪽으로 내세운 원칙이나 영향은, 반대쪽으로도 돌아갈 수 있습니다."},{"no":37,"en":"I CAN\u0027T KEEP THIS UP","ko":"나 이렇게는 더 못 버티겠어","url":"https://www.youtube.com/shorts/AL-3d2_Quws","note":"I CAN\u0027T KEEP THIS UP\n→ 나 이렇게는 더 못 버티겠어.\n\nkeep은 어떤 상태를 ‘유지하다’라는 뜻입니다. up은 여기서 현재의 활동이나 수준이 떨어지지 않고 이어지는 감각을 더합니다. keep this up은 지금 하고 있는 행동이나 현재의 강도를 계속 유지한다는 뜻입니다. 이미 진행 중인 상태를 앞으로도 붙들고 갈 수 있느냐가 중심입니다.\n\nthis는 요즘의 생활 방식, 업무량, 감정 노동, 거짓말을 계속 유지하는 일처럼 다양한 것을 가리킬 수 있습니다. 하루에 네 시간만 자며 일하고 있다면 “이 수면과 업무 패턴을 더는 유지하지 못하겠다”가 됩니다. 한국어의 “이렇게는 오래 못 가요”, “계속 이러다가는 못 버텨요”와 닮았습니다.\n\n중요한 점은 아직 어느 정도 해 오고 있었다는 것입니다. 처음부터 전혀 못 하는 일이라기보다, 지금까지 힘을 써서 유지했지만 한계가 가까워졌다는 느낌이 있습니다. 몸이 지쳤을 수도 있고, 돈이나 시간이 바닥날 수도 있으며, 감정적으로 감당하기 어려울 수도 있습니다. 표현 자체는 어느 자원이 부족한지 정하지 않습니다.\n\n비슷한 표현인 I can\u0027t do this는 이 일을 못 하겠다는 넓은 말입니다. 시작조차 어렵거나 지금 당장 수행할 수 없다는 뜻일 수도 있습니다. I can\u0027t keep this up은 ‘계속 같은 방식으로 유지하는 것’이 문제입니다. 반대로 Keep it up은 지금 잘하고 있으니 계속하라는 격려입니다. 같은 keep up이라도 유지하는 상태가 좋고 감당 가능한지에 따라 감정이 달라집니다.\n\n짧은 대화:\nA: You\u0027ve worked late every night this month. / 이번 달 내내 매일 야근했잖아.\nB: I know. I can\u0027t keep this up. / 그러게. 나 이렇게는 더 못 버티겠어.\n\n이 말은 반드시 그 순간 일을 그만두겠다는 최종 선언은 아닙니다. 지금 방식이 지속 가능하지 않으니 변화가 필요하다는 신호일 수 있습니다. 업무를 나누거나 휴식을 늘리면 일을 계속할 수도 있습니다. 그래서 “능력이 없다”는 자기평가와도 구분됩니다. 어떤 일을 해낼 능력이 있더라도, 그 강도로 계속하는 것은 별개의 문제입니다. 해내는 것과 버텨 내는 것 사이의 차이를 보시면 의미가 잘 잡힙니다.\n\n기억 고리: 지금까지는 해 왔지만, 이 상태를 같은 강도로 계속 붙들 힘은 없다는 말입니다."},{"no":38,"en":"THAT ABOUT COVERS IT","ko":"그 정도면 다 얘기한 것 같아","url":"https://www.youtube.com/shorts/Z5F6htERzko","note":"THAT ABOUT COVERS IT\n→ 그 정도면 다 얘기한 것 같아.\n\ncover의 기본 뜻은 무언가를 ‘덮다’입니다. 천으로 탁자를 덮으면 필요한 면적이 천 아래에 들어옵니다. 설명이나 논의에서 cover를 쓰면 어떤 주제나 필요한 내용을 그 범위 안에 담아 다룬다는 뜻이 됩니다. 회의에서 여러 안건을 cover한다는 것은 그 안건들을 하나씩 이야기한다는 말입니다.\n\nThat covers it은 지금까지 한 말이 필요한 내용을 다 다뤘다는 뜻입니다. that은 방금 설명한 내용 전체를, it은 다뤄야 할 주제나 사항을 받습니다. 여기에 about이 들어가면 ‘대략’, ‘거의’라는 조절이 생깁니다. 아주 작은 세부 사항까지 완벽하게 다뤘다고 강하게 단정하기보다, 실질적으로 필요한 이야기는 끝났다는 부드러운 마무리입니다.\n\n한국어의 “대충 필요한 얘기는 다 했네요”, “그 정도면 설명은 된 것 같아요”와 비슷합니다. 여기서 ‘대충’은 성의 없다는 뜻이 아니라 전체 범위를 거의 채웠다는 뜻에 가깝습니다. 설명이 충분한지 묻는 질문에 답하거나, 회의에서 더 다룰 내용이 없는지 확인한 뒤 사용할 수 있습니다.\n\n비슷한 표현인 That\u0027s everything은 빠진 것이 전혀 없다는 쪽으로 더 단정적입니다. That about covers it은 중요한 내용이 대체로 다 들어갔다고 말합니다. That\u0027s enough는 단순히 양이 충분하다는 뜻이며, 듣기 싫어서 그만하라는 말일 수도 있습니다. That about covers it은 필요한 주제의 범위가 채워졌다는 점에 초점이 있어, 완료감을 더 구체적으로 전달합니다.\n\n짧은 대화:\nA: We\u0027ve discussed the budget, the schedule, and the team. Anything else? / 예산, 일정, 팀은 얘기했어. 또 있어?\nB: No, that about covers it. / 없어. 그 정도면 다 얘기한 것 같아.\n\n이 대화에서는 “더는 말하지 마”라는 차단보다 안건 정리가 끝났다는 확인입니다. about 때문에 나중에 작은 항목을 추가해도 앞말과 크게 충돌하지 않습니다. 또한 여행 준비물이나 해야 할 조치를 정리할 때도 사용할 수 있습니다. 꼭 말로 설명하는 상황에 한정되지 않고, 목록이나 조치가 필요한 범위를 충분히 채웠는지 판단하는 데에도 자연스럽습니다.\n\n기억 고리: 필요한 내용을 하나의 면적으로 보면, 지금까지의 설명이 그 면적을 거의 다 덮었습니다."},{"no":39,"en":"CAN\u0027T WIN THEM ALL","ko":"다 이길 순 없지","url":"https://www.youtube.com/shorts/2KpBTVnNZ1M","note":"CAN\u0027T WIN THEM ALL\n→ 매번 잘될 수는 없지.\n\nwin은 ‘이기다’이고, them all은 앞에서 생각하고 있는 여러 경기나 기회를 ‘전부’ 가리킵니다. 보통 You can\u0027t win them all에서 주어가 생략된 형태로 사용합니다. 그런데 이때 you는 상대 한 사람만을 뜻하기보다 누구나 겪는 일반적인 현실을 나타낼 수 있습니다. 모든 경기와 시도에서 다 성공할 수는 없다는 뜻입니다.\n\n이 표현의 부정 범위를 정확히 잡는 것이 중요합니다. ‘하나도 이길 수 없다’가 아니라 ‘전부를 이길 수는 없다’입니다. 승리나 성공이 아예 없다는 비관이 아니라, 일부 실패는 피할 수 없다는 현실적인 수용입니다. 한국어의 “늘 이길 수는 없죠”, “매번 뜻대로 되겠어요”와 같은 감각입니다.\n\n경기뿐 아니라 면접, 공모전, 영업, 사람을 설득하는 일에도 사용할 수 있습니다. 열심히 준비한 제안이 받아들여지지 않았을 때, 이번 실패가 자기 능력 전체를 부정하지는 않는다는 식으로 마음을 추스를 수 있습니다. 결과를 대수롭지 않게 넘기는 말이 될 수도 있고, 자신이나 상대에게 건네는 담담한 위로가 될 수도 있습니다.\n\n비슷한 표현인 You can\u0027t win은 어떤 상황에서 무엇을 해도 유리한 결과를 얻기 어렵다는 뜻으로 쓰일 수 있습니다. Can\u0027t win them all은 많은 시도 가운데 일부가 실패한다는 뜻입니다. Better luck next time은 다음에는 운이 좋기를 바라는 말이고, 이 표현은 현재의 실패를 인생이나 활동 전체의 자연스러운 일부로 받아들이는 쪽에 초점이 있습니다.\n\n짧은 대화:\nA: They chose another proposal. / 다른 제안서를 골랐대.\nB: That\u0027s disappointing, but you can\u0027t win them all. / 아쉽네. 그래도 매번 잘될 수는 없지.\n\n이 말이 위로가 되는 이유는 실패를 특별한 결함이 아니라 누구나 겪는 분포의 일부로 보기 때문입니다. 그러나 상대에게 정말 중요한 기회였거나 큰 손실이 생겼다면 너무 쉽게 말하지 않는 편이 좋습니다. “별일 아니잖아”처럼 느껴질 수 있기 때문입니다. 표현의 중심은 노력을 무시하는 데 있지 않고, 노력해도 모든 결과를 통제할 수 없다는 사실을 인정하는 데 있습니다.\n\n기억 고리: 이번 한 번의 실패가 이상한 것이 아니라, 모든 시도를 다 이길 수 없는 것이 현실입니다."},{"no":40,"en":"I\u0027M GONNA HOLD YOU TO THAT","ko":"그 말 꼭 지켜야 해","url":"https://www.youtube.com/shorts/R--1gnRuQmc","note":"I\u0027M GONNA HOLD YOU TO THAT\n→ 그 말 꼭 지켜야 해.\n\nhold는 무언가를 ‘잡고 놓지 않다’라는 감각이 있습니다. hold someone to something은 어떤 사람을 그 사람이 한 약속이나 정해진 기준에 묶어 두고, 그대로 이행하도록 요구한다는 뜻입니다. “네가 방금 한 말을 나중에 슬쩍 바꾸게 두지는 않을 거야”라는 흐름으로 이해하시면 자연스럽습니다.\n\nthat은 보통 상대가 방금 한 약속이나 장담을 가리킵니다. 친구가 “네가 합격하면 저녁은 내가 살게”라고 했을 때 이 표현으로 답하면, “좋아, 그 말 기억하고 꼭 받아낼 거야”라는 뜻입니다. 한국어의 “말했다?”, “나중에 딴소리하기 없기예요”, “그 약속 꼭 지켜요”와 비슷한 감각입니다.\n\ngonna는 going to의 구어형입니다. 여기서는 앞으로 그 약속을 지키도록 요구하겠다는 의지를 나타냅니다. 상대를 당장 물리적으로 붙잡는 것이 아니라, 말과 행동이 일치하도록 책임을 묻는 것입니다. 친한 사이에서는 기대와 농담이 섞인 반응이 되고, 업무에서는 일정이나 성과에 대한 분명한 책임 확인이 될 수 있습니다.\n\n비슷한 표현인 I\u0027ll remember that은 그 말을 기억하겠다는 뜻입니다. 좋은 말도 나쁜 말도 기억할 수 있으며, 반드시 이행을 요구하지는 않습니다. I\u0027m gonna hold you to that은 기억하는 데서 더 나아가 실제로 지켜 달라고 하겠다는 뜻입니다. Don\u0027t hold that against me는 과거 일을 부정적인 평가의 근거로 삼지 말라는 말이므로, 같은 hold가 있어도 구조와 목적이 다릅니다.\n\n짧은 대화:\nA: If you finish the project, dinner\u0027s on me. / 프로젝트 끝내면 저녁은 내가 살게.\nB: I\u0027m gonna hold you to that. / 그 말 꼭 지켜야 해.\n\n이 대화에서 상대의 약속을 의심한다고까지 볼 필요는 없습니다. 기쁜 기대를 장난스럽게 확정하는 반응일 수 있습니다. 다만 말투가 단호하면 “네 장담을 실제 기준으로 삼겠다”라는 압박이 생깁니다. 그래서 상대가 가벼운 가능성만 언급했는지, 정말 약속했는지 구분하는 것이 중요합니다. 이 표현은 듣는 사람이 상대의 말을 책임 있는 약속으로 받아들였음을 알리는 역할을 합니다.\n\n기억 고리: 네가 한 말을 그냥 흘려듣지 않고, 나중에 행동으로 지키도록 붙잡겠다는 말입니다."},{"no":41,"en":"APPARENTLY NOT","ko":"보아하니 아닌가 봐","url":"https://www.youtube.com/shorts/MkF2FA6znF8","note":"APPARENTLY NOT\n→ 보아하니 아닌가 봐.\n\napparent는 겉으로 드러나거나 알 수 있는 상태를 가리키고, apparently는 현재 드러난 정황이나 전달받은 정보에 따르면 그렇다는 뜻입니다. Apparently not은 앞에서 나온 질문이나 기대를 부정하면서, 그 판단이 현재 얻은 증거에 바탕을 두고 있음을 보여 줍니다. 혼자 근거 없이 “아니야”라고 단정하는 말과는 결이 다릅니다.\n\n예를 들어 문이 열릴 줄 알고 손잡이를 당겼는데 잠겨 있다면, “오늘 영업하는 거 아니었어?”라는 질문에 Apparently not이라고 답할 수 있습니다. 문이 잠긴 사실을 보고 현재는 아닌 것 같다고 판단하는 것입니다. 한국어의 “보아하니 아닌가 보네요”, “알고 보니 아니었나 봐요”와 비슷합니다.\n\n겉모습만 직접 보았을 때에만 쓰는 것은 아닙니다. 누군가에게 새 소식을 들은 뒤 판단을 수정할 때도 자연스럽습니다. 기대와 실제가 어긋난 상황에서는 실망이나 건조한 유머가 실릴 수 있습니다. “될 줄 알았는데 결과를 보니 안 됐네”라는 반응으로 쓰면, 짧은 두 단어 안에 기대가 수정되는 흐름이 들어갑니다.\n\n비슷한 표현인 Probably not은 가능성을 추정해서 “아마 아닐 것 같다”라고 말합니다. Apparently not은 현재 드러난 정황이나 받은 정보에 근거한다는 점이 더 두드러집니다. Definitely not은 확실한 부정입니다. apparently가 항상 매우 낮은 확신을 뜻하는 것은 아니지만, 화자가 직접 모든 사실을 확정했다기보다 확인된 모습에 따라 판단한다는 거리를 남깁니다.\n\n짧은 대화:\nA: I thought the meeting was canceled. / 회의 취소된 줄 알았는데.\nB: Apparently not. Everyone\u0027s joining the call. / 아닌가 봐. 다들 화상회의에 들어오고 있어.\n\n이 대화에서는 다른 사람들이 접속하는 행동이 판단의 근거입니다. 다만 그것만으로 회의가 반드시 열린다는 사실을 완전히 증명하는 것은 아닐 수 있습니다. 그래서 “내가 지금 볼 수 있는 바로는 그렇다”라는 태도가 표현과 잘 맞습니다. 억양에 따라 “뻔히 아니잖아”처럼 퉁명스럽게 들릴 수도 있지만, 단어 자체가 상대를 비웃는 뜻은 아닙니다. 앞선 기대와 새 증거 사이의 관계를 먼저 보시면 자연스럽게 읽힙니다.\n\n기억 고리: 원래 생각은 달랐을 수 있지만, 지금 드러난 증거를 보니 아닌 쪽이라는 말입니다."},{"no":42,"en":"YOU\u0027RE ASKING FOR TROUBLE","ko":"너 그러다 문제 생겨","url":"https://www.youtube.com/shorts/3SR1z4zqs5k","note":"YOU\u0027RE ASKING FOR TROUBLE\n→ 너 그러다 문제 생겨.\n\nask for는 무언가를 ‘요청하다’, ‘달라고 하다’입니다. trouble은 ‘문제’, ‘곤란’, ‘말썽’입니다. 글자대로 보면 상대가 문제를 달라고 요청하고 있다는 뜻이지만, 실제로 불행을 원한다고 말하는 것은 아닙니다. 지금 행동이 문제를 부를 만큼 위험하거나 경솔하다는 것을 비유적으로 경고합니다.\n\n밤새 잠을 안 자고 장거리 운전을 하겠다는 사람에게 이 표현을 쓰면, 그 행동이 사고나 어려움의 가능성을 높인다는 뜻입니다. 한국어의 “문제를 자초하고 있네요”, “굳이 화를 부르네요”, “그러다 탈 나요”와 같은 사고방식입니다. 원하지 않는 결과라도 그쪽으로 이어지는 행동을 선택하면 마치 결과를 불러들이는 것처럼 말하는 것입니다.\n\n현재 진행형인 you\u0027re asking은 지금의 선택이나 행동을 문제 삼습니다. 평생 말썽만 피우는 사람이라고 성격 전체를 규정하기보다, 현재 하고 있는 일이 위험하다고 지적하는 데 잘 맞습니다. 물론 반복되는 행동을 두고 말할 수도 있지만, 표현의 초점은 사람의 본성보다 문제를 유발할 수 있는 행동에 있습니다.\n\n비슷한 표현인 You\u0027re in trouble은 이미 곤란한 상태에 있다는 뜻입니다. You\u0027re asking for trouble은 아직 문제가 생기지 않았더라도 그 방향으로 가고 있다고 경고합니다. You\u0027re asking for it은 문맥에 따라 벌이나 보복을 당할 만한 행동을 한다는 말이 되어 더 위협적으로 들릴 수 있습니다. trouble을 명시하면 걱정하는 결과가 문제나 곤란이라는 점이 더 분명해집니다.\n\n짧은 대화:\nA: I\u0027ll drive home even though I haven\u0027t slept all night. / 밤새 한숨도 못 잤지만 운전해서 집에 갈게.\nB: You\u0027re asking for trouble. Get some rest first. / 너 그러다 문제 생겨. 먼저 좀 쉬어.\n\n이 대답은 아직 일어나지 않은 결과를 막으려는 경고입니다. 반드시 “문제가 생겨도 네 잘못이야”라는 도덕적 판단을 뜻하는 것은 아닙니다. 그러나 이미 피해를 입은 사람에게 사용하면 책임을 떠넘기는 말처럼 들릴 수 있습니다. 예방을 위해 위험한 선택을 지적하는 상황과, 일어난 피해를 두고 사람을 탓하는 상황을 구분하시면 표현의 무게를 더 정확하게 이해할 수 있습니다.\n\n기억 고리: 원하지 않는 문제라도, 지금 행동이 마치 그 문제를 불러 달라고 요청하는 모양이라는 뜻입니다."},{"no":43,"en":"THAT SHOULD DO IT","ko":"그 정도면 될 거야","url":"https://www.youtube.com/shorts/g435w4YCIrM","note":"THAT SHOULD DO IT\n→ 그 정도면 될 거야.\n\ndo는 ‘하다’이지만, 여기서는 필요한 일을 ‘해내다’, 원하는 결과를 ‘만들어 내다’라는 뜻입니다. it은 문맥에서 해결해야 하는 일이나 달성할 결과를 가리킵니다. That does it이 그 행동으로 필요한 선에 도달했다고 말한다면, That should do it은 그렇게 될 것이라고 합리적으로 예상하는 표현입니다.\n\nshould를 ‘해야 한다’라는 의무로만 외우면 이 문장을 잘못 해석하기 쉽습니다. 여기서는 어떤 행동을 강요하는 것이 아니라, 상황상 그런 결과가 나올 것으로 기대합니다. 부품을 교체한 뒤 “이 정도면 고쳐졌을 거야”라고 하거나, 음식에 간을 조금 더 한 뒤 “이 정도면 맞을 거야”라고 하는 식입니다.\n\n한국어의 “그 정도면 되겠네요”, “이러면 해결될 거예요”와 비슷합니다. 이미 충분한 근거가 있어서 기대하는 말이지만, 실제 결과를 완전히 확인하지 않았거나 단정을 조금 누그러뜨릴 때 잘 맞습니다. that은 방금 한 조치일 수도 있고, 상대가 앞으로 하겠다고 제안한 조치일 수도 있습니다.\n\n비슷한 표현인 That will do it은 필요한 결과가 나올 것이라는 확신이 더 직접적으로 느껴질 수 있습니다. That might do it은 될 가능성을 더 조심스럽게 말합니다. That should do it은 그 사이에서 ‘이유를 볼 때 될 것으로 예상한다’는 느낌입니다. 또한 That should do는 “그 정도면 충분하겠다”라는 뜻으로 비슷하지만, it이 있으면 특정한 문제 해결이나 결과를 받는 구조가 더 분명해집니다.\n\n짧은 대화:\nA: I\u0027ve tightened the loose cable. / 헐거운 케이블을 단단히 연결했어.\nB: That should do it. Try turning it on. / 그 정도면 될 거야. 한번 켜 봐.\n\n이 대화에서는 케이블이 문제였다는 판단을 바탕으로 해결을 예상하지만, 전원을 켜서 확인하는 단계가 남아 있습니다. 그렇다고 should가 항상 불확실해서 자신이 없다는 뜻은 아닙니다. 전문가도 합리적인 예측을 담담하게 말할 때 사용할 수 있습니다. 핵심은 의무와 예상의 차이입니다. ‘그것이 해야 한다’가 아니라 ‘그 조치면 필요한 효과가 날 것으로 보인다’라고 연결하시면 자연스럽습니다.\n\n기억 고리: should는 의무가 아니라 예상이며, 방금 조치가 필요한 결과를 낼 것 같다는 말입니다."},{"no":44,"en":"IT\u0027S NOT OVER YET","ko":"아직 끝난 건 아니야","url":"https://www.youtube.com/shorts/-UNRNSFkJDg","note":"IT\u0027S NOT OVER YET\n→ 아직 끝난 건 아니야.\n\nover는 위치를 나타낼 때 ‘위로’, ‘넘어서’라는 뜻이지만, 일이나 사건을 두고 쓰면 ‘끝난’ 상태를 나타냅니다. 과정의 끝을 넘어 더 이상 진행되지 않는다고 이해하시면 됩니다. It\u0027s over는 끝났다는 말이고, not과 yet이 붙으면 지금 시점에는 아직 그 끝에 도달하지 않았다는 뜻이 됩니다.\n\nyet은 부정문에서 ‘아직’을 나타내며, 현재까지 실현되지 않은 상태를 표시합니다. It\u0027s not over yet은 단순히 시간이 남았다는 정보뿐 아니라, 결과가 확정되지 않았다는 의미를 전달하기 좋습니다. 경기에서 크게 뒤지고 있어도 시간이 남았다면 뒤집을 기회가 있다는 격려가 됩니다. 한국어의 “끝날 때까지 끝난 게 아니죠”와 사고방식이 통합니다.\n\n그러나 언제나 희망을 주는 말은 아닙니다. 갈등이 끝난 줄 아는 상대에게 말하면 “이 일은 아직 정리되지 않았어”라는 경고가 될 수 있습니다. 힘든 상황에서 추가 문제가 남았다고 알릴 때는 부담스러운 말이 됩니다. 표현 자체는 ‘끝나지 않았다’는 사실을 말하고, 그 사실이 좋은지 나쁜지는 끝나기를 바라는 대상이 무엇인지에 따라 달라집니다.\n\n비슷한 표현인 It\u0027s not over는 아직 끝나지 않았다는 뜻을 직접 말합니다. yet은 현재까지라는 시간적 관점을 더 분명하게 만듭니다. We\u0027re not done은 우리가 할 일이 남았다는 데 초점을 맞추기 좋고, It\u0027s not over yet은 경기나 사건 전체의 진행 상태를 가리킬 수 있습니다. 또 It\u0027s never over는 끝나는 때가 없다는 훨씬 강한 말이므로 같은 뜻이 아닙니다.\n\n짧은 대화:\nA: We\u0027re two points behind with a minute left. / 1분 남았는데 2점 지고 있어.\nB: It\u0027s not over yet. We can still win. / 아직 끝난 건 아니야. 아직 이길 수 있어.\n\n이 대화에서 화자는 승리를 보장하지 않습니다. 패배를 확정하기에는 아직 이르다는 점을 말합니다. 따라서 막연한 낙관보다 ‘판단을 끝낼 시점이 아직 오지 않았다’라는 뜻으로 이해하시면 좋습니다. 이미 유리한 사람에게 말하면 방심하지 말라는 경계가 될 수도 있습니다. 같은 문장이 뒤지는 사람에게는 희망을, 앞서는 사람에게는 긴장을 주는 이유입니다.\n\n기억 고리: 현재 상황이 어떻든, 최종 결과에 마침표를 찍을 시점은 아직 아니라는 말입니다."},{"no":45,"en":"THAT\u0027S BENEATH YOU","ko":"그런 행동은 너답지 않아","url":"https://www.youtube.com/shorts/ccDih99bPT8","note":"THAT\u0027S BENEATH YOU\n→ 그런 행동은 너답지 않아.\n\nbeneath의 기본 뜻은 ‘아래에’입니다. 공간적인 높낮이를 사람의 가치나 행동 수준에 적용하면, 어떤 행동이 그 사람에게 기대되는 기준보다 아래에 있다는 뜻이 됩니다. That\u0027s beneath you는 “너라면 그보다 나은 행동을 할 수 있는데, 지금 그 행동은 네 수준에 못 미친다”라는 판단입니다.\n\n이 표현은 흔히 비열한 보복, 유치한 조롱, 품위 없는 행동을 말릴 때 사용합니다. 상대를 형편없는 사람이라고 단정하기보다, 상대에게 더 높은 기준을 기대하기 때문에 그런 행동을 하지 말라고 요구하는 것입니다. 한국어의 “너까지 그럴 필요는 없잖아요”, “그런 짓은 너답지 않아요”와 가깝습니다.\n\nthat이 무엇인지에 따라 적절한 번역이 달라집니다. 행동을 가리키면 인격이나 품위에 대한 말이 되고, 일을 가리키면 능력이나 지위에 비해 수준이 낮다는 뜻으로 쓰일 수 있습니다. 다만 후자의 쓰임은 특정한 일을 하찮게 보는 태도로 들릴 수 있습니다. 따라서 항상 따뜻한 격려라고만 이해하기보다, ‘무엇을 낮다고 평가하고 있는가’를 살펴보셔야 합니다.\n\n비슷한 표현인 That\u0027s not like you는 평소의 모습과 다르다는 뜻입니다. 평소와 다른 친절한 행동에도 사용할 수 있으므로 반드시 도덕적인 비판은 아닙니다. That\u0027s beneath you는 행동의 수준이 기대보다 낮다는 평가가 들어갑니다. You\u0027re better than that도 매우 가까우며, 상대에게 더 나은 선택을 요구하는 표현입니다.\n\n짧은 대화:\nA: I\u0027m going to post his embarrassing photos to get back at him. / 복수하려고 걔 창피한 사진을 올릴 거야.\nB: Don\u0027t. That\u0027s beneath you. / 그러지 마. 그런 행동은 너답지 않아.\n\n이 대화에서 말리는 사람은 상대의 분노 자체를 부정하기보다, 분노를 표현하는 방식이 상대에게 어울리지 않는다고 말합니다. 그래서 효과적인 만류가 될 수 있지만, 상대가 매우 화가 난 상태라면 훈계하거나 도덕적으로 위에서 내려다보는 말처럼 들릴 수도 있습니다. 표현의 기본 구조는 칭찬과 비판이 함께 있는 형태입니다. ‘너를 그만큼 높게 보기 때문에, 이 행동은 낮게 평가한다’는 관계를 이해하시면 뉘앙스가 선명해집니다.\n\n기억 고리: 너라는 사람에게 기대하는 높이에 비해, 방금 그 행동은 너무 아래에 있다는 말입니다."},{"no":46,"en":"THAT\u0027S THAT","ko":"그걸로 끝이야","url":"https://www.youtube.com/shorts/2FUL_74KPB0","note":"THAT\u0027S THAT\n→ 그걸로 끝이야.\n\nthat은 앞에서 나온 일이나 결정을 가리키는 말입니다. That\u0027s that은 겉으로 보면 같은 말을 반복하는 단순한 구조지만, 대화에서는 해당 사안을 더 설명하거나 변경할 필요 없이 마무리한다는 기능을 합니다. “그 일은 그렇게 정리된 거다”라는 종결의 선언으로 이해하시면 자연스럽습니다.\n\n예를 들어 여러 선택지를 검토한 뒤 토요일에 만나기로 확정했다면, 이 표현으로 논의를 닫을 수 있습니다. 한국어의 “그럼 그걸로 끝이네요”, “그렇게 정리하죠”, “더 말할 것 없어요”와 닮았습니다. 중요한 것은 사건이 저절로 끝났다는 보고보다, 화자가 이 문제에 마침표를 찍는다는 태도입니다.\n\n상황에 따라 담담한 완료도 되고 단호한 차단도 됩니다. 일을 끝내고 말하면 후련한 느낌이지만, 아이가 계속 요구하는 상황에서 부모가 말하면 “결정됐으니 더 말하지 마”라는 뜻이 강해집니다. 같은 단어의 반복이 복잡한 논의나 재검토의 여지를 닫는 효과를 내는 것입니다.\n\n비슷한 표현인 That\u0027s it은 ‘바로 그거다’, ‘전부다’, ‘끝이다’처럼 여러 뜻이 있습니다. That\u0027s that은 특히 사안이 결정되거나 마무리되어 더 논의하지 않겠다는 용법이 두드러집니다. That does it은 방금 행동이 작업이나 인내를 끝내는 결정타가 되었다는 느낌입니다. That\u0027s that은 결정타 자체보다, 이제 사안이 닫혔다는 결과에 초점을 둡니다.\n\n짧은 대화:\nA: So we\u0027re leaving at eight, no matter what? / 그러니까 무슨 일이 있어도 8시에 출발하는 거지?\nB: Yes. That\u0027s that. / 응. 그걸로 끝이야.\n\n이 대화에서는 더 시간을 조정하지 않겠다는 뜻이 됩니다. 친근한 말투라면 결정이 깔끔하게 끝났다는 만족감이지만, 강하게 끊으면 협의의 여지가 없다는 인상을 줍니다. 또한 좋지 않은 결과를 바꿀 수 없을 때 “뭐, 그렇게 된 거지”라는 체념으로 쓰기도 합니다. 따라서 늘 승리감이나 권위만 나타내는 표현은 아닙니다. 누가 결정을 내렸는지보다, 지금 화자가 더 이어 가지 않겠다고 보는 사안이 무엇인지 찾으시면 뜻이 잘 잡힙니다.\n\n기억 고리: 같은 that을 반복하며, 이미 나온 그 일에 더는 말을 보태지 않고 마침표를 찍는 것입니다."},{"no":47,"en":"I WASN\u0027T BORN YESTERDAY","ko":"나 그렇게 쉽게 속는 사람 아니야","url":"https://www.youtube.com/shorts/x9lX48EU3QA","note":"I WASN\u0027T BORN YESTERDAY\n→ 나 그렇게 쉽게 속는 사람 아니야.\n\nborn은 ‘태어난’이라는 뜻이고, yesterday는 ‘어제’입니다. 글자대로는 어제 태어나지 않았다는 말이지만, 실제로 생일을 알려 주는 문장은 아닙니다. 막 태어난 사람이라면 세상 경험이 없겠지만 자신은 그렇지 않다는 점을 이용해, 순진하게 아무 말이나 믿는 사람이 아니라고 말합니다.\n\n누군가 눈에 뻔히 보이는 거짓말이나 어설픈 핑계를 대고 있을 때 특히 잘 맞습니다. “세상을 하루 이틀 산 것도 아닌데, 그 정도 수법은 알아요”라는 감각입니다. 한국어의 “내가 세상 물정 모르는 줄 알아요?”, “그 정도에 넘어갈 사람은 아니에요”와 연결됩니다. 자신의 나이보다 경험과 판단력을 강조하는 표현입니다.\n\n과거형 wasn\u0027t는 실제로 태어난 사건이 과거이기 때문에 쓰입니다. 앞에서 배운 wouldn\u0027t처럼 가정적인 거리를 만드는 구조와는 다릅니다. 문장의 문자 그대로의 내용은 누구나 인정할 만한 사실이지만, 너무 당연한 사실을 굳이 말함으로써 ‘나를 순진하게 취급하지 말라’는 함의를 전달하는 것입니다.\n\n비슷한 표현인 I\u0027m not stupid는 자신을 바보 취급하지 말라는 뜻으로 더 직접적입니다. I wasn\u0027t born yesterday는 세상 경험의 이미지를 빌려 같은 경계를 표현합니다. I know는 특정한 정보를 안다는 뜻일 수 있지만, 이 표현은 상대의 말이나 의도를 믿지 않는다는 태도를 나타내기 쉽습니다. 단순히 모르는 내용을 안다고 주장하는 말은 아닙니다.\n\n짧은 대화:\nA: Just send me the money now. I\u0027ll explain everything later. / 일단 지금 돈부터 보내. 나중에 다 설명할게.\nB: I wasn\u0027t born yesterday. Tell me what it\u0027s for first. / 나 그렇게 쉽게 속는 사람 아니야. 먼저 어디에 쓰는 돈인지 말해.\n\n이 대답에는 상대의 요구가 의심스럽다는 판단이 들어 있습니다. 그래서 친한 사이의 농담으로는 가볍게 들릴 수 있지만, 실제 대화에서는 상대가 자신을 속이려 한다고 암시하는 다소 날카로운 말입니다. 무조건 자신이 옳다는 증거가 되는 문장도 아닙니다. 화자가 경험이 있다는 자신감을 드러낼 뿐이므로, 구체적인 사실을 확인하는 것과는 별개입니다. 표현의 중심은 ‘나이가 많다’보다 ‘그렇게 만만하게 보지 말라’에 있습니다.\n\n기억 고리: 세상을 어제 처음 본 사람은 아니니, 뻔한 말로 나를 쉽게 넘기려 하지 말라는 뜻입니다."},{"no":48,"en":"I\u0027M GETTING THERE","ko":"점점 돼 가고 있어","url":"https://www.youtube.com/shorts/4aF_sYmGwb8","note":"I\u0027M GETTING THERE\n→ 점점 돼 가고 있어.\n\nget은 어떤 상태나 장소에 ‘도달하다’라는 뜻으로 자주 쓰입니다. there는 ‘거기’이지만, 이 표현에서는 꼭 실제 장소를 가리키지 않습니다. 일을 완성한 상태, 원하는 실력, 몸이 회복된 상태처럼 목표 지점을 가리킬 수 있습니다. I\u0027m getting there는 아직 도착하지는 않았지만 그쪽으로 가까워지고 있다는 뜻입니다.\n\n현재 진행형이므로 결과보다 이동 과정이 중심입니다. 외국어를 배우는 중이라 아직 유창하지 않더라도 전보다 나아졌다면 이렇게 말할 수 있습니다. 한국어의 “점점 나아지고 있어요”, “이제 좀 되어 가네요”, “아직 하는 중이지만 진전은 있어요”와 닮았습니다. 미완성을 인정하면서도 진행되고 있다는 점을 함께 전달합니다.\n\n이 말에는 서두르지 않고 꾸준히 가까워지는 느낌이 실릴 수 있습니다. 상대가 “다 됐어?”라고 재촉할 때 사용하면 “아직이지만 하고 있어”라는 완곡한 답이 됩니다. 다만 실제로 얼마나 남았는지는 말하지 않습니다. 꽤 많이 남았어도 눈에 띄는 진전이 있으면 쓸 수 있으므로, 무조건 ‘거의 다 됐다’로 번역하면 진행 정도를 과장할 수 있습니다.\n\n비슷한 표현인 I\u0027m almost there는 목표에 거의 도달했다는 뜻이 더 분명합니다. I\u0027m getting there는 방향과 진전만 강조할 수 있습니다. I\u0027m on my way는 실제로 목적지로 이동 중이라는 뜻으로 흔히 쓰이며, 비유적으로도 가능하지만 학습이나 회복의 진전을 말할 때는 getting there가 더 자연스러운 경우가 많습니다.\n\n짧은 대화:\nA: Are you comfortable speaking English now? / 이제 영어로 말하는 게 편해졌어?\nB: I\u0027m getting there. I can talk for longer without stopping. / 점점 돼 가고 있어. 멈추지 않고 더 오래 말할 수 있어.\n\n이 예시에서는 완전히 편해졌다고 자신 있게 선언하지 않으면서도, 전보다 발전했다는 근거를 제시합니다. 그래서 겸손하지만 지나치게 부정적이지 않은 답이 됩니다. 실제 장소를 두고 사용할 때는 이동 상황을 뜻할 수도 있으므로, there가 가리키는 목표가 무엇인지 먼저 보셔야 합니다. 눈에 보이는 목적지든 추상적인 능력이든, 현재 위치에서 그쪽으로 가까워지고 있다는 공통적인 감각은 같습니다.\n\n기억 고리: 아직 목표 지점에 서 있지는 않지만, 그쪽으로 분명히 가까워지고 있다는 말입니다."},{"no":49,"en":"WHAT GIVES?","ko":"대체 무슨 일이야?","url":"https://www.youtube.com/shorts/dh83eGasa9A","note":"WHAT GIVES?\n→ 무슨 일이야?\n\ngive의 가장 익숙한 뜻은 ‘주다’이지만, What gives?를 “무엇이 주니?”라고 직역하면 실제 의미와 연결되지 않습니다. give에는 힘을 받았을 때 버티던 것이 움직이거나 양보하는 뜻도 있지만, 그것만으로 이 관용 표현의 뜻이나 어원을 단정하는 것은 피하는 편이 좋습니다. 회화에서는 예상과 다른 상황을 보고 이유나 사정을 묻는 덩어리로 익히시면 됩니다.\n\n핵심은 단순한 일상 안부보다 ‘뭔가 이상한데 왜 이렇지?’라는 의문입니다. 늘 열려 있던 문이 잠겼거나, 약속한 사람이 갑자기 연락을 끊었거나, 모두가 자신을 보고 웃을 때 사용할 수 있습니다. 한국어의 “왜 이래요?”, “무슨 영문이에요?”, “뭔 일 있어요?”와 비슷합니다. 눈앞의 어긋남에 대한 설명을 요구하는 말입니다.\n\n질문이 짧아서 상황에 따라 가벼운 호기심도, 짜증 섞인 항의도 될 수 있습니다. 친구가 갑자기 파티 준비를 하고 있다면 놀라서 묻는 말이고, 상대가 여러 번 약속을 어겼다면 이유를 따지는 말이 됩니다. 표현 자체가 욕설은 아니지만, 정중한 정보 요청보다는 캐주얼하고 다소 거침없는 분위기입니다.\n\n비슷한 표현인 What\u0027s up?은 인사처럼 “요즘 어때?”라고 묻거나 현재 상황을 넓게 확인할 수 있습니다. What gives?는 보통 설명이 필요한 이상한 점이 있다는 전제를 더 강하게 깝니다. Why?는 이유를 직접 묻는 가장 넓은 질문이고, What gives?는 앞뒤 상황 전체를 가리키며 “대체 어떻게 된 거야?”라고 반응하는 말입니다.\n\n짧은 대화:\nA: You said the tickets were free, but they\u0027re charging us. What gives? / 표가 공짜라고 했잖아. 그런데 돈을 받네. 무슨 일이야?\nB: I think the offer ended yesterday. / 그 행사가 어제 끝났나 봐.\n\n이 대화에서는 공짜라는 정보와 실제 요금 청구 사이의 차이가 질문을 부릅니다. 화자는 반드시 상대가 거짓말했다고 단정하는 것은 아니지만, 그 차이를 설명해 달라고 요구합니다. 그래서 문장 하나만 떼어 외우기보다 ‘원래 예상’과 ‘지금 관찰한 일’을 함께 떠올리시면 쓰임이 명확해집니다. 일반적인 안부 인사로 아무 때나 사용하는 표현은 아니라는 점도 기억하시면 좋습니다.\n\n기억 고리: 기대했던 모습과 지금 상황이 어긋날 때, 그 사이에 무슨 사정이 있느냐고 묻는 말입니다."},{"no":50,"en":"YOU ARE IMPOSSIBLE","ko":"너 진짜 못 말린다","url":"https://www.youtube.com/shorts/5PPfCHOdb9I","note":"YOU ARE IMPOSSIBLE\n→ 너 진짜 못 말린다.\n\nimpossible은 기본적으로 ‘불가능한’이라는 뜻입니다. 사람에게 이 말을 사용한다고 해서 그 사람이 존재할 수 없는 생물이라는 뜻은 아닙니다. 그 사람을 설득하거나 만족시키거나 상대하는 일이 거의 불가능하게 느껴진다는 평가를 사람 자체에 붙인 것입니다. 무엇이 불가능한지는 대화 상황이 채워 줍니다.\n\n상대가 어떤 제안에도 불평하거나, 계속 장난을 치거나, 아무리 설명해도 고집을 꺾지 않을 때 사용할 수 있습니다. 한국어의 “너는 정말 당해 낼 수가 없어요”, “진짜 못 말리겠네요”, “너랑은 말이 안 통해요”와 연결됩니다. 상대의 지능이나 존재 가능성보다, 지금 그 사람을 다루기 어려운 느낌이 중심입니다.\n\n감정의 폭이 꽤 넓다는 점이 중요합니다. 진지하게 화난 목소리라면 “너는 정말 상대하기 힘든 사람이야”라는 강한 비판이 됩니다. 반대로 좋아하는 사람이 계속 귀여운 장난을 칠 때 웃으면서 말하면 애정 섞인 “정말 못 말려”가 됩니다. 표현만 보고 무조건 심한 욕이나 무조건 다정한 농담으로 결정할 수는 없습니다.\n\n비슷한 표현인 That\u0027s impossible은 어떤 계획이나 사건이 실현 불가능하다는 뜻입니다. You are impossible은 사람이 합리적인 대응을 어렵게 만든다는 평가입니다. You\u0027re difficult도 상대하기 까다롭다는 뜻이지만, impossible은 그 정도를 더 과장합니다. You\u0027re unbelievable 역시 감탄이나 비판이 될 수 있지만, impossible은 특히 설득이나 대응의 어려움과 잘 연결됩니다.\n\n짧은 대화:\nA: I don\u0027t want pizza, noodles, rice, or sandwiches. / 피자도 국수도 밥도 샌드위치도 싫어.\nB: You are impossible. Then what do you want? / 너 진짜 못 말린다. 그럼 뭘 먹고 싶은데?\n\n이 대화에서는 선택지를 모두 거절하는 태도 때문에 만족시킬 방법을 찾기 어렵다는 뜻입니다. 화자가 객관적으로 모든 방법을 시도했다는 말은 아닙니다. 답답함을 과장해서 표현하는 것입니다. 친한 사이에서는 익숙한 반응일 수 있지만, 관계가 멀거나 진지한 갈등에서는 사람 전체를 문제 삼는 말처럼 들릴 수 있습니다. 특정 행동이 어렵다는 설명보다 평가의 범위가 넓다는 점을 보시면 좋습니다.\n\n기억 고리: 네 존재가 불가능하다는 말이 아니라,
