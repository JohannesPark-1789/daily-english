지금 너를 설득하거나 맞춰 주는 일이 불가능하게 느껴진다는 말입니다."},{"no":51,"en":"SO MUCH FOR THAT","ko":"그건 물 건너갔네","url":"https://www.youtube.com/shorts/MSu5aho-RfY","note":"SO MUCH FOR THAT\n→ 그건 물 건너갔네.\n\nso much for는 이 표현에서 하나의 덩어리로 이해하는 것이 좋습니다. so much를 ‘매우 많이’, for를 ‘~을 위해’로 나누어 “그것을 위해 많이”라고 해석하면 의미가 이어지지 않습니다. 관용적으로는 어떤 기대나 계획이 더는 성립하지 않게 되었을 때, 이제 그 이야기는 접어야겠다고 반응하는 말입니다.\n\nthat은 방금 무너진 계획, 기대, 주장 등을 가리킵니다. 주말에 소풍을 가려 했는데 폭우 예보를 확인했다면 “소풍 계획은 물 건너갔네”라는 뜻입니다. 한국어의 “그건 글렀네요”, “그러면 그 얘기는 끝이네요”와 비슷합니다. 그전까지 의미가 있던 계획이 새 상황 때문에 힘을 잃는 순간에 잘 어울립니다.\n\n실망뿐 아니라 빈정거림에도 사용할 수 있습니다. 어떤 제품이 절대 고장 나지 않는다고 자랑했는데 바로 멈췄다면, 그 장담을 두고 “그렇게 튼튼하다더니 말 다 했네”라는 반응이 됩니다. 표현 자체가 실패 원인을 설명하는 것은 아닙니다. 앞선 기대나 주장과 눈앞의 결과가 어긋났다는 것을 짧게 정리합니다.\n\n비슷한 표현인 That\u0027s canceled는 실제 일정이 취소되었다는 사실을 직접 말합니다. So much for that은 공식적으로 취소되지 않았더라도 화자가 더는 기대하기 어렵다고 판단할 수 있습니다. That\u0027s that은 사안이 마무리되었다는 종결감이 중심이고, So much for that은 원래 기대했던 것이 무너졌다는 실망이나 비꼼이 잘 드러납니다.\n\n짧은 대화:\nA: The train workers are on strike tomorrow. / 내일 철도 직원들이 파업한대.\nB: So much for that. We\u0027ll have to change our day trip. / 그건 물 건너갔네. 당일치기 여행 계획을 바꿔야겠다.\n\n이 예시에서는 앞서 정한 이동 계획이 어려워졌다는 뜻이지, 모든 여행이 영원히 불가능하다는 뜻은 아닙니다. 한 계획을 접고 다른 방법을 찾을 수도 있습니다. 또 so much for 뒤에 구체적인 명사를 붙여 무엇에 대한 기대가 깨졌는지 직접 밝힐 수도 있습니다. 학습할 때는 ‘앞에 기대가 있었고, 지금 그것을 무너뜨리는 일이 생겼다’는 두 장면을 연결해서 기억하시면 짧은 표현의 감정까지 잘 잡힙니다.\n\n기억 고리: 방금 생긴 일 때문에, 그전까지 기대하던 계획이나 주장은 이제 접어야겠다는 말입니다."},{"no":52,"en":"DON\u0027T TEMPT ME","ko":"나 흔들리게 하지 마","url":"https://www.youtube.com/shorts/99UYJAncbes","note":"DON\u0027T TEMPT ME\n→ 나 흔들리게 하지 마.\n→ 유쾌한 권유에는 “그러다 나 진짜 해 버린다?”\n\ntempt는 누군가에게 어떤 행동을 하고 싶은 마음이 들게 ‘유혹하다’라는 뜻입니다. 보통 이미 어느 정도 끌리는 대상이 있지만, 이유가 있어서 참고 있는 상황과 잘 맞습니다. Don\u0027t tempt me는 마음이 전혀 없으니 권하지 말라는 뜻보다, 권유를 계속 받으면 참던 마음이 무너질 수 있다는 반응입니다.\n\n다이어트 중인 사람이 디저트를 권유받거나, 일을 끝내야 하는 사람이 여행 사진을 보았을 때 사용할 수 있습니다. 한국어의 “자꾸 그러면 나 진짜 넘어가요”, “안 그래도 하고 싶은데 꼬시지 마세요”와 비슷합니다. 거절의 모양을 하고 있지만, 그 안에 욕구가 있다는 사실을 함께 드러냅니다.\n\n그래서 이 표현은 상대의 제안이 매력적이라는 간접적인 인정이 되기도 합니다. 케이크를 두고 “나 유혹하지 마”라고 하면, 맛없어서 싫다는 뜻은 아닙니다. 오히려 먹고 싶은 마음이 크기 때문에 거리를 두려는 것입니다. 상대가 그 느낌을 읽으면 장난스럽게 권유를 이어 갈 수도 있어서, 확실한 거절을 해야 하는 자리에서는 의미가 충분히 분명하지 않을 수 있습니다.\n\n비슷한 표현인 Don\u0027t pressure me는 압박을 주지 말라는 뜻입니다. 하고 싶은 마음이 없어도 압박은 받을 수 있습니다. Don\u0027t tempt me는 행동 자체의 매력이나 충동이 중심입니다. 또 Don\u0027t test me는 인내심이나 권한을 시험하지 말라는 경고에 가까워, 기본적으로 욕구를 자극하지 말라는 이 표현과는 다릅니다.\n\n짧은 대화:\nA: There\u0027s one more slice of chocolate cake. / 초콜릿 케이크 한 조각 더 있어.\nB: Don\u0027t tempt me. I\u0027ve already had two. / 나 흔들리게 하지 마. 벌써 두 조각 먹었단 말이야.\n\n문맥에 따라서는 장난이 아니라 위협적인 반응이 될 수도 있습니다. 상대가 “그럼 나를 내쫓아 봐”라고 도발했을 때 “그러다 진짜 그렇게 한다”는 뜻으로 쓸 수 있기 때문입니다. 이 경우 유혹받는 행동은 즐거운 선택이 아니라 화가 나서 하고 싶은 행동입니다. 공통점은 이미 가능한 충동이 있으며, 상대가 그것을 실행 쪽으로 밀고 있다는 점입니다.\n\n기억 고리: 마음이 없어서 거절하는 것이 아니라, 이미 끌리니 더 자극하지 말라는 말입니다."},{"no":53,"en":"THIS AIN\u0027T IT","ko":"이건 좀 아닌데","url":"https://www.youtube.com/shorts/psGlJ1mWDjs","note":"THIS AIN\u0027T IT\n→ 이건 좀 아닌데.\n\nain\u0027t는 매우 구어적인 부정형이며, 이 문장에서는 isn\u0027t에 해당합니다. this는 지금 눈앞에 있는 결과물이나 행동, 제안 등을 가리킵니다. it은 막연한 물건 하나라기보다 ‘우리가 찾던 것’, ‘맞는 선택’, ‘기대하던 수준’을 받는 것으로 이해하시면 됩니다. 따라서 “지금 이것은 바로 그 정답이 아니다”라는 평가가 됩니다.\n\n옷을 입어 봤는데 생각한 분위기가 아니거나, 누군가의 농담이 선을 넘었거나, 새로 만든 디자인이 의도와 어긋났을 때 쓸 수 있습니다. 한국어의 “이건 아니죠”, “이 방향은 아닌 것 같아요”, “이건 좀 별로네요”와 닮았습니다. 구체적인 문제를 분석하기 전에 결과 전체에 부정적인 반응을 표시하는 말입니다.\n\n기준이 문장에 직접 나오지 않는다는 점이 특징입니다. 아름다움, 적절함, 품질, 도덕성 등 무엇이 문제인지는 상황이 정합니다. 그래서 신발을 두고 쓰면 취향에 맞지 않는다는 뜻이지만, 차별적인 농담을 두고 쓰면 단순히 재미없다는 것보다 부적절하다는 비판이 될 수 있습니다. 항상 가벼운 취향 평가로만 해석하면 강도를 놓칠 수 있습니다.\n\n비슷한 표현인 This isn\u0027t it은 같은 기본 구조를 더 일반적인 형태로 말합니다. This ain\u0027t it은 더 캐주얼하고 단호한 회화 분위기가 납니다. That\u0027s not a thing은 개념이나 관행의 존재 자체를 부정하지만, This ain\u0027t it은 대상이 존재한다는 것을 전제로 그것이 맞거나 적절한 선택이 아니라고 평가합니다.\n\n짧은 대화:\nA: What do you think of this logo? / 이 로고 어떻게 생각해?\nB: This ain\u0027t it. It looks too much like a warning sign. / 이건 좀 아닌데. 너무 경고 표시 같아.\n\n이 대화에서는 뒤에 이유가 붙어 어떤 기준을 충족하지 못했는지 알 수 있습니다. 표현만 단독으로 말하면 강한 부정은 전달되지만 개선 방향은 전달되지 않습니다. 또한 ain\u0027t는 편한 구어와 여러 방언에서 쓰이는 형태이므로, 공식적인 문서나 격식 있는 피드백에서는 다른 표현이 더 잘 맞습니다. 중요한 것은 단어의 유행성보다, 눈앞의 결과와 기대한 ‘바로 그것’ 사이의 차이를 지적한다는 감각입니다.\n\n기억 고리: 지금 나온 이것은, 우리가 원하던 ‘바로 그거’가 아니라는 평가입니다."},{"no":54,"en":"THE SKY\u0027S THE LIMIT","ko":"한계란 없어","url":"https://www.youtube.com/shorts/ltjAx3Rz8D0","note":"THE SKY\u0027S THE LIMIT\n→ 얼마든지 더 크게 해낼 수 있어.\n\nsky는 ‘하늘’이고, limit는 ‘한계’입니다. 글자대로 보면 하늘이 한계라는 말입니다. 실제로 높이를 측정해서 특정한 지점까지 가능하다고 말하는 것이 아니라, 시야 끝까지 펼쳐진 하늘처럼 가능성의 범위를 크게 그리는 표현입니다. 사람의 능력이나 기회에 낮은 상한선을 두지 말라는 낙관적인 비유입니다.\n\n예를 들어 기본 기술을 잘 익힌 사람에게 앞으로 얼마나 성장할 수 있는지 말할 때 사용할 수 있습니다. 한국어의 “가능성은 무궁무진해요”, “앞으로 어디까지 갈지 몰라요”와 비슷합니다. 지금 당장 모든 것을 할 수 있다는 뜻보다, 앞으로 더 크게 발전할 여지가 있다는 기대가 중심입니다.\n\nlimit라는 단어가 있으니 제한을 강조하는 말처럼 보일 수 있지만, 이 표현에서는 그 제한을 상상하기 어려울 만큼 멀리 놓는 효과가 납니다. “네 한계는 이 정도야”라고 닫는 것이 아니라, “작게 생각하지 마”라고 범위를 열어 주는 것입니다. 한국어에서 “하늘 높은 줄 모르고 올라간다”라고 하며 매우 큰 성장이나 상승을 그리는 방식과도 일부 감각이 통합니다.\n\n비슷한 표현인 Anything is possible은 어떤 일이든 가능하다는 넓은 말입니다. The sky\u0027s the limit는 특히 성취의 규모나 성장의 높이에 상한을 두기 어렵다는 이미지가 강합니다. You can do it은 특정한 한 가지 일을 해낼 수 있다는 격려이고, 이 표현은 그 한 번의 성공을 넘어 더 넓은 가능성을 바라봅니다.\n\n짧은 대화:\nA: What can I do once I learn these programming basics? / 이 프로그래밍 기초를 배우면 뭘 할 수 있어?\nB: The sky\u0027s the limit. You can start building your own ideas. / 얼마든지 더 크게 해낼 수 있어. 네 아이디어를 직접 만들기 시작할 수 있지.\n\n이 말은 대개 격려나 기대를 나타내는 과장입니다. 실제 예산, 시간, 경험의 제약이 사라진다는 보장은 아닙니다. 그래서 구체적인 계획에서는 가능성을 열어 주는 말과 필요한 조건을 따지는 일을 함께 할 수 있습니다. 표현을 문자 그대로 무한한 성공의 약속으로 받아들이기보다, 현재 보이는 수준만으로 미래의 성취를 작게 제한하지 말라는 태도로 이해하시면 자연스럽습니다.\n\n기억 고리: 성취의 상한선을 가까운 천장 대신 멀리 열린 하늘에 두는 격려입니다."},{"no":55,"en":"THAT\u0027S MESSED UP","ko":"그건 너무한데","url":"https://www.youtube.com/shorts/1h8UTnGPGKs","note":"THAT\u0027S MESSED UP\n→ 그건 너무한데.\n→ 상태가 엉망일 때는 “그거 완전 엉망이네.”\n\nmess는 정리되지 않은 ‘엉망인 상태’나 ‘혼란’을 뜻합니다. mess up은 어떤 것을 망가뜨리거나 잘못되게 만드는 데 쓰입니다. messed up은 정상적으로 정돈되거나 제대로 작동해야 할 것이 흐트러진 상태를 나타냅니다. 물건과 일정뿐 아니라 사람의 행동이나 상황의 공정함에도 이 평가를 적용할 수 있습니다.\n\n누군가 열심히 일한 사람의 공로를 가로챘다는 이야기를 듣고 That\u0027s messed up이라고 하면, 단순히 일이 복잡하다는 뜻이 아닙니다. “그건 제대로 된 행동이 아니잖아”, “너무 부당하다”라는 도덕적 반응에 가깝습니다. 한국어의 “그건 진짜 너무하네요”, “그건 잘못됐죠”와 연결됩니다.\n\n반대로 화면이 깨지거나 파일 내용이 뒤섞인 상황에서는 문자 그대로 상태가 엉망이라는 뜻입니다. 따라서 늘 ‘나쁜 사람의 행동’에만 쓰는 표현은 아닙니다. that이 가리키는 것이 기술적인 상태인지, 인간관계의 사건인지에 따라 고장, 혼란, 부당함, 충격 가운데 무엇을 강조하는지가 달라집니다.\n\n비슷한 표현인 That\u0027s messy는 정리되지 않았거나 복잡하다는 뜻입니다. That\u0027s messed up은 단순한 어수선함을 넘어 뭔가 잘못되었거나 심하게 뒤틀렸다는 평가가 강해질 수 있습니다. That\u0027s unfair는 공평하지 않다는 점을 구체적으로 말하고, That\u0027s messed up은 불공정함뿐 아니라 잔인함이나 납득하기 어려운 행동에도 더 넓게 사용할 수 있습니다.\n\n짧은 대화:\nA: They used her idea and didn\u0027t even mention her name. / 걔 아이디어를 써 놓고 이름도 언급 안 했대.\nB: That\u0027s messed up. She deserves credit. / 그건 너무한데. 걔 공로를 인정해 줘야지.\n\n이 대화에서 말하는 사람은 피해를 당한 사람의 감정을 받아 주면서 상황을 부정적으로 평가합니다. 원인을 세밀하게 분석하기보다 먼저 “그건 정상적이지 않다”는 반응을 보이는 것입니다. 구어적인 표현이라 친구 사이에서는 자연스럽지만, 공식적인 문제 제기에서는 무엇이 어떻게 잘못됐는지 더 구체적으로 말하는 편이 명확합니다. 또한 사람 자체를 messed up이라고 부르면 행동 하나보다 훨씬 넓고 거친 평가가 되므로 구분하시면 좋습니다.\n\n기억 고리: 원래 제대로 되어 있어야 할 상태나 행동이, 납득하기 어렵게 뒤틀렸다는 반응입니다."},{"no":56,"en":"WHAT DO THEY HAVE ON YOU?","ko":"그 사람들이 네 약점이라도 잡고 있어?","url":"https://www.youtube.com/shorts/OMKfZUVWkGk","note":"WHAT DO THEY HAVE ON YOU?\n→ 그 사람들이 네 약점이라도 잡고 있어?\n\nhave는 ‘가지고 있다’이고, on you는 여기서 상대에 관한 불리한 정보가 확보되어 있다는 구조의 일부입니다. have something on someone은 그 사람을 곤란하게 하거나 압박하는 데 쓸 수 있는 정보나 증거를 가지고 있다는 뜻입니다. 단순히 누군가에 대해 아는 것이 많다는 중립적인 정보 보유와는 다릅니다.\n\nWhat do they have on you?는 “그 사람들이 너를 압박할 만한 무슨 정보를 가지고 있길래 그래?”라는 질문입니다. 상대가 평소라면 하지 않을 부탁을 계속 들어주거나, 누군가의 요구에 지나치게 순종할 때 사용할 수 있습니다. 한국어의 “무슨 약점 잡혔어요?”, “대체 뭘 쥐고 흔들길래 그래요?”와 같은 감각입니다.\n\n약점은 실제 범죄 증거일 수도 있지만, 민망한 비밀이나 공개되면 곤란한 사정일 수도 있습니다. 반드시 법적인 잘못이 있어야 하는 것은 아닙니다. 핵심은 그 정보를 가진 사람이 상대의 행동에 영향력을 행사할 수 있다는 점입니다. 실제로 협박이 진행되고 있는지는 문장만으로 확정되지 않습니다.\n\n비슷한 표현인 What do they know about you?는 그들이 상대에 대해 무엇을 아는지 중립적으로 묻습니다. What do they have on you?는 그 정보가 불리하게 사용될 수 있다는 전제를 강하게 깝니다. Why are you doing this for them?은 행동의 이유를 넓게 묻지만, 이 표현은 그 이유가 약점이나 압박 때문일 수 있다는 의심을 제시합니다.\n\n짧은 대화:\nA: You\u0027re covering his shift again? That\u0027s the fourth time. / 또 걔 대신 근무해? 벌써 네 번째잖아.\nB: He asked me to. / 부탁하길래.\nA: What do they have on you? / 무슨 약점이라도 잡혔어?\n\n이 대화에서는 실제 협박을 확인했다기보다, 지나치게 부탁을 들어주는 모습을 놀라워하며 과장해서 묻는 말일 수 있습니다. 웃으며 하면 “왜 그렇게까지 해 주는데?”라는 농담이 됩니다. 반면 진지한 목소리라면 숨겨진 압박이나 통제를 걱정하는 질문이 됩니다. 영어의 on을 언제나 ‘위에’라고 번역하기보다, 이 동사 구조 전체가 ‘누구에게 불리하게 쓸 수 있는 것을 확보하다’라는 뜻이라는 점을 익히시면 좋습니다.\n\n기억 고리: 그들이 가진 정보가 너를 움직이게 할 만큼 불리한 카드가 되느냐고 묻는 말입니다."},{"no":57,"en":"YOU REALIZE THAT, RIGHT?","ko":"그건 알고 있는 거지?","url":"https://www.youtube.com/shorts/JfV_U_8MbbY","note":"YOU REALIZE THAT, RIGHT?\n→ 그건 알고 있는 거지?\n\nrealize는 어떤 사실을 ‘깨닫다’, ‘분명히 인식하다’라는 뜻입니다. know가 정보를 알고 있다는 상태를 넓게 나타낸다면, realize는 어떤 사실의 의미가 머릿속에 실제로 들어와 있다는 느낌을 줄 수 있습니다. You realize that은 “너도 그 사실을 인식하고 있다”라는 구조이고, right?가 붙어 상대의 확인을 요구합니다.\n\nthat은 보통 바로 앞에서 언급한 사실이나 결과를 가리킵니다. “지금 출발하면 막차를 못 탈 수도 있어. 그건 알고 있는 거지?”처럼, 상대가 선택의 의미를 충분히 이해했는지 점검하는 것입니다. 한국어의 “그게 무슨 뜻인지는 알고 있죠?”, “그 점은 알고 하는 말이죠?”와 연결됩니다.\n\n이 표현은 새로운 정보를 처음 전달하는 것과 조금 다릅니다. 화자는 대개 상대가 이미 알아야 하거나 쉽게 알 수 있는 사실이라고 생각합니다. 그런데 상대의 행동을 보니 제대로 고려하지 않는 것 같아서 확인합니다. 그래서 걱정과 주의 환기가 될 수도 있지만, “이 정도도 몰라?”라는 꾸지람처럼 들릴 여지도 있습니다.\n\n비슷한 표현인 Do you know that?은 사실을 알고 있는지 보다 직접적으로 묻습니다. You realize that, right?는 상대가 당연히 이해하고 있을 것이라는 기대를 깔고 확인하는 느낌이 강합니다. You understand, right?는 설명이나 요청의 이해를 넓게 확인할 수 있고, realize는 어떤 현실이나 행동의 함의를 자각하고 있는지 점검할 때 특히 잘 맞습니다.\n\n짧은 대화:\nA: I\u0027m going to stay up all night to finish this. / 이거 끝내려고 밤샐 거야.\nB: Your interview is at eight. You realize that, right? / 면접 8시잖아. 그건 알고 있는 거지?\n\n여기서 상대는 면접 시간을 문자 그대로 잊었을 수도 있지만, 알고도 수면 부족의 영향을 충분히 생각하지 않았을 수도 있습니다. 질문은 단순한 암기 여부보다 그 사실을 결정에 반영했는지까지 건드립니다. right? 때문에 언제나 다정한 확인이 되는 것은 아닙니다. 말끝을 강하게 내리거나 특정 단어를 강조하면 당연한 사실을 일깨우는 압박이 커집니다. 친절한 주의와 답답한 추궁 사이의 차이는 문맥과 억양에서 생깁니다.\n\n기억 고리: 사실을 들어 본 적이 있느냐보다, 그 사실의 의미를 알고 지금 행동하고 있느냐는 확인입니다."},{"no":58,"en":"YOU CAUGHT ME OFF GUARD","ko":"너 때문에 허 찔렸어","url":"https://www.youtube.com/shorts/ijqxDY5H1VM","note":"YOU CAUGHT ME OFF GUARD\n→ 갑작스러워서 순간 당황했어.\n\ncatch는 ‘잡다’이고, guard는 ‘경계’나 ‘방어’를 뜻합니다. on guard는 경계하고 대비하는 상태이고, off guard는 그런 대비가 풀린 상태입니다. You caught me off guard는 상대가 자신이 준비하지 못한 순간을 function paramNos() {

function allPool() {
  var pool = state.nos.slice();
  if (!pool.length) pool = scheduleUpTo(kstToday());
  (DATA.priorNos || []).forEach(function (n) { if (pool.indexOf(n) < 0) pool.push(n); });
  return pool.filter(function (n) { return byNo[n]; }).sort(function (a, b) { return a - b; });
}

function pickAll() {
  // 누적: 최근에 틀린 것 먼저, 잘 아는 것은 가끔만. 최대 20장.
  var pool = allPool();
  var scored = pool.map(function (n) {
    var s = state.seen[n];
    var weight = s ? (s.g === 0 ? 3 : s.g === 1 ? 2 : 0.6) : 2.5;
    return { no: n, w: weight * (0.6 + Math.random()) };
  });
  scored.sort(function (a, b) { return b.w - a.w; });
  return scored.slice(0, 20).map(function (x) { return x.no; });
}

// 아침 카톡의 "📖 설명" 링크는 ?open=1 로 온다 — 바로 뜻과 설명을 펼쳐 준다.
var openFirst = /[?&#]open=1/.test(location.search + location.hash);

function startSession(nos) {
  queue = nos.filter(function (n) { return byNo[n]; });
  idx = 0;
  flipped = openFirst;
  openFirst = false;          // 첫 카드에만 적용한다
  tally = { 0: 0, 1: 0, 2: 0 };
  again = [];
  render();
}

function currentDir() {
  if (dir !== 'mix') return dir;
  return (idx % 2 === 0) ? 'ko2en' : 'en2ko';
}

function render() {
  var stage = document.getElementById('stage');
  var prog = document.getElementById('prog');
  var count = document.getElementById('count');
  var note = document.getElementById('footNote');

  note.textContent = scope === 'week'
    ? '이번 주 ' + queue.length + '문장'
    : '누적 ' + allPool().length + '문장 중 ' + queue.length + '장';

  if (!queue.length) {
    count.textContent = '';
    prog.style.width = '0';
    stage.innerHTML = '<div class="empty">아직 복습할 카드가 없습니다.<br>평일 아침 문장을 받은 뒤 토요일에 열어 보세요.</div>';
    return;
  }

  if (idx >= queue.length) {
    prog.style.width = '100%';
    count.textContent = queue.length + ' / ' + queue.length;
    var retry = again.length ? '<button class="btn" id="retry">헷갈린 ' + again.length + '장 다시</button>' : '';
    stage.innerHTML =
      '<div class="done"><h2>한 바퀴 끝</h2><p>' +
      (again.length ? '모름·애매로 표시한 것만 다시 볼까요?' : '전부 알고 계시네요.') + '</p>' +
      '<div class="tally">' +
      '<div style="color:var(--no)"><b class="mono">' + tally[0] + '</b>모름</div>' +
      '<div style="color:var(--mid)"><b class="mono">' + tally[1] + '</b>애매</div>' +
      '<div style="color:var(--ok)"><b class="mono">' + tally[2] + '</b>알아</div></div>' +
      retry + '<button class="btn ghost" id="restart">처음부터</button></div>';
    var r = document.getElementById('retry');
    if (r) r.onclick = function () { startSession(again.slice()); };
    document.getElementById('restart').onclick = function () { startSession(queue.slice()); };
    return;
  }

  var card = byNo[queue[idx]];
  var d = currentDir();
  var frontTxt = d === 'ko2en' ? card.ko : card.en;
  var backTxt = d === 'ko2en' ? card.en : card.ko;
  var frontLabel = d === 'ko2en' ? '한글' : 'English';
  var backLabel = d === 'ko2en' ? 'English' : '한글';

  count.textContent = (idx + 1) + ' / ' + queue.length;
  prog.style.width = Math.round((idx / queue.length) * 100) + '%';

  stage.innerHTML =
    '<div class="card" id="card">' +
    '<div class="stamp mono"><span>' + frontLabel + '</span><b>#' + String(card.no).padStart(3, '0') + '</b></div>' +
    '<div class="face"><div class="line' + (d === 'en2ko' ? ' en' : '') + '">' + esc(frontTxt) + '</div>' +
    (flipped ? '' : '<div class="prompt">먼저 소리 내어 답해 보세요 · 탭하면 정답</div>') + '</div>' +
    (flipped
      ? '<div class="plate"><div class="lbl mono">' + backLabel + '</div><div class="txt">' + esc(backTxt) + '</div>' +
        (card.url ? '<div class="links"><a href="' + card.url + '" target="_blank" rel="noopener">쇼츠로 확인하기</a></div>' : '') + '</div>'
      : '') +
    '</div>' +
    (flipped && card.note ? detailHtml(card.note) : '') +
    '<div class="grade' + (flipped ? ' on' : '') + '">' +
    '<button class="g0" data-g="0">모름</button>' +
    '<button class="g1" data-g="1">애매</button>' +
    '<button class="g2" data-g="2">알아</button></div>';

  document.getElementById('card').onclick = function () {
    if (!flipped) { flipped = true; render(); }
  };
  Array.prototype.forEach.call(document.querySelectorAll('.grade button'), function (b) {
    b.onclick = function () { grade(+b.dataset.g); };
  });
}

function grade(g) {
  var no = queue[idx];
  tally[g]++;
  if (g < 2 && again.indexOf(no) < 0) again.push(no);
  state.seen[no] = { g: g, at: kstToday().toISOString().slice(0, 10) };
  saveState(state);
  idx++; flipped = false;
  render();
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
  });
}

// 상세 설명 — 원문 줄바꿈을 그대로 살리고, "→" 로 시작하는 줄만 강조한다.
// (마크다운 파서를 넣지 않는다. 설명 형식이 사람마다 달라 깨지기 쉽다)
function detailHtml(text) {
  var lines = String(text).split('\n');
  // 첫 줄은 영어 문장 자체라 카드 앞면과 겹친다 — 뺀다
  if (lines.length && lines[0].trim()) { lines = lines.slice(1); }
  // 빈 줄 기준으로 덩어리를 나눈다
  var blocks = [], cur = [];
  lines.forEach(function (l) {
    if (l.trim()) { cur.push(l.trim()); }
    else if (cur.length) { blocks.push(cur); cur = []; }
  });
  if (cur.length) { blocks.push(cur); }

  // "예를 들어," 처럼 다음 문장으로 이어지는 짧은 도입부는 뒤 덩어리에 붙인다
  var merged = [];
  blocks.forEach(function (b) {
    var prev = merged[merged.length - 1];
    if (prev && prev.length === 1 && prev[0].length < 24 && /[,，]$/.test(prev[0]) &&
        !isEnglishLine(prev[0]) && !isEnglishLine(b[0])) {
      prev.push.apply(prev, b);
      return;
    }
    merged.push(b.slice());
  });
  blocks = merged;

  var html = '';
  var first = true;
  blocks.forEach(function (b) {
    // 핵심 한 줄 — 아침 카톡에 나가는 그 문장
    if (b.length === 1 && /^(핵심|기억 고리|한 줄 요약|요약)\s*[:：]/.test(b[0])) {
      html += '<p class="key"><span>' + rich(b[0].replace(/^[^:：]*[:：]\s*/, '')) + '</span></p>';
      return;
    }
    // "짧은 대화:" 같은 꼬리표
    if (b.length === 1 && /[:：]\s*$/.test(b[0]) && b[0].length <= 20) {
      var icon = /대화|예시|예문/.test(b[0]) ? '💬' : '▸';
      html += '<div class="label">' + icon + ' ' + esc(b[0].replace(/[:：]\s*$/, '')) + '</div>';
      return;
    }
    // A: / B: 로 시작하는 대화 (영어 / 한국어 가 슬래시로 붙어 오는 경우가 많다)
    if (b.every(function (l) { return /^[A-Za-z가-힣]{1,3}\s*[:：]\s*\S/.test(l); })) {
      html += b.map(function (l) {
        var m = l.match(/^([A-Za-z가-힣]{1,3})\s*[:：]\s*(.+)$/);
        var rest = m[2];
        var parts = rest.split(/\s+\/\s+/);
        var en = parts[0], ko = parts.length > 1 ? parts.slice(1).join(' / ') : '';
        return '<div class="dlg"><span class="who">' + esc(m[1]) + '</span>' +
               '<span class="en">' + esc(en) + '</span>' +
               (ko ? '<span class="ko">' + esc(ko) + '</span>' : '') + '</div>';
      }).join('');
      return;
    }
    // 화살표 줄만 모인 덩어리
    if (b.every(function (l) { return l.indexOf('→') === 0; })) {
      html += '<div class="arrows">' + b.map(function (l) {
        return '<p class="arrow">' + esc(l) + '</p>';
      }).join('') + '</div>';
      return;
    }
    // 번호 붙은 절 제목
    if (/^\d+[.)]\s+/.test(b[0])) {
      html += '<h4>' + esc(b[0]) + '</h4>';
      b = b.slice(1);
      if (!b.length) { return; }
    }
    // 영어 문장만 홀로 있는 덩어리 (You can count on me. 같은 인용)
    if (b.length === 1 && isEnglishLine(b[0])) {
      html += '<div class="ex"><span class="en">' + esc(b[0]) + '</span></div>';
      return;
    }
    // 영어 예시 + 해석이 번갈아 오는 덩어리 (대화 예시)
    if (b.length >= 2 && isEnglishLine(b[0]) && !isEnglishLine(b[1])) {
      for (var i = 0; i + 1 < b.length; i += 2) {
        html += '<div class="ex"><span class="en">' + esc(b[i]) + '</span>' +
                '<span class="ko">' + esc(b[i + 1]) + '</span></div>';
      }
      if (b.length % 2) { html += '<p>' + esc(b[b.length - 1]) + '</p>'; }
      return;
    }
    // 그 밖에는 문단으로 다시 흘린다 (원문 줄바꿈은 채팅창 폭 기준이라 버린다)
    var cls = first ? ' class="lead"' : '';
    var para = [];
    b.forEach(function (l) {
      if (l.indexOf('→') === 0) {
        if (para.length) { html += '<p' + cls + '>' + rich(para.join(' ')) + '</p>'; para = []; cls = ''; }
        html += '<p class="arrow">' + rich(l) + '</p>';
      }
      else if (isEnglishLine(l) && b.length > 1) {
        if (para.length) { html += '<p' + cls + '>' + rich(para.join(' ')) + '</p>'; para = []; cls = ''; }
        html += '<div class="ex"><span class="en">' + esc(l) + '</span></div>';
      }
      else { para.push(l); }
    });
    if (para.length) { html += '<p' + cls + '>' + rich(para.join(' ')) + '</p>'; }
    first = false;
  });

  var open = /[?&#]open=1/.test(location.search + location.hash) ? ' open' : '';
  return '<details class="detail"' + open + '><summary><span class="lbl-txt">📖 이 표현 자세히 보기</span></summary>' +
         '<div class="body">' + html + '</div></details>';
}

// 한국어 설명 안에 섞인 영어 표현과 따옴표로 묶인 뜻을 눈에 걸리게 만든다.
// 설명이 "한국어 문장 속 영어 단어" 구조라, 이 둘만 구분해도 훨씬 잘 읽힌다.
function rich(s) {
  // 태그를 넣기 전에 엔티티를 임시 기호로 바꿔 둔다 (영어 매칭이 &quot; 안의 quot 를 물지 않도록)
  var t = esc(s)
    .replace(/&quot;/g, '\u0001').replace(/&amp;/g, '\u0002')
    .replace(/&lt;/g, '\u0003').replace(/&gt;/g, '\u0004');

  // 1) 문장 속 영어 표현 — 굵게 + 다른 색 (태그는 여기서 처음 들어간다)
  t = t.replace(/[A-Za-z][A-Za-z\u2019'.\-]*(?:\s+[A-Za-z][A-Za-z\u2019'.\-]*){0,6}/g, function (m) {
    if (m.replace(/[^A-Za-z]/g, '').length < 2) { return m; }
    return '<b class="w">' + m + '</b>';
  });

  // 2) 따옴표로 묶인 한국어 뜻 — 밑줄 (임시 기호만 노리므로 위에서 넣은 태그는 건드리지 않는다)
  t = t.replace(/\u0001([^\u0001]{1,60})\u0001/g, '\u0001<u class="q">$1</u>\u0001');
  t = t.replace(/\u2018([^\u2019]{1,60})\u2019/g, '\u2018<u class="q">$1</u>\u2019');

  return t.replace(/\u0001/g, '&quot;').replace(/\u0002/g, '&amp;')
    .replace(/\u0003/g, '&lt;').replace(/\u0004/g, '&gt;');
}

// 한글보다 영문이 뚜렷이 많은 줄이면 예시 문장으로 본다
function isEnglishLine(s) {
  var latin = (s.match(/[A-Za-z]/g) || []).length;
  var hangul = (s.match(/[가-힣]/g) || []).length;
  return latin > 0 && latin >= hangul * 2;
}

// ── 조작 ────────────────────────────────────────────────────────────────────
document.getElementById('tabWeek').onclick = function () {
  scope = 'week';
  this.setAttribute('aria-selected', 'true');
  document.getElementById('tabAll').setAttribute('aria-selected', 'false');
  startSession(weekNos());
};
document.getElementById('tabAll').onclick = function () {
  scope = 'all';
  this.setAttribute('aria-selected', 'true');
  document.getElementById('tabWeek').setAttribute('aria-selected', 'false');
  startSession(pickAll());
};
Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (b) {
  b.onclick = function () {
    dir = b.dataset.dir;
    Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (x) {
      x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
    });
    try { localStorage.setItem('dbj-dir', dir); } catch (e) { }
    startSession(scope === 'week' ? weekNos() : pickAll());
  };
});
document.getElementById('reset').onclick = function (e) {
  e.preventDefault();
  if (!confirm('이 기기에 저장된 복습 기록을 모두 지웁니다.')) return;
  state = { seen: {}, nos: [] };
  saveState(state);
  startSession(weekNos());
};

try {
  var savedDir = localStorage.getItem('dbj-dir');
  if (savedDir) {
    dir = savedDir;
    Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (x) {
      x.setAttribute('aria-pressed', x.dataset.dir === dir ? 'true' : 'false');
    });
  }
} catch (e) { }

startSession(weekNos());
</script>
