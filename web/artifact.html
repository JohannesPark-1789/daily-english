ing it close는 시간이나 여유를 너무 적게 남긴 계획을 두고 결과 전에도 사용할 수 있습니다. That was a close call은 보통 이미 지나간 위험 회피를 평가합니다. It was a close decision은 어느 쪽을 택할지 판단이 어려웠다는 뜻일 수 있어, 위험을 가까스로 피했다는 의미와 항상 같지는 않습니다.\n\n짧은 대화:\nA: I almost sent the private notes to the whole team, but I checked the recipients first. / 개인 메모를 팀 전체에 보낼 뻔했는데 먼저 받는 사람을 확인했어.\nB: That was a close call. / 하마터면 큰일 날 뻔했네.\n\n이 대화에서는 실제로 메모가 유출된 것이 아니라 마지막 확인으로 피한 상황입니다. 그래서 나쁜 일이 벌어졌다는 보고로 읽으면 반대가 됩니다. 위험의 크기는 문맥이 정하므로, 사소한 실수에 과장해서 웃으며 사용할 수도 있습니다. 또한 call을 전화라고만 이해하면 긴밀한 통화를 했다는 엉뚱한 뜻이 됩니다. 이 덩어리가 가리키는 것은 가까운 통화가 아니라, 좋지 않은 결과 바로 옆을 지나 무사히 빠져나온 사건입니다.\n\n기억 고리: 실제로 큰일이 난 것은 아니지만, 아주 작은 차이 덕분에 그 결과를 피했다는 안도의 말입니다."},{"no":223,"en":"WHAT ARE YOU GETTING AT?","ko":"무슨 말을 하려는 거야?","url":"https://www.youtube.com/shorts/TIC7cc696UE","note":"WHAT ARE YOU GETTING AT?\n→ 무슨 말을 하려는 거야?\n\nget at은 어떤 지점에 ‘닿다’거나 무엇을 ‘뜻하다’라는 관용적인 쓰임이 있습니다. 말을 두고 What are you getting at?이라고 하면 상대가 돌려서 가리키는 핵심이나 숨은 의도가 무엇인지 묻습니다. 문장 하나하나의 뜻보다 그 말들이 향하는 실제 메시지를 알고 싶다는 질문입니다.\n\n한국어의 “그래서 하고 싶은 말이 뭐예요?”, “무슨 뜻으로 그런 얘기를 하죠?”와 비슷합니다. 상대가 직접 부탁하지 않고 주변 이야기만 하거나, 자신을 비판하는 듯한 암시를 던질 때 자연스럽습니다. 말을 통해 어느 지점에 도달하려는지 구체적으로 밝혀 달라는 감각입니다.\n\n질문은 중립적인 이해 요청일 수도 있지만, 실제로는 답답함이나 의심이 섞이기 쉽습니다. “나를 탓하려는 거야?”라는 느낌으로 들릴 수 있습니다. 그렇다고 반드시 상대가 악의를 숨겼다는 뜻은 아닙니다. 설명이 서툴러 요점이 잘 드러나지 않는 상황에서도 사용할 수 있습니다.\n\n비슷한 표현인 What do you mean?은 의미를 넓게 묻습니다. What are you getting at?은 특히 간접적으로 전달하는 요점을 분명히 하라는 느낌이 강합니다. Where are you going with this?는 대화가 어떤 결론이나 목적지로 가는지 묻는 표현으로 매우 가깝습니다. getting at은 지금 발언이 암시하는 핵심을, going with는 말의 전체 방향을 강조하기 좋은 차이가 있습니다.\n\n짧은 대화:\nA: Some people always arrive after everyone else has started working. / 어떤 사람들은 다들 일하기 시작한 뒤에야 오더라.\nB: What are you getting at? Are you talking about me? / 무슨 말을 하려는 거야? 내 얘기 하는 거야?\n\n이 대화에서는 일반적인 말처럼 표현했지만 특정인을 겨냥한 것인지 확인합니다. 상대가 실제로 다른 사람 이야기였다고 설명할 수도 있으므로, 질문 자체가 숨은 의도를 증명하는 것은 아닙니다. 차분하게 말하면 오해를 풀 기회를 만들고, 공격적으로 말하면 갈등을 키울 수 있습니다. get을 항상 ‘얻다’, at을 장소로만 옮기기보다, 말이 가리키고 닿으려는 지점이라는 덩어리의 의미를 잡으시면 자연스럽습니다.\n\n기억 고리: 주변 이야기는 들었으니, 그 말로 실제 겨냥하는 핵심을 이제 분명하게 밝혀 달라는 질문입니다."},{"no":224,"en":"LET\u0027S JUST CALL IT QUITS","ko":"우리 그냥 여기서 그만하자","url":"https://www.youtube.com/shorts/lL29v8H5-oc","note":"LET\u0027S JUST CALL IT QUITS\n→ 우리 그냥 여기서 그만하자.\n\ncall은 이름을 ‘부르다’ 외에 어떤 상태라고 ‘정하다’, ‘간주하다’라는 뜻으로도 쓰입니다. call it quits는 하던 일을 그만두거나 관계와 활동을 마무리하기로 정한다는 표현입니다. Let\u0027s just call it quits는 더 이어 가기보다 여기서 종료하자고 제안합니다.\n\n한국어의 “그냥 이쯤에서 접죠”, “여기까지 하고 끝내요”와 비슷합니다. 오래 게임을 했거나, 진전 없는 작업을 계속했거나, 더 이어 가기 어려운 관계를 두고 사용할 수 있습니다. it이 무엇인지에 따라 잠깐의 활동 종료도 되고 훨씬 중요한 결별이나 포기가 될 수도 있습니다.\n\njust는 복잡하게 더 따지지 말고 그만하자는 정리의 느낌을 더합니다. 반드시 모든 활동을 영원히 중단하는 선언은 아닙니다. 오늘의 연습만 마치고 내일 다시 할 수도 있습니다. 그러나 관계나 사업 전체를 가리키는 문맥에서는 더 최종적인 뜻이 될 수 있으므로 종료의 범위를 확인해야 합니다.\n\n비슷한 표현인 Let\u0027s take a break는 쉬었다가 다시 하려는 여지가 분명합니다. Let\u0027s call it quits는 현재의 활동을 끝내기로 하는 결정이 중심입니다. Let\u0027s call it a day는 오늘의 작업을 마무리하자는 뜻으로 시간 범위를 하루에 두기 좋습니다. Let\u0027s just leave it at that은 특히 대화나 설명을 지금 나온 수준에서 더 확장하지 말자는 의미가 강합니다.\n\n짧은 대화:\nA: We\u0027ve played six rounds, and we\u0027re both too tired to focus. / 여섯 판이나 했더니 둘 다 피곤해서 집중이 안 되네.\nB: Let\u0027s just call it quits. We can play again next weekend. / 우리 그냥 여기서 그만하자. 다음 주말에 또 하면 되지.\n\n이 대화에서는 게임 자체를 평생 그만두는 것이 아니라 오늘 함께하는 활동을 종료합니다. 실패를 인정하는 뜻일 수도 있지만, 충분히 했으니 끝내는 자연스러운 마무리도 가능합니다. 누군가가 계속 노력하고 싶은 상황에서는 포기를 강요하는 말처럼 들릴 수 있으므로, 서로 같은 종료 범위를 생각하는지 중요합니다. quits를 사람 여러 명의 직장 퇴사처럼 해석하기보다 call it quits 전체를 멈춤을 선언하는 덩어리로 익히시면 좋습니다.\n\n기억 고리: 잠깐 멈칫하는 것이 아니라, 지금 하는 일을 여기서 끝난 것으로 정하자는 제안입니다."},{"no":225,"en":"I\u0027M IN OVER MY HEAD","ko":"내가 감당하기엔 너무 벅차","url":"https://www.youtube.com/shorts/5dpbjBJFhio","note":"I\u0027M IN OVER MY HEAD\n→ 내가 감당하기엔 너무 벅차.\n\nhead는 ‘머리’이고, over my head는 내 머리보다 위에 있는 높이를 나타냅니다. 물속에 들어갔는데 깊이가 머리 위까지 차오른 장면을 떠올리면, 지금 상황이 자기 능력으로 버틸 수 있는 수준을 넘었다는 감각이 잡힙니다. I\u0027m in over my head는 맡거나 들어선 일이 예상보다 어려워 감당하기 힘들다는 표현입니다.\n\n한국어의 “내 능력 밖의 일을 맡았어요”, “혼자 처리하기에는 너무 깊이 들어왔어요”와 비슷합니다. 충분히 알지 못한 분야의 프로젝트를 맡았거나 책임과 작업량이 크게 늘었을 때 자연스럽습니다. 단순히 지금 피곤하다는 말보다 상황의 요구와 자신의 준비 사이에 큰 차이가 있다는 뜻입니다.\n\nin은 이미 그 상황 안에 들어와 있다는 느낌을 줍니다. 처음부터 참여하지 않겠다는 평가보다, 들어가 보니 감당 수준을 넘었다는 고백에 잘 맞습니다. 그렇다고 반드시 완전히 실패했다는 뜻은 아닙니다. 도움을 받거나 범위를 조정하면 계속해 나갈 수도 있습니다.\n\n비슷한 표현인 This is over my head는 설명이나 내용이 자신의 이해 수준을 넘는다는 뜻으로 자주 쓰입니다. I\u0027m in over my head는 이해뿐 아니라 맡은 책임이나 실제 상황 전체가 벅차다는 느낌이 강합니다. I\u0027m not cut out for this는 자신의 적성이나 성향이 맞지 않는다고 평가합니다. in over my head는 경험과 지원이 부족한 현재 상황의 문제일 수도 있어 평생의 적성을 단정하지 않습니다.\n\n짧은 대화:\nA: How\u0027s managing the entire event by yourself? / 행사 전체를 혼자 맡아 보니 어때?\nB: I\u0027m in over my head. I need someone to handle the budget. / 내가 감당하기엔 너무 벅차. 예산을 맡아 줄 사람이 필요해.\n\n이 대화에서는 필요한 지원을 구체적으로 말해 해결 방향을 열어 둡니다. 자신의 한계를 인정하는 것이 무조건 포기와 같은 것은 아닙니다. 오히려 문제를 더 키우기 전에 부담을 나누는 출발점이 될 수 있습니다. 표현을 문자 그대로 수영 이야기로만 읽지 않는 것이 중요하지만, 실제 물의 깊이를 설명하는 장면도 가능할 수 있습니다. 관용적인 용법에서는 머리보다 높은 물의 수준이 과제의 난도와 책임의 크기에 대응합니다.\n\n기억 고리: 들어와 보니 물이 머리 위까지 차오른 것처럼, 지금 요구되는 수준이 내가 혼자 버틸 범위를 넘었다는 말입니다."},{"no":226,"en":"WHERE HAVE YOU BEEN KEEPING YOURSELF?","ko":"그동안 어디 숨어 지냈어?","url":"https://www.youtube.com/shorts/MUcQDIew6G8","note":"WHERE HAVE YOU BEEN KEEPING YOURSELF?\n→ 그동안 어디 숨어 지냈어?\n\nkeep은 어떤 대상이나 상태를 ‘두다’, ‘유지하다’라는 뜻이 있습니다. keep yourself라는 조합을 이 질문에서 만나면, 상대가 자기 모습을 어디에 두고 지냈기에 한동안 보이지 않았느냐는 감각으로 이해할 수 있습니다. 실제로 은신처를 찾는 질문이라기보다 오랜만에 만난 사람의 근황을 묻는 표현입니다.\n\n한국어의 “그동안 어디 있었어요?”, “요즘 통 안 보이더니 어떻게 지냈어요?”와 비슷합니다. 친분이 있는 사람이 오랫동안 모습을 보이지 않았을 때 반갑거나 장난스럽게 말하기 좋습니다. 상대가 일부러 숨었다고 사실적으로 비난하는 것과는 다릅니다.\n\nhave been은 지난 기간을 현재의 만남과 연결합니다. 지금 어디에 있는지는 눈앞에서 알 수 있지만, 그동안 함께하지 못한 시간의 생활이 궁금한 것입니다. keeping yourself의 긴 표현 때문에 단순한 안부보다 약간 장난스럽거나 격식 있는 말투처럼 들릴 수도 있습니다.\n\n비슷한 표현인 Where have you been?은 그동안 어디 있었는지 묻고, 상황에 따라 늦은 사람을 추궁하는 말도 됩니다. Where have you been keeping yourself?는 오랜만에 보이는 사람에게 친근한 놀람을 표현하는 용법이 잘 맞습니다. What have you been up to?는 최근 어떤 활동을 했는지에 더 직접적으로 초점을 맞춥니다. 목록의 표현도 실제 대답은 장소보다 일이나 근황이 될 수 있습니다.\n\n짧은 대화:\nA: Where have you been keeping yourself? We haven\u0027t seen you at the club for months. / 그동안 어디 숨어 지냈어? 몇 달째 동호회에서 못 봤잖아.\nB: I\u0027ve been busy with evening classes, but I\u0027m back now. / 저녁 수업 때문에 바빴어. 이제 다시 나왔지.\n\n이 대화에서는 자세한 이동 기록보다 한동안 나오지 못한 사정을 들으면 충분합니다. 상대가 반드시 설명할 의무가 있다는 뜻은 아니며, 반가운 대화를 시작하는 방식입니다. 다만 매우 사적인 일을 겪은 사람에게 너무 캐묻는 말투로 하면 부담이 될 수 있습니다. 표현의 핵심은 실제 감금이나 숨김이 아니라, 함께 있는 자리에서 상대가 보이지 않았던 시간을 유쾌하게 짚는 데 있습니다. 친숙한 관계의 재회 장면을 떠올리시면 자연스럽습니다.\n\n기억 고리: 정말 숨은 장소를 찾는 것이 아니라, 한동안 안 보이던 네가 그 시간을 어떻게 보냈는지 반갑게 묻는 말입니다."},{"no":227,"en":"IT DOESN\u0027T RING A BELL","ko":"들어도 딱히 떠오르는 게 없어","url":"https://www.youtube.com/shorts/sjWpid620Hw","note":"IT DOESN\u0027T RING A BELL\n→ 들어도 딱히 떠오르는 게 없어.\n\nring은 종이 ‘울리다’라는 뜻이고, bell은 ‘종’입니다. ring a bell은 어떤 이름이나 정보가 기억 속에서 알아보는 신호를 울린다는 뜻으로 쓰입니다. It doesn\u0027t ring a bell은 방금 들은 내용이 그런 기억의 신호를 일으키지 않는다는 말입니다. 실제로 종소리가 나는지 검사하는 상황은 아닙니다.\n\n한국어의 “들어 본 기억이 없네요”, “딱히 생각나는 게 없어요”와 비슷합니다. 사람 이름이나 가게 이름, 예전 사건을 들었는데 익숙한 느낌이 나지 않을 때 자연스럽습니다. it은 방금 제시된 단서나 이름을 받습니다. 그 대상이 세상에 없다는 뜻이 아니라 자신의 기억과 연결되지 않는다는 뜻입니다.\n\n기억이 정확하지 않을 수 있다는 여지를 남깁니다. 실제로 예전에 들었지만 잊었을 수도 있습니다. 따라서 “절대로 들어 본 적 없다”는 강한 부정보다, 지금 기억을 떠올리는 반응이 없다고 말하는 편이 정확합니다. 추가적인 장소나 시기를 들으면 나중에 알아볼 수도 있습니다.\n\n비슷한 표현인 I\u0027ve never heard of it은 그 대상에 대해 들어 본 적이 없다고 더 직접적으로 말합니다. It doesn\u0027t ring a bell은 지금 익숙한 기억이 살아나지 않는다는 느낌입니다. I can\u0027t quite place it은 익숙하긴 한데 정체나 출처를 정확히 연결하지 못하는 뜻입니다. ring a bell의 부정은 그 익숙함의 신호 자체가 약하거나 없다는 점이 다릅니다.\n\n짧은 대화:\nA: Do you remember a restaurant called Blue Lantern? / 블루 랜턴이라는 식당 기억나?\nB: It doesn\u0027t ring a bell. Where was it? / 들어도 딱히 떠오르는 게 없어. 어디 있었는데?\n\n이 대화에서는 이름만으로 기억이 연결되지 않아 위치라는 추가 단서를 요청합니다. 상대가 거짓말한다고 의심하거나 식당이 없었다고 주장하는 것은 아닙니다. 또 문맥에 따라 한때 배운 개념이나 노래 제목에도 사용할 수 있습니다. 표현을 이해할 때 특정한 심리 실험이 실제 어원이라고 임의로 연결할 필요는 없습니다. 종소리가 주의를 깨우듯 어떤 정보가 기억을 깨우는 이미지만으로도 기본 감각이 충분히 잡힙니다.\n\n기억 고리: 방금 단서가 기억 속 종을 울려야 할 것 같은데, 지금은 아무 익숙한 신호도 나지 않는다는 말입니다."},{"no":228,"en":"YOU HAVEN\u0027T LOST YOUR TOUCH","ko":"너 실력 여전하네","url":"https://www.youtube.com/shorts/zKfl_HGiV-c","note":"YOU HAVEN\u0027T LOST YOUR TOUCH\n→ 너 실력 여전하네.\n\ntouch는 ‘손길’, ‘감촉’을 뜻하고, 어떤 일을 다루는 섬세한 솜씨나 감각을 나타낼 수도 있습니다. lose your touch는 예전처럼 잘하던 감각을 잃는다는 뜻입니다. You haven\u0027t lost your touch는 그 감각이 지금도 남아 있어 여전히 잘한다는 칭찬입니다.\n\n한국어의 “아직 솜씨가 살아 있네요”, “역시 감각이 그대로예요”와 비슷합니다. 오랫동안 쉬었다가 요리를 했는데 맛이 좋거나, 예전에 잘하던 악기를 다시 연주했는데 능숙할 때 자연스럽습니다. 단순히 오늘 잘했다는 말에 과거와 현재의 연속성이 더해집니다.\n\n현재완료 haven\u0027t lost는 예전부터 지금까지 솜씨가 사라지지 않았다는 결과를 말합니다. 반드시 실제로 한동안 실력이 떨어졌다고 의심했어야만 하는 것은 아닙니다. 시간이나 공백이 있었는데도 여전하다는 반가운 확인으로 충분합니다. touch가 있으니 손을 쓰는 기술에만 해당한다고 좁힐 필요도 없습니다.\n\n비슷한 표현인 You\u0027re good at this는 현재 잘한다는 평가입니다. You haven\u0027t lost your touch는 과거에 잘했던 능력이 이어진다는 점을 강조합니다. You\u0027ve improved는 전보다 더 좋아졌다는 뜻이고, 목록의 표현은 최소한 예전의 좋은 감각을 유지한다는 칭찬입니다. You haven\u0027t lost touch는 연락이 끊기지 않았다는 뜻으로 쓰일 수 있어 your의 유무와 구조를 주의해야 합니다.\n\n짧은 대화:\nA: I haven\u0027t made this soup in years. I hope it\u0027s okay. / 이 수프는 몇 년 만에 만드는 거야. 괜찮으려나.\nB: You haven\u0027t lost your touch. It tastes just like I remember. / 너 실력 여전하네. 기억하던 맛 그대로야.\n\n이 대화에서는 긴 공백에도 솜씨가 남아 있다는 점을 칭찬합니다. 상대가 예전과 비교되는 것을 싫어하는 상황이 아니라면 따뜻한 격려가 되기 좋습니다. 영업이나 대화처럼 사람을 편하게 만드는 능력에도 쓸 수 있으므로, 손가락의 촉각이 정상이라는 의학적인 말로 받아들이지 않는 것이 중요합니다. 기본 이미지는 어떤 일을 다룰 때 필요한 특별한 손맛이나 조절 감각이 아직 사라지지 않았다는 것입니다.\n\n기억 고리: 시간이 지나도 예전에 일을 잘 다루던 그 손맛과 감각이 아직 그대로 남아 있다는 칭찬입니다."},{"no":229,"en":"I\u0027M JUST NOT UP FOR IT","ko":"지금은 그럴 기분이 아니야","url":"https://www.youtube.com/shorts/i_azz1odI7g","note":"I\u0027M JUST NOT UP FOR IT\n→ 지금은 그럴 기분이 아니야.\n\nbe up for는 어떤 활동을 할 마음이나 준비, 에너지가 있는 상태를 나타냅니다. I\u0027m not up for it은 그 활동에 지금 기꺼이 나설 상태가 아니라는 뜻입니다. 단어를 위쪽으로 올라가는 방향으로만 옮기기보다, 몸과 마음이 그 행동을 향해 준비되어 있는지로 이해하시면 좋습니다.\n\n한국어의 “지금은 내키지 않아요”, “그럴 기운이 없어요”와 비슷합니다. 친구가 외출을 권했지만 피곤하거나, 평소 좋아하는 일이어도 오늘은 감정적으로 여유가 없을 때 사용할 수 있습니다. 그 활동을 영원히 싫어한다는 선언보다 현재의 의욕과 에너지에 초점이 있습니다.\n\njust는 이유를 너무 크게 만들지 않고 지금 상태를 있는 그대로 전하는 느낌을 줄 수 있습니다. “특별히 네가 싫어서가 아니라 그냥 지금은 그래”라는 완곡함이 생길 수 있습니다. 그러나 just가 있다고 반드시 아주 가벼운 이유라는 뜻은 아닙니다. 구체적인 사정을 자세히 밝히고 싶지 않을 때도 사용할 수 있습니다.\n\n비슷한 표현인 I can\u0027t do it은 능력이나 일정 때문에 할 수 없다는 뜻일 수 있습니다. I\u0027m not up for it은 마음이나 기운이 준비되지 않았다는 느낌이 더 강합니다. I\u0027m not cut out for it은 성향과 적성이 맞지 않는다는 장기적인 평가입니다. I\u0027m not up to it은 일을 감당할 능력이나 상태가 부족하다는 뜻으로 가까울 수 있지만, up for는 참여 의향에 특히 잘 연결됩니다.\n\n짧은 대화:\nA: Want to go out with everyone tonight? / 오늘 밤에 다 같이 나갈래?\nB: I\u0027m just not up for it. I need a quiet evening. / 지금은 그럴 기분이 아니야. 조용히 저녁을 보내고 싶어.\n\n이 대화에서는 친구들이나 모임을 나쁘게 평가하지 않고 자기 상태를 설명합니다. 다음에 참여할 가능성도 남아 있습니다. 그렇다고 다음 약속을 이미 한 것은 아니므로, 상대가 언제 괜찮은지 묻는다면 별도로 정할 수 있습니다. 표현의 핵심은 행동 자체의 가치보다 현재 자신이 그 행동에 쓸 수 있는 마음과 에너지입니다. 하고 싶은 일을 아는 것과 지금 그것을 할 준비가 된 것은 다르다는 점을 잡으시면 자연스럽습니다.\n\n기억 고리: 그 활동이 싫다기보다, 지금 내 몸과 마음이 그쪽으로 나설 상태가 아니라는 말입니다."},{"no":230,"en":"IT TAKES ONE TO KNOW ONE","ko":"너도 똑같으니까 알아보는 거지","url":"https://www.youtube.com/shorts/f2Fe6H6TJCE","note":"IT TAKES ONE TO KNOW ONE\n→ 너도 똑같으니까 알아보는 거지.\n\ntake는 어떤 일을 위해 무엇이 ‘필요하다’라는 뜻으로도 쓰입니다. one은 앞에서 언급한 부류의 사람 한 명을 대신합니다. It takes one to know one은 같은 부류여야 그 부류를 알아본다는 구조입니다. 보통 상대가 자신을 놀리거나 비난했을 때, 그 특징을 알아보는 너도 마찬가지라고 되받는 표현입니다.\n\n한국어의 “끼리끼리 알아본다더니”, “너도 그러니까 잘 아는 거겠지요”와 비슷합니다. 누군가 자신을 고집쟁이나 장난꾸러기라고 했을 때 사용할 수 있습니다. 상대의 비판을 논리적으로 자세히 반박하기보다, 그 말을 다시 상대에게 돌려주는 재치 있는 반응입니다.\n\none 두 개는 같은 유형을 가리키지만 실제 사람은 서로 다릅니다. 앞의 one은 알아보는 사람, 뒤의 one은 알아보이는 사람이라고 보면 구조가 명확해집니다. 숫자 하나를 알아내려면 하나가 필요하다는 산수 문장이 아닙니다. 바로 앞에서 어떤 특징을 말했는지 알아야 의미가 채워집니다.\n\n비슷한 표현인 You\u0027re one too는 너도 그 부류라고 직접 말합니다. It takes one to know one은 상대가 알아보았다는 사실을 이용해 같은 특징을 가지고 있다고 받아칩니다. Look who\u0027s talking도 남을 비판할 처지가 아닌 사람이 말한다고 지적하는 표현으로 가깝습니다. 다만 목록의 표현은 같은 부류의 인식이라는 구조를 빌린다는 차이가 있습니다.\n\n짧은 대화:\nA: You\u0027re such a troublemaker. / 너 진짜 장난꾸러기다.\nB: It takes one to know one. / 너도 똑같으니까 알아보는 거지.\n\n이 대화에서는 서로 웃으며 주고받는 장난이 될 수 있습니다. 반대로 진지한 잘못을 지적받은 자리에서 말하면 책임을 피하고 상대를 공격하는 반응처럼 들릴 수 있습니다. 또한 누군가의 특징을 정확히 알아본다고 그 사람도 반드시 같은 특징이 있다는 논리적 법칙은 아닙니다. 표현은 그런 일반화를 이용한 말싸움의 재치입니다. 칭찬에도 장난스럽게 적용할 수 있지만, 기본적으로 놀림이나 비판을 상대에게 돌려주는 용법이 두드러집니다.\n\n기억 고리: 네가 내 특징을 알아봤다는 사실을 이용해, 너도 같은 부류라고 재치 있게 되받는 말입니다."},{"no":231,"en":"I\u0027LL MAKE IT UP TO YOU","ko":"내가 꼭 보상할게","url":"https://www.youtube.com/shorts/bMlP0Efhp6s","note":"I\u0027LL MAKE IT UP TO YOU\n→ 내가 꼭 보상할게.\n\nmake up은 부족하거나 빠진 부분을 채우고 만회한다는 뜻으로 쓰일 수 있습니다. make it up to someone은 자신 때문에 상대가 겪은 실망이나 불편을 나중의 행동으로 보상한다는 표현입니다. I\u0027ll make it up to you는 미안함을 말로만 끝내지 않고 어떤 방식으로든 만회하겠다는 약속입니다.\n\n한국어의 “나중에 꼭 갚을게요”, “이번 일은 제가 만회할게요”와 비슷합니다. 약속을 취소하거나 생일을 잊거나 상대가 혼자 일을 하게 만든 뒤 사용할 수 있습니다. 반드시 금전적인 손해를 같은 액수로 지급한다는 뜻은 아닙니다. 시간을 내거나 도움을 주거나 특별히 배려하는 방법도 가능합니다.\n\nit은 방금 생긴 실망이나 부족함을 받습니다. to you는 그 보상이 상대에게 향한다는 방향입니다. 따라서 make it up을 이야기를 지어낸다는 뜻으로만 해석하면 큰 차이가 생깁니다. 이 문장에서는 거짓말을 만들어 상대에게 하겠다는 것이 아니라, 관계나 기대에 생긴 빈 부분을 다시 채우겠다는 뜻입니다.\n\n비슷한 표현인 I\u0027m sorry는 미안함을 표현합니다. I\u0027ll make it up to you는 그 뒤의 행동으로 보완하겠다는 약속이 더해집니다. I\u0027ll pay you back은 빌린 돈을 갚는 뜻으로 자주 쓰이지만, 문맥에 따라 복수의 뜻도 가능합니다. make it up to you는 보통 자신이 상대에게 준 아쉬움을 좋은 행동으로 만회하는 방향입니다.\n\n짧은 대화:\nA: I waited for an hour, and then you canceled. / 한 시간 기다렸는데 네가 취소했잖아.\nB: I\u0027m really sorry. I\u0027ll make it up to you. Dinner next time is on me. / 정말 미안해. 내가 꼭 보상할게. 다음 저녁은 내가 살게.\n\n이 대화에서는 미안함에 구체적인 만회의 방법을 붙입니다. 하지만 저녁을 사는 것만으로 상대의 실망이 자동으로 사라지는 것은 아니며, 상대가 무엇을 필요로 하는지 들을 수도 있습니다. 표현은 행동의 의지를 나타내지만 실제 보완은 이후에 이루어집니다. 반복해서 약속만 하면 신뢰가 낮아질 수 있는 이유입니다. make up의 여러 뜻을 따로 외울 때도 전체 구조와 뒤의 전치사를 함께 보면, 창작과 화해와 보상의 의미를 더 정확히 구분할 수 있습니다.\n\n기억 고리: 내가 만든 실망의 빈자리를, 나중에 네게 하는 실제 행동으로 다시 채우겠다는 약속입니다."},{"no":232,"en":"HOW ARE YOU HOLDING UP?","ko":"힘든데 잘 버티고 있어?","url":"https://www.youtube.com/shorts/MDCpRJ3bbvU","note":"HOW ARE YOU HOLDING UP?\n→ 힘든데 잘 버티고 있어?\n\nhold는 무언가를 ‘붙들다’, ‘지탱하다’라는 뜻이고, up은 무너지지 않고 유지되는 상태의 감각을 줄 수 있습니다. hold up은 부담이나 압력 아래에서도 기능과 상태를 유지한다는 뜻으로 쓰입니다. How are you holding up?는 상대가 힘든 상황 속에서 몸과 마음을 어떻게 버티고 있는지 묻는 안부입니다.\n\n한국어의 “많이 힘들 텐데 괜찮아요?”, “요즘 잘 견디고 있어요?”와 비슷합니다. 일이 몰린 시기, 큰 변화, 슬픈 사건을 겪은 사람에게 사용할 수 있습니다. 상대가 아무 어려움도 없을 것이라고 전제하는 안부보다, 현재의 부담을 알고 있다는 공감이 들어갑니다.\n\n현재 진행형은 그 어려움이 계속되는 동안 상대가 어떻게 지내는지 살펴봅니다. 이미 완전히 해결되었는지를 묻는 것이 아니라, 해결 전의 과정에서 상태가 어떤지 묻습니다. 그래서 “괜찮아지려면 아직 시간이 필요해”, “피곤하지만 도움을 받고 있어”처럼 복합적인 답이 자연스럽습니다.\n\n비슷한 표현인 How are you?는 전반적인 상태를 넓게 묻고 인사로도 자주 쓰입니다. How are you holding up?는 부담이나 어려움이 있다는 맥락을 더 분명하게 인정합니다. Are you okay?는 현재 괜찮은지 직접 확인할 수 있고, holding up은 시간이 흐르는 동안 계속 지탱해 온 상태를 살피는 느낌이 있습니다. Hold on은 잠시 기다리거나 버티라는 요청으로 기능이 다릅니다.\n\n짧은 대화:\nA: You\u0027ve been balancing the move and the new job. How are you holding up? / 이사랑 새 직장을 동시에 감당하고 있잖아. 힘든데 잘 버티고 있어?\nB: I\u0027m tired, but having help with the packing makes a difference. / 피곤하긴 한데 짐 싸는 걸 도와주는 사람이 있어서 좀 나아.\n\n이 대화에서는 상대의 상황을 알고 관심 있게 묻기 때문에 형식적인 인사보다 따뜻하게 들릴 수 있습니다. 꼭 심각한 위기만을 뜻하는 표현은 아니며, 긴 행사를 운영하는 동료에게도 쓸 수 있습니다. 다만 힘든 이야기를 자세히 할지는 상대가 정할 수 있습니다. 표현의 핵심은 무조건 강해지라고 명령하는 것이 아니라, 지금의 압력 아래에서 상태를 유지하는 일이 얼마나 어려운지 알아보려는 데 있습니다.\n\n기억 고리: 어려움이 없느냐고 묻기보다, 그 무게를 받으며 너 자신을 어떻게 지탱하고 있는지 살피는 질문입니다."},{"no":233,"en":"NOT THAT I KNOW OF","ko":"내가 아는 한은 아니야","url":"https://www.youtube.com/shorts/0OQP5ah3kJo","note":"NOT THAT I KNOW OF\n→ 내가 아는 한은 아니야.\n\nknow of는 어떤 사실이나 대상이 있다는 것을 ‘알고 있다’라는 뜻으로 쓰입니다. Not that I know of는 앞의 질문을 부정하면서, 그 부정이 자신의 지식 범위 안에서만 이루어진다는 한계를 표시합니다. 세상의 모든 정보를 확인한 뒤 절대 없다고 선언하는 것과는 다릅니다.\n\n한국어의 “제가 알기로는 없어요”, “들은 바로는 아니에요”와 비슷합니다. 일정이 바뀌었는지, 알려진 문제가 있는지, 누가 특정한 일을 했는지 물었을 때 사용할 수 있습니다. 현재 자신에게 그런 정보가 없다는 뜻이므로 나중에 새로운 사실이 나올 가능성은 남깁니다.\n\nthat I know of라는 부분은 부정의 범위를 조절합니다. 문장 앞의 not은 앞서 물은 내용을 받고, 뒤의 부분은 ‘내가 알고 있는 경우 중에서는’이라는 조건처럼 작용합니다. 단어만 읽어 ‘내가 그것을 안다는 게 아니다’라고 해석하면 자연스러운 응답의 기능을 놓칠 수 있습니다.\n\n비슷한 표현인 No는 더 직접적인 부정입니다. Not that I know of는 자신이 가진 정보의 한계를 명시합니다. I don\u0027t know는 판단 자체를 못 한다는 답일 수 있지만, 목록의 표현은 알려진 범위에서는 아니라고 잠정적으로 답합니다. As far as I know와 부정문을 함께 쓰면 비슷한 의미가 되지만, Not that I know of는 앞선 질문에 붙는 짧은 반응으로 특히 편리합니다.\n\n짧은 대화:\nA: Has the meeting time changed? / 회의 시간 바뀌었어?\nB: Not that I know of. I haven\u0027t seen any update. / 내가 아는 한은 아니야. 변경 공지는 못 봤어.\n\n이 대화에서는 변경이 절대로 없었다고 보장하지 않으면서 자신이 가진 정보를 전달합니다. 그래서 상대가 필요하면 공지를 추가로 확인할 수 있습니다. 그렇다고 화자가 아무 근거 없이 말을 피하는 것만 뜻하지는 않습니다. 현재 정보로는 답을 하되 확신의 범위를 정직하게 표시하는 유용한 방식입니다. 일상적인 정보 확인에서 특히 자연스럽고, 중요한 사안에서는 무엇을 확인했는지 덧붙이면 의미가 더 분명해집니다.\n\n기억 고리: 없다고 답하되, 그 답이 내가 지금까지 알고 있는 범위 안의 판단임을 함께 밝히는 말입니다."},{"no":234,"en":"IS THAT A THING?","ko":"실제로 그런 게 있어?","url":"https://www.youtube.com/shorts/aYvqAVr5PTU","note":"IS THAT A THING?\n→ 실제로 그런 게 있어?\n\nthing은 ‘것’이나 ‘물건’이지만, 회화에서는 사람들이 실제로 하는 관행, 하나의 현상, 통용되는 개념도 가리킬 수 있습니다. Is that a thing?은 방금 들은 행동이나 개념이 실제로 존재하거나 사람들이 인정하는 것인지 묻는 표현입니다. 눈에 보이는 물건만 확인하는 질문은 아닙니다.\n\n한국어의 “그런 것도 해요?”, “실제로 그런 문화가 있어요?”, “그게 진짜 있는 거예요?”와 비슷합니다. 낯선 기념일이나 특이한 취미, 처음 듣는 규칙을 접했을 때 자연스럽습니다. 단순히 단어의 뜻을 모르는 것보다 그 이름으로 묶이는 활동이나 현상이 실제로 성립하는지 궁금한 것입니다.\n\n놀람과 호기심으로 사용할 수도 있고, 터무니없어 보여 의심하는 반응이 될 수도 있습니다. 그렇다고 항상 존재를 비웃거나 부정하는 것은 아닙니다. 새로운 문화를 처음 접한 사람의 진지한 질문일 수 있습니다. 말투가 차가우면 상대의 경험을 가짜 취급하는 것처럼 들릴 수 있으므로 문맥이 중요합니다.\n\n비슷한 표현인 Does that exist?는 존재하는지 직접 묻습니다. Is that a thing?은 특히 통용되는 관행이나 개념이라는 느낌을 가질 수 있습니다. Is that true?는 방금 들은 주장이 사실인지 묻고, a thing은 그 주장에 나온 현상 자체가 알려진 것인지에 초점을 둡니다. That\u0027s not a thing은 그런 관행이 없다고 부정하는 반대 반응입니다.\n\n짧은 대화:\nA: Some cafés host silent reading parties where everyone brings a book. / 각자 책을 가져와 조용히 읽는 모임을 여는 카페도 있어.\nB: Is that a thing? That actually sounds nice. / 실제로 그런 게 있어? 듣고 보니 괜찮네.\n\n이 대화에서는 비꼼보다 처음 알게 된 활동에 대한 호기심을 드러냅니다. 상대가 실제 사례를 설명하면 의미가 더 분명해집니다. 또한 두 사람이 특별한 관계가 있는지를 가리키는 a thing의 쓰임도 있지만, 목록의 질문은 그 관계에만 한정되지 않습니다. thing을 물체로만 외우지 않고 사람들이 하나의 이름과 의미로 받아들이는 대상까지 넓혀 이해하면, 일상에서 처음 보는 현상을 물을 때 자연스럽게 사용할 수 있습니다.\n\n기억 고리: 눈앞의 물건이 있느냐보다, 방금 말한 행동이나 개념이 실제로 통용되는 하나의 현상이냐고 묻는 말입니다."},{"no":235,"en":"WHY WOULD WE DO THAT?","ko":"우리가 굳이 왜 그렇게 하겠어?","url":"https://www.youtube.com/shorts/6_F5yJ7hkeo","note":"WHY WOULD WE DO THAT?\n→ 우리가 굳이 왜 그렇게 하겠어?\n\ndo는 ‘하다’이고, that은 앞에서 나온 행동이나 제안을 가리킵니다. Why would we do that?은 우리가 그런 행동을 선택할 만한 이유가 무엇인지 묻는 표현입니다. 보통 그 선택의 이점이나 동기를 쉽게 찾을 수 없을 때 반응으로 쓰이며, 단순한 일정 확인과는 다릅니다.\n\nwould는 여기서 과거의 행동을 보고하는 말이 아닙니다. 그런 상황에서 우리가 그 선택을 한다고 가정했을 때 왜 하겠느냐는 질문입니다. 이미 하지 않은 제안을 검토하면서도, 누군가 우리가 그렇게 할 것이라고 추측했을 때도 사용할 수 있습니다. 한국어의 “우리한테 무슨 이득이 있다고 그래요?”, “왜 그런 선택을 하겠어요?”와 비슷합니다.\n\n기본적으로 회의적인 느낌이 있지만 언제나 비웃는 것은 아닙니다. 제안의 이유를 진심으로 알고 싶어 물을 수도 있습니다. 다만 would를 넣는다고 자동으로 공손해지는 것은 아닙니다. 억양에 따라 그럴 이유가 전혀 없다는 강한 반박이 될 수 있습니다.\n\n비슷한 표현인 Why did we do that?은 실제 과거에 한 행동의 이유를 돌아봅니다. Why are we doing that?은 진행 중인 행동이나 정해진 계획의 이유를 묻습니다. Why should we do that?은 해야 할 근거나 당위성을 더 직접적으로 요구할 수 있습니다. Why would we do that?은 그 행동을 택할 법한 동기나 타당성이 있느냐는 가정적인 관점이 두드러집니다.\n\n짧은 대화:\nA: Maybe we should print the entire manual for everyone. / 설명서를 전부 인쇄해서 한 명씩 줄까?\nB: Why would we do that? Everyone can use the searchable digital version. / 우리가 굳이 왜 그렇게 하겠어? 다들 검색되는 전자 문서를 쓸 수 있잖아.\n\n이 대화에서는 인쇄가 물리적으로 불가능하다는 뜻이 아니라, 더 편리한 대안이 있어 그 수고의 이유가 보이지 않는다는 뜻입니다. 상대가 전자 기기를 쓰기 어려운 참가자가 있다고 설명하면 새로운 근거가 생길 수 있습니다. 따라서 질문을 닫힌 비난으로만 쓰지 않고 답을 들으면 계획을 개선하는 데 도움이 됩니다. 핵심은 행동 자체를 모른다는 것이 아니라, 우리가 그 행동을 선택할 이유를 아직 납득하지 못했다는 데 있습니다.\n\n기억 고리: 그 행동을 할 수 있느냐가 아니라, 우리가 그렇게 선택할 만한 이유가 대체 무엇이냐고 묻는 말입니다."}]};

// ── 이번 주 카드 번호 정하기 ────────────────────────────────────────────────
// 1) URL 파라미터 ?w=11,12,13  2) 없으면 시작일·평일·제외번호로 역산
function paramNos() {
  // 구분자는 쉼표와 밑줄 둘 다 받는다 — 카톡 자동 링크가 쉼표에서 잘리는 경우가 있어서.
  var q = (location.search + location.hash).match(/[?&#]w=([0-9,_\-]+)/);
  if (!q) return null;
  var out = [];
  q[1].split(/[,_]/).forEach(function (part) {
    var m = part.match(/^(\d+)-(\d+)$/);
    if (m) { for (var i = +m[1]; i <= +m[2]; i++) out.push(i); }
    else if (part) out.push(+part);
  });
  return out.length ? out : null;
}

function kstToday() {
  var now = new Date();
  return new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (9 * 3600000));
}

// 발송 규칙대로 순서를 만든다: 시작 번호부터, 제외 번호는 건너뛰며 평일마다 하나씩
function scheduleUpTo(date) {
  var skip = {};
  DATA.skipNos.forEach(function (n) { skip[n] = 1; });
  var order = DATA.cards.map(function (c) { return c.no; }).filter(function (n) { return !skip[n]; });
  var d = new Date(DATA.startDate + 'T00:00:00Z'), sent = [], i = 0;
  while (d <= date && i < order.length) {
    var day = d.getUTCDay();
    if (day >= 1 && day <= 5) { sent.push(order[i]); i++; }
    d = new Date(d.getTime() + 86400000);
  }
  return sent;
}

function weekNos() {
  var p = paramNos();
  if (p) return p;
  return scheduleUpTo(kstToday()).slice(-5);
}

// ── 기록 (이 기기에만 저장) ─────────────────────────────────────────────────
var KEY = 'dbj-cards-v1';
function loadState() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { seen: {}, nos: [] }; }
  catch (e) { return { seen: {}, nos: [] }; }
}
function saveState(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { } }

var state = loadState();
var byNo = {};
DATA.cards.forEach(function (c) { byNo[c.no] = c; });

// 이번 주 번호를 누적 목록에 합쳐 둔다 (누적 연습용)
(function () {
  var w = weekNos(), changed = false;
  w.forEach(function (n) { if (state.nos.indexOf(n) < 0) { state.nos.push(n); changed = true; } });
  if (changed) { state.nos.sort(function (a, b) { return a - b; }); saveState(state); }
})();

// ── 세션 ────────────────────────────────────────────────────────────────────
var dir = 'ko2en', scope = 'week', queue = [], idx = 0, flipped = false;
var tally = { 0: 0, 1: 0, 2: 0 }, again = [];

// 누적 풀 = 이 도구로 받은 번호 + 이전에 이미 학습한 번호(priorNos).
// priorNos 는 발송에서는 제외되지만(skipNos) 복습 대상에는 들어간다.
function allPool() {
  var pool = state.nos.slice();
  if (!pool.length) pool = scheduleUpTo(kstToday());
  (DATA.priorNos || []).forEach(function (n) { if (pool.indexOf(n) < 0) pool.push(n); });
  return pool.filter(function (n) { return byNo[n]; }).sort(function (a, b) { return a - b; });
}

function pickAll() {
  // 누적: 최근에 틀린 것 먼저, 잘 아는 것은 가끔만. 최대 20장.
  var pool = allPool();
  var scored = pool.map(function (n) {
    var s = state.seen[n];
    var weight = s ? (s.g === 0 ? 3 : s.g === 1 ? 2 : 0.6) : 2.5;
    return { no: n, w: weight * (0.6 + Math.random()) };
  });
  scored.sort(function (a, b) { return b.w - a.w; });
  return scored.slice(0, 20).map(function (x) { return x.no; });
}

// 아침 카톡의 "📖 설명" 링크는 ?open=1 로 온다 — 바로 뜻과 설명을 펼쳐 준다.
var openFirst = /[?&#]open=1/.test(location.search + location.hash);

function startSession(nos) {
  queue = nos.filter(function (n) { return byNo[n]; });
  idx = 0;
  flipped = openFirst;
  openFirst = false;          // 첫 카드에만 적용한다
  tally = { 0: 0, 1: 0, 2: 0 };
  again = [];
  render();
}

function currentDir() {
  if (dir !== 'mix') return dir;
  return (idx % 2 === 0) ? 'ko2en' : 'en2ko';
}

function render() {
  var stage = document.getElementById('stage');
  var prog = document.getElementById('prog');
  var count = document.getElementById('count');
  var note = document.getElementById('footNote');

  note.textContent = scope === 'week'
    ? '이번 주 ' + queue.length + '문장'
    : '누적 ' + allPool().length + '문장 중 ' + queue.length + '장';

  if (!queue.length) {
    count.textContent = '';
    prog.style.width = '0';
    stage.innerHTML = '<div class="empty">아직 복습할 카드가 없습니다.<br>평일 아침 문장을 받은 뒤 토요일에 열어 보세요.</div>';
    return;
  }

  if (idx >= queue.length) {
    prog.style.width = '100%';
    count.textContent = queue.length + ' / ' + queue.length;
    var retry = again.length ? '<button class="btn" id="retry">헷갈린 ' + again.length + '장 다시</button>' : '';
    stage.innerHTML =
      '<div class="done"><h2>한 바퀴 끝</h2><p>' +
      (again.length ? '모름·애매로 표시한 것만 다시 볼까요?' : '전부 알고 계시네요.') + '</p>' +
      '<div class="tally">' +
      '<div style="color:var(--no)"><b class="mono">' + tally[0] + '</b>모름</div>' +
      '<div style="color:var(--mid)"><b class="mono">' + tally[1] + '</b>애매</div>' +
      '<div style="color:var(--ok)"><b class="mono">' + tally[2] + '</b>알아</div></div>' +
      retry + '<button class="btn ghost" id="restart">처음부터</button></div>';
    var r = document.getElementById('retry');
    if (r) r.onclick = function () { startSession(again.slice()); };
    document.getElementById('restart').onclick = function () { startSession(queue.slice()); };
    return;
  }

  var card = byNo[queue[idx]];
  var d = currentDir();
  var frontTxt = d === 'ko2en' ? card.ko : card.en;
  var backTxt = d === 'ko2en' ? card.en : card.ko;
  var frontLabel = d === 'ko2en' ? '한글' : 'English';
  var backLabel = d === 'ko2en' ? 'English' : '한글';

  count.textContent = (idx + 1) + ' / ' + queue.length;
  prog.style.width = Math.round((idx / queue.length) * 100) + '%';

  stage.innerHTML =
    '<div class="card" id="card">' +
    '<div class="stamp mono"><span>' + frontLabel + '</span><b>#' + String(card.no).padStart(3, '0') + '</b></div>' +
    '<div class="face"><div class="line' + (d === 'en2ko' ? ' en' : '') + '">' + esc(frontTxt) + '</div>' +
    (flipped ? '' : '<div class="prompt">먼저 소리 내어 답해 보세요 · 탭하면 정답</div>') + '</div>' +
    (flipped
      ? '<div class="plate"><div class="lbl mono">' + backLabel + '</div><div class="txt">' + esc(backTxt) + '</div>' +
        (card.url ? '<div class="links"><a href="' + card.url + '" target="_blank" rel="noopener">쇼츠로 확인하기</a></div>' : '') + '</div>'
      : '') +
    '</div>' +
    (flipped && card.note ? detailHtml(card.note) : '') +
    '<div class="grade' + (flipped ? ' on' : '') + '">' +
    '<button class="g0" data-g="0">모름</button>' +
    '<button class="g1" data-g="1">애매</button>' +
    '<button class="g2" data-g="2">알아</button></div>';

  document.getElementById('card').onclick = function () {
    if (!flipped) { flipped = true; render(); }
  };
  Array.prototype.forEach.call(document.querySelectorAll('.grade button'), function (b) {
    b.onclick = function () { grade(+b.dataset.g); };
  });
}

function grade(g) {
  var no = queue[idx];
  tally[g]++;
  if (g < 2 && again.indexOf(no) < 0) again.push(no);
  state.seen[no] = { g: g, at: kstToday().toISOString().slice(0, 10) };
  saveState(state);
  idx++; flipped = false;
  render();
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
  });
}

// 상세 설명 — 원문 줄바꿈을 그대로 살리고, "→" 로 시작하는 줄만 강조한다.
// (마크다운 파서를 넣지 않는다. 설명 형식이 사람마다 달라 깨지기 쉽다)
function detailHtml(text) {
  var lines = String(text).split('\n');
  // 첫 줄은 영어 문장 자체라 카드 앞면과 겹친다 — 뺀다
  if (lines.length && lines[0].trim()) { lines = lines.slice(1); }
  // 빈 줄 기준으로 덩어리를 나눈다
  var blocks = [], cur = [];
  lines.forEach(function (l) {
    if (l.trim()) { cur.push(l.trim()); }
    else if (cur.length) { blocks.push(cur); cur = []; }
  });
  if (cur.length) { blocks.push(cur); }

  // "예를 들어," 처럼 다음 문장으로 이어지는 짧은 도입부는 뒤 덩어리에 붙인다
  var merged = [];
  blocks.forEach(function (b) {
    var prev = merged[merged.length - 1];
    if (prev && prev.length === 1 && prev[0].length < 24 && /[,，]$/.test(prev[0]) &&
        !isEnglishLine(prev[0]) && !isEnglishLine(b[0])) {
      prev.push.apply(prev, b);
      return;
    }
    merged.push(b.slice());
  });
  blocks = merged;

  var html = '';
  var first = true;
  blocks.forEach(function (b) {
    // 핵심 한 줄 — 아침 카톡에 나가는 그 문장
    if (b.length === 1 && /^(핵심|기억 고리|한 줄 요약|요약)\s*[:：]/.test(b[0])) {
      html += '<p class="key"><span>' + rich(b[0].replace(/^[^:：]*[:：]\s*/, '')) + '</span></p>';
      return;
    }
    // "짧은 대화:" 같은 꼬리표
    if (b.length === 1 && /[:：]\s*$/.test(b[0]) && b[0].length <= 20) {
      var icon = /대화|예시|예문/.test(b[0]) ? '💬' : '▸';
      html += '<div class="label">' + icon + ' ' + esc(b[0].replace(/[:：]\s*$/, '')) + '</div>';
      return;
    }
    // A: / B: 로 시작하는 대화 (영어 / 한국어 가 슬래시로 붙어 오는 경우가 많다)
    if (b.every(function (l) { return /^[A-Za-z가-힣]{1,3}\s*[:：]\s*\S/.test(l); })) {
      html += b.map(function (l) {
        var m = l.match(/^([A-Za-z가-힣]{1,3})\s*[:：]\s*(.+)$/);
        var rest = m[2];
        var parts = rest.split(/\s+\/\s+/);
        var en = parts[0], ko = parts.length > 1 ? parts.slice(1).join(' / ') : '';
        return '<div class="dlg"><span class="who">' + esc(m[1]) + '</span>' +
               '<span class="en">' + esc(en) + '</span>' +
               (ko ? '<span class="ko">' + esc(ko) + '</span>' : '') + '</div>';
      }).join('');
      return;
    }
    // 화살표 줄만 모인 덩어리
    if (b.every(function (l) { return l.indexOf('→') === 0; })) {
      html += '<div class="arrows">' + b.map(function (l) {
        return '<p class="arrow">' + esc(l) + '</p>';
      }).join('') + '</div>';
      return;
    }
    // 번호 붙은 절 제목
    if (/^\d+[.)]\s+/.test(b[0])) {
      html += '<h4>' + esc(b[0]) + '</h4>';
      b = b.slice(1);
      if (!b.length) { return; }
    }
    // 영어 문장만 홀로 있는 덩어리 (You can count on me. 같은 인용)
    if (b.length === 1 && isEnglishLine(b[0])) {
      html += '<div class="ex"><span class="en">' + esc(b[0]) + '</span></div>';
      return;
    }
    // 영어 예시 + 해석이 번갈아 오는 덩어리 (대화 예시)
    if (b.length >= 2 && isEnglishLine(b[0]) && !isEnglishLine(b[1])) {
      for (var i = 0; i + 1 < b.length; i += 2) {
        html += '<div class="ex"><span class="en">' + esc(b[i]) + '</span>' +
                '<span class="ko">' + esc(b[i + 1]) + '</span></div>';
      }
      if (b.length % 2) { html += '<p>' + esc(b[b.length - 1]) + '</p>'; }
      return;
    }
    // 그 밖에는 문단으로 다시 흘린다 (원문 줄바꿈은 채팅창 폭 기준이라 버린다)
    var cls = first ? ' class="lead"' : '';
    var para = [];
    b.forEach(function (l) {
      if (l.indexOf('→') === 0) {
        if (para.length) { html += '<p' + cls + '>' + rich(para.join(' ')) + '</p>'; para = []; cls = ''; }
        html += '<p class="arrow">' + rich(l) + '</p>';
      }
      else if (isEnglishLine(l) && b.length > 1) {
        if (para.length) { html += '<p' + cls + '>' + rich(para.join(' ')) + '</p>'; para = []; cls = ''; }
        html += '<div class="ex"><span class="en">' + esc(l) + '</span></div>';
      }
      else { para.push(l); }
    });
    if (para.length) { html += '<p' + cls + '>' + rich(para.join(' ')) + '</p>'; }
    first = false;
  });

  var open = /[?&#]open=1/.test(location.search + location.hash) ? ' open' : '';
  return '<details class="detail"' + open + '><summary><span class="lbl-txt">📖 이 표현 자세히 보기</span></summary>' +
         '<div class="body">' + html + '</div></details>';
}

// 한국어 설명 안에 섞인 영어 표현과 따옴표로 묶인 뜻을 눈에 걸리게 만든다.
// 설명이 "한국어 문장 속 영어 단어" 구조라, 이 둘만 구분해도 훨씬 잘 읽힌다.
function rich(s) {
  // 태그를 넣기 전에 엔티티를 임시 기호로 바꿔 둔다 (영어 매칭이 &quot; 안의 quot 를 물지 않도록)
  var t = esc(s)
    .replace(/&quot;/g, '\u0001').replace(/&amp;/g, '\u0002')
    .replace(/&lt;/g, '\u0003').replace(/&gt;/g, '\u0004');

  // 1) 문장 속 영어 표현 — 굵게 + 다른 색 (태그는 여기서 처음 들어간다)
  t = t.replace(/[A-Za-z][A-Za-z\u2019'.\-]*(?:\s+[A-Za-z][A-Za-z\u2019'.\-]*){0,6}/g, function (m) {
    if (m.replace(/[^A-Za-z]/g, '').length < 2) { return m; }
    return '<b class="w">' + m + '</b>';
  });

  // 2) 따옴표로 묶인 한국어 뜻 — 밑줄 (임시 기호만 노리므로 위에서 넣은 태그는 건드리지 않는다)
  t = t.replace(/\u0001([^\u0001]{1,60})\u0001/g, '\u0001<u class="q">$1</u>\u0001');
  t = t.replace(/\u2018([^\u2019]{1,60})\u2019/g, '\u2018<u class="q">$1</u>\u2019');

  return t.replace(/\u0001/g, '&quot;').replace(/\u0002/g, '&amp;')
    .replace(/\u0003/g, '&lt;').replace(/\u0004/g, '&gt;');
}

// 한글보다 영문이 뚜렷이 많은 줄이면 예시 문장으로 본다
function isEnglishLine(s) {
  var latin = (s.match(/[A-Za-z]/g) || []).length;
  var hangul = (s.match(/[가-힣]/g) || []).length;
  return latin > 0 && latin >= hangul * 2;
}

// ── 조작 ────────────────────────────────────────────────────────────────────
document.getElementById('tabWeek').onclick = function () {
  scope = 'week';
  this.setAttribute('aria-selected', 'true');
  document.getElementById('tabAll').setAttribute('aria-selected', 'false');
  startSession(weekNos());
};
document.getElementById('tabAll').onclick = function () {
  scope = 'all';
  this.setAttribute('aria-selected', 'true');
  document.getElementById('tabWeek').setAttribute('aria-selected', 'false');
  startSession(pickAll());
};
Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (b) {
  b.onclick = function () {
    dir = b.dataset.dir;
    Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (x) {
      x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
    });
    try { localStorage.setItem('dbj-dir', dir); } catch (e) { }
    startSession(scope === 'week' ? weekNos() : pickAll());
  };
});
document.getElementById('reset').onclick = function (e) {
  e.preventDefault();
  if (!confirm('이 기기에 저장된 복습 기록을 모두 지웁니다.')) return;
  state = { seen: {}, nos: [] };
  saveState(state);
  startSession(weekNos());
};

try {
  var savedDir = localStorage.getItem('dbj-dir');
  if (savedDir) {
    dir = savedDir;
    Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (x) {
      x.setAttribute('aria-pressed', x.dataset.dir === dir ? 'true' : 'false');
    });
  }
} catch (e) { }

startSession(weekNos());
</script>
