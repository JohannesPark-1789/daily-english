<title>듣보잡 영어 복습 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  /* 자막(캡션)을 모티프로 삼았다 — 출처가 쇼츠 영상이고, 카드가 하는 일도
     화면 아래 자막처럼 "한 줄을 띄우고 뜻을 붙이는" 것이라서. */
  :root {
    --bg: #e9ecec; --surface: #ffffff; --plate: #16181c;
    --ink: #14161a; --on-plate: #f4f6f6; --muted: #5f6872; --line: #d6dbda;
    --accent: #f0c000; --accent-ink: #7a6000;
    --no: #b8384f; --mid: #4f7396; --ok: #2c7f57;
    --shadow: 0 1px 2px rgba(16,20,24,.05), 0 10px 30px rgba(16,20,24,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1013; --surface: #181b20; --plate: #05060700;
      --ink: #eef1f2; --on-plate: #f4f6f6; --muted: #99a2ac; --line: #262b32;
      --accent: #ffd54a; --accent-ink: #ffd54a;
      --no: #e0697e; --mid: #85a9cd; --ok: #62b98c;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1013; --surface: #181b20; --plate: #05060700;
    --ink: #eef1f2; --on-plate: #f4f6f6; --muted: #99a2ac; --line: #262b32;
    --accent: #ffd54a; --accent-ink: #ffd54a;
    --no: #e0697e; --mid: #85a9cd; --ok: #62b98c;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    line-height: 1.5;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 540px; margin: 0 auto; padding: 18px 16px 36px; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, "Consolas", monospace; font-variant-numeric: tabular-nums; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  h1 em { font-style: normal; color: var(--muted); font-weight: 400; }
  .counter { font-size: 12px; color: var(--muted); letter-spacing: .04em; }

  .tabs { display: flex; gap: 8px; margin-bottom: 8px; }
  .tab {
    flex: 1; padding: 10px 8px; border: 1px solid var(--line); background: var(--surface);
    color: var(--muted); border-radius: 4px; font-family: inherit; font-size: 13px;
    font-weight: 500; cursor: pointer;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-color: var(--ink); font-weight: 600; }

  .modes { display: flex; gap: 0; margin-bottom: 18px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .mode {
    flex: 1; padding: 8px 4px; border: 0; border-right: 1px solid var(--line); background: var(--surface);
    color: var(--muted); font-family: inherit; font-size: 12px; cursor: pointer;
  }
  .mode:last-child { border-right: 0; }
  .mode[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }

  /* 스크럽 바 — 영상 진행바처럼 */
  .scrub { height: 2px; background: var(--line); margin-bottom: 18px; position: relative; }
  .scrub i { position: absolute; inset: 0 auto 0 0; background: var(--accent); width: 0; transition: width .2s ease; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: var(--shadow); overflow: hidden; cursor: pointer; user-select: none;
  }
  .card .stamp {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 14px; border-bottom: 1px solid var(--line);
    font-size: 11px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase;
  }
  .card .stamp b { color: var(--accent-ink); font-weight: 500; }
  .face {
    padding: 46px 22px; min-height: 190px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .face .line { font-size: 26px; font-weight: 600; letter-spacing: -.02em; text-wrap: balance; word-break: keep-all; }
  .face .line.en { font-size: 24px; letter-spacing: -.01em; }
  .prompt { margin-top: 20px; font-size: 12px; color: var(--muted); }

  /* 뒷면 — 자막 판 */
  .plate { background: var(--plate); padding: 24px 20px; text-align: center; }
  .plate .lbl { font-size: 10px; letter-spacing: .14em; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; }
  .plate .txt { font-size: 22px; font-weight: 600; color: var(--on-plate); text-wrap: balance; word-break: keep-all; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .plate { border-top: 1px solid var(--line); }
    :root:not([data-theme="light"]) .plate .txt { color: var(--accent); }
  }
  :root[data-theme="dark"] .plate { border-top: 1px solid var(--line); }
  :root[data-theme="dark"] .plate .txt { color: var(--accent); }
  .plate a { display: inline-block; margin-top: 14px; font-size: 12px; color: var(--muted); text-decoration: none; border-bottom: 1px solid currentColor; }
  .plate .links { display: flex; gap: 16px; justify-content: center; }

  /* 상세 설명 — 헷갈릴 때만 펼친다 */
  .detail {
    margin-top: 12px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 6px; overflow: hidden;
  }
  .detail summary {
    padding: 15px 16px; font-size: 15px; font-weight: 700; color: var(--ink);
    background: var(--accent); cursor: pointer; list-style: none;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .detail summary::-webkit-details-marker { display: none; }
  .detail summary .lbl-txt { display: flex; align-items: center; gap: 8px; }
  .detail summary::after { content: '▾'; font-size: 13px; opacity: .8; }
  .detail[open] summary { border-bottom: 1px solid var(--line); }
  .detail[open] summary::after { content: '▴'; }
  /* 노란 바탕 위 글자는 어느 테마에서든 어두워야 읽힌다 */
  .detail summary, :root[data-theme="dark"] .detail summary { color: #14161a; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .detail summary { color: #14161a; }
  }
  .detail .body {
    padding: 18px 16px 22px; font-size: 15px; line-height: 1.8;
    word-break: keep-all; text-align: left; color: var(--ink);
  }
  .detail .body > * + * { margin-top: 14px; }
  .detail .body p { margin: 0; }

  /* 절 제목 — 자막 모티프에 맞춰 노란 세로선 */
  .detail h4 {
    margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.01em;
    padding-left: 10px; border-left: 3px solid var(--accent); color: var(--ink);
  }

  /* 문단 안에 섞인 영어 — 눈이 걸리게 굵게 + 다른 색 (노랑은 뜻·핵심 전용) */
  .detail .w { font-weight: 700; color: var(--mid); font-style: normal; }
  /* 따옴표로 묶인 한국어 뜻 — 밑줄 */
  .detail .q {
    text-decoration: underline; text-decoration-color: var(--accent);
    text-decoration-thickness: 2px; text-underline-offset: 3px;
  }
  /* 첫 문단은 요약 성격이라 조금 크게 */
  .detail .lead { font-size: 16px; font-weight: 500; }

  /* "짧은 대화:" 같은 꼬리표 */
  .detail .label {
    font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  /* A: / B: 대화 */
  .detail .dlg {
    padding: 12px 14px; background: var(--bg); border-radius: 6px;
    border-left: 3px solid var(--line); display: flex; flex-direction: column; gap: 3px;
  }
  .detail .dlg .who { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .08em; }
  .detail .dlg .en { font-weight: 600; }
  .detail .dlg .ko { color: var(--muted); font-size: 14px; }
  .detail .body > h4 + * { margin-top: 8px; }
  .detail .body > * + h4 { margin-top: 22px; }

  /* 뜻·풀이 화살표 줄 */
  .detail .arrow { color: var(--accent-ink); font-weight: 600; margin: 0; }
  .detail .arrows { display: flex; flex-direction: column; gap: 4px; }

  /* 영어 예시와 그 해석을 한 덩어리로 */
  .detail .ex {
    padding: 12px 14px; background: var(--bg); border-radius: 6px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .detail .ex .en { font-weight: 600; }
  .detail .ex .ko { color: var(--muted); font-size: 14px; }

  /* 핵심 한 줄 — 아침 카톡에 나가는 그 문장 */
  .detail .key {
    padding: 14px 16px; border-radius: 6px; background: var(--plate);
    color: var(--on-plate); font-weight: 600; font-size: 15px;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .detail .key::before { content: '💡'; flex: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .detail .key { border: 1px solid var(--accent); color: var(--accent); }
  }
  :root[data-theme="dark"] .detail .key { border: 1px solid var(--accent); color: var(--accent); }

  .grade { display: none; gap: 8px; margin-top: 12px; }
  .grade.on { display: flex; }
  .grade button {
    flex: 1; padding: 14px 4px; border-radius: 4px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); font-family: inherit; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }
  .grade .g0 { border-color: var(--no); color: var(--no); }
  .grade .g1 { border-color: var(--mid); color: var(--mid); }
  .grade .g2 { border-color: var(--ok); color: var(--ok); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 12px; color: var(--muted); }
  .foot a { color: var(--muted); }

  .done { text-align: center; padding: 34px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  .done h2 { font-size: 18px; margin: 0 0 6px; font-weight: 600; }
  .done p { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .tally { display: flex; gap: 18px; justify-content: center; margin-bottom: 22px; font-size: 11px; color: var(--muted); letter-spacing: .08em; }
  .tally b { display: block; font-size: 24px; font-weight: 600; }
  .btn {
    padding: 12px 18px; border-radius: 4px; border: 1px solid var(--ink); background: var(--ink);
    color: var(--bg); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; margin: 0 4px;
  }
  .btn.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  .empty { text-align: center; color: var(--muted); padding: 48px 12px; font-size: 13px; line-height: 1.7; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>듣보잡 영어 <em>복습 카드</em></h1>
    <div class="counter mono" id="count"></div>
  </header>

  <div class="tabs">
    <button class="tab" id="tabWeek" aria-selected="true">이번 주</button>
    <button class="tab" id="tabAll" aria-selected="false">누적 연습</button>
  </div>

  <div class="modes">
    <button class="mode" data-dir="ko2en" aria-pressed="true">한글 → 영어</button>
    <button class="mode" data-dir="en2ko" aria-pressed="false">영어 → 한글</button>
    <button class="mode" data-dir="mix" aria-pressed="false">섞기</button>
  </div>

  <div class="scrub"><i id="prog"></i></div>
  <div id="stage"></div>

  <div class="foot">
    <span id="footNote"></span>
    <a href="#" id="reset">기록 지우기</a>
  </div>
</div>

<script>
var DATA = {"startDate":"2026-08-24","skipNos":[2,3,5,6,8],"priorNos":[2,3,5,6,8],"cards":[{"no":1,"en":"I WOULDN\u0027T EVEN KNOW WHERE TO START","ko":"어디서부터 시작해야 할지도 모르겠어","url":"https://www.youtube.com/shorts/xOGL7_knAyg","note":"I WOULDN\u0027T EVEN KNOW WHERE TO START\n\n→ 어디서부터 시작해야 할지도 모르겠어.\n\nstart는 ‘시작하다’이고, where to start는 ‘어디서 시작할지’입니다. 여기서 where는 실제 장소보다는 일의 출발점을 가리킵니다. 방을 정리한다면 옷부터 치울지 책부터 정리할지, 복잡한 사건을 설명한다면 어느 대목부터 이야기할지를 뜻합니다. 할 일이 너무 많거나 사정을 전혀 모르면, 일을 해내기는커녕 출발점조차 정하지 못할 수 있습니다.\n\n그 느낌을 강하게 만드는 말이 even입니다. ‘심지어’라고 기계적으로 옮기기보다 ‘그 가장 기본적인 단계조차’라고 이해하시면 자연스럽습니다. 전체 문장은 “내가 그걸 한다고 해도, 어디서 시작해야 할지조차 모르겠다”라는 흐름입니다. 한국어의 “엄두가 안 나요”, “뭐부터 손대야 할지 막막해요”와 비슷한 감각입니다.\n\nwouldn\u0027t는 여기서 과거를 나타내지 않습니다. ‘내가 그런 상황에 놓인다면’이라는 가정을 배경에 깔아 줍니다. 복잡한 기계를 고쳐 달라는 부탁을 받았을 때, 아직 실제로 수리를 시도하지 않았더라도 이렇게 말할 수 있습니다. 자기 능력을 냉정하게 평가하기도 하고, 상대가 얼마나 어려운 일을 해냈는지 놀라워하는 말로 쓰기도 합니다.\n\n비슷한 표현인 I don\u0027t know where to start는 지금 실제로 무엇부터 해야 할지 모르겠다는 상태를 직접 말합니다. I wouldn\u0027t know where to start는 ‘나라면 맡아도 감이 없겠다’라는 가정의 느낌이 더 살아 있습니다. I won\u0027t start라고 하면 ‘시작하지 않겠다’라는 의지나 미래의 행동을 말하므로, 막막해서 출발점이 안 보인다는 뜻과 달라집니다.\n\n짧은 대화:\n\nA: Could you build a website like this? / 너도 이런 웹사이트 만들 수 있어?\n\nB: I wouldn\u0027t even know where to start. / 어디서부터 시작해야 할지도 모르겠어.\n\n이 대답은 단순히 “싫어”라는 거절이 아닙니다. 필요한 지식이나 접근 방법이 없다는 점을 강조합니다. 다만 직접 도움을 요청받은 자리에서는 사실상 거절로 받아들여질 수 있습니다. 반대로 전문가의 작업을 보며 말하면 “나는 시작도 못 하겠는데 정말 대단하다”라는 감탄이 됩니다.\n\n기억 고리: 일을 끝내는 문제가 아니라, 첫발을 어디에 놓을지도 안 보이는 막막함입니다."},{"no":2,"en":"YOUR GUESS IS AS GOOD AS MINE","ko":"나도 너만큼 몰라","url":"https://www.youtube.com/shorts/B4j3i5W4lfc","note":"YOUR GUESS IS AS GOOD AS MINE\n\n→ 나도 너만큼 몰라.\n\nguess는 확실한 지식 없이 해 보는 ‘추측’입니다. as good as는 둘의 수준이 같다고 비교하는 구조이므로, 글자대로 보면 “네 추측도 내 추측만큼 괜찮다”입니다. 언뜻 상대의 추리 실력을 칭찬하는 것 같지만, 보통은 “내가 가진 정보도 네 것보다 나을 게 없다”라는 뜻으로 사용합니다.\n\n질문을 받은 사람에게 특별한 정보가 있을 거라고 기대했는데, 정작 그 사람도 아는 것이 없는 장면을 떠올리시면 됩니다. “왜 갑자기 회의가 취소됐지?”라는 질문에 이 표현으로 답하면, “내가 추측한다고 더 정확하겠어? 나도 몰라”라는 말입니다. 상대와 자신이 같은 출발선에 있다는 점을 이용해서 무지를 표현하는 것이죠.\n\n한국어의 “내가 알면 너한테 물어보겠냐”와 일부 감각이 통하지만, 그만큼 날카롭거나 짜증 섞인 표현은 아닙니다. 편안하게 말하면 “글쎄, 나도 모르겠네”에 가깝습니다. 특히 이유나 결과를 예측할 근거가 없을 때 잘 어울립니다. 정답이 정해진 문제에서도 쓸 수 있지만, 주로 현재 두 사람 모두 답에 접근할 정보가 없다는 뜻입니다.\n\nI don\u0027t know는 모른다는 사실만 전달합니다. Your guess is as good as mine은 거기에 “나한테 더 나은 답을 기대해도 소용없다”라는 관계적인 의미를 덧붙입니다. 반면 I agree with you는 상대의 의견에 동의한다는 말입니다. 이 표현은 상대의 추측이 옳다고 인정하는 것도, 실제로 두 추측을 비교해서 같은 점수를 주는 것도 아닙니다.\n\n짧은 대화:\n\nA: Why is the restaurant closed today? / 오늘 식당은 왜 문을 닫았지?\n\nB: Your guess is as good as mine. / 나도 너만큼 몰라.\n\n상대가 중요한 문제로 진지하게 도움을 구한다면, 이 말만 던지는 것은 다소 무심하게 들릴 수 있습니다. 그러나 함께 버스를 기다리거나 예상 못 한 상황을 지켜보는 사이에서는 자연스러운 반응입니다. “우리 둘 다 모르니 함께 추측할 수밖에 없다”라는 가벼운 동료 의식도 생깁니다.\n\n기억 고리: 네 추측을 높이 평가하는 말이라기보다, 내게도 더 좋은 정보가 없다는 말입니다."},{"no":3,"en":"WORKS LIKE A CHARM","ko":"효과가 아주 좋아","url":"https://www.youtube.com/shorts/xNx0VsGPYlI","note":"WORKS LIKE A CHARM\n\n→ 효과가 아주 좋아.\n\nwork의 기본 뜻을 ‘일하다’로만 외우면 이 표현이 어색해집니다. 기계나 방법을 주어로 쓰는 work는 ‘제 기능을 하다’, ‘원하는 결과를 내다’라는 뜻입니다. 새 충전기가 제대로 작동하는 것도 work이고, 잠들기 위해 시도한 방법이 실제로 도움이 되는 것도 work입니다. 사람의 노동보다 기능과 효과에 초점이 있습니다.\n\ncharm에는 사람을 끄는 ‘매력’이라는 뜻 외에 ‘부적’이나 ‘주문’이라는 뜻도 있습니다. 여기서는 마법의 힘을 가진 부적이나 주문의 이미지를 떠올리시면 됩니다. 어떤 방법을 썼는데 문제가 신기할 만큼 매끄럽게 해결되면 “마법이라도 부린 것처럼 잘 듣는다”라고 말하는 것입니다. 실제 초자연적인 힘을 믿는다는 뜻은 아닙니다.\n\n한국어에서도 약이 잘 들으면 “귀신같이 잘 듣네”라고 하고, 간단한 요령이 문제를 해결하면 “이거 마법이네”라고 합니다. 같은 방식으로 효과를 인상적으로 표현합니다. 따라서 ‘매력적으로 일한다’가 아니라 ‘아주 잘 작동한다’, ‘효과가 확실하다’로 이해하셔야 합니다. 기계뿐 아니라 요령, 도구, 해결책에도 두루 쓸 수 있습니다.\n\nWorks like a charm은 대화에서 It works like a charm의 주어를 생략한 형태로 자주 등장합니다. 보통 직접 써 보고 효과가 좋았다고 평가하거나, 이미 믿을 만한 방법이라고 소개할 때 사용합니다. “아마 도움이 될지도 몰라”처럼 가능성만 조심스럽게 말하는 표현보다 확신과 만족감이 훨씬 큽니다.\n\n짧은 대화:\n\nA: Did restarting the router help? / 공유기 다시 켜니까 해결됐어?\n\nB: Yep. Works like a charm. / 응. 아주 잘 돼.\n\n비슷한 표현인 It works는 일단 작동하거나 효과가 있다는 뜻입니다. It works like a charm은 그 작동이 아주 만족스럽고 매끄럽다는 평가까지 보탭니다. 반면 charming은 보통 사람이나 장소가 매력적이라는 뜻이므로 같은 방향으로 해석하면 안 됩니다. 누군가를 설득하는 방법에도 쓸 수 있지만, 그때도 중심은 사람의 매력이 아니라 방법의 효과입니다.\n\n기억 고리: work는 제 기능을 하는 것이고, like a charm은 마법처럼 잘된다는 만족감을 더합니다."},{"no":4,"en":"THAT\u0027S NOT A THING","ko":"그런 건 없어","url":"https://www.youtube.com/shorts/tUAHzvO7nxc","note":"THAT\u0027S NOT A THING\n\n→ 그런 건 없어.\n\nthing의 기본 뜻은 ‘것’이나 ‘물건’이지만, 회화에서는 범위가 훨씬 넓습니다. 사람들이 실제로 하는 행동, 인정하는 개념, 통용되는 규칙, 하나의 현상도 a thing이라고 할 수 있습니다. 따라서 여기서 부정하는 것은 반드시 눈에 보이는 물건의 존재가 아닙니다. “그런 게 실제로 성립하느냐”가 핵심입니다.\n\n예를 들어 누군가 “월요일에는 인사를 안 해도 된다는 규칙이 있잖아”라고 말한다면, 이 표현은 “그런 규칙은 없어”라는 뜻이 됩니다. 누군가 엉뚱한 유행을 있는 것처럼 소개한다면 “그런 게 어디 있어”라고 반응할 수도 있습니다. that이 무엇을 가리키느냐에 따라 관습, 제도, 현상, 분류 자체를 부정하는 말이 됩니다.\n\n한국어의 “그런 말이 어디 있어요”, “그런 건 인정 안 되죠”와 연결하시면 감각이 잘 잡힙니다. 다만 화자가 실제로 모든 사실을 조사해서 존재하지 않는다고 증명했다는 뜻은 아닙니다. 자기에게 낯설거나 터무니없게 느껴져서 단정적으로 말할 때도 있습니다. 그래서 상대가 “실제로 있어”라고 반박할 여지가 충분합니다.\n\n비슷한 표현인 That\u0027s not true는 어떤 주장이나 정보가 사실이 아니라고 말합니다. That\u0027s not a thing은 그 주장에 등장하는 개념이나 관행 자체가 성립하지 않는다고 말하는 쪽에 가깝습니다. That\u0027s not my thing은 전혀 다릅니다. 존재는 인정하되 “그건 내 취향이 아니다”, “나는 그런 걸 좋아하지 않는다”라는 뜻입니다.\n\n짧은 대화:\n\nA: I get a free dessert because it\u0027s my half-birthday. / 오늘 내 반 생일이니까 디저트 공짜로 받는 거지.\n\nB: That\u0027s not a thing here. / 여기엔 그런 건 없어.\n\n예시의 here는 부정하는 범위를 ‘이곳’으로 좁혀 줍니다. 이런 말이 없으면 훨씬 넓게 “그런 관행 자체가 없다”라고 들릴 수 있습니다. 친한 사이에서는 장난스럽지만, 상대의 문화나 경험을 두고 사용하면 무시하는 말처럼 들리기도 합니다. 단순한 정보 부족을 표현하는 말보다 강한 부정이라는 점을 기억하시면 좋습니다.\n\n기억 고리: 여기서 thing은 물건이 아니라, 실제로 통용되는 하나의 개념이나 관행입니다."},{"no":5,"en":"I\u0027M WITH YOU SO FAR","ko":"여기까지는 이해했어","url":"https://www.youtube.com/shorts/WtYJH0N0BNo","note":"I\u0027M WITH YOU SO FAR\n\n→ 여기까지는 이해했어.\n\nwith의 기본 감각은 ‘함께’입니다. 실제로 같은 장소에 있는 경우뿐 아니라, 생각이나 설명을 따라가며 함께 움직이는 경우에도 사용할 수 있습니다. 누군가 단계별로 설명할 때 I\u0027m with you라고 하면, “네가 가는 생각의 길을 나도 따라가고 있다”라는 뜻이 됩니다. 그래서 ‘지금 설명을 이해하고 있다’로 자연스럽게 이어집니다.\n\nso far는 ‘지금까지’, ‘여기까지’입니다. 멀리까지 이어진 길에서 현재 도착한 지점을 표시한다고 생각하시면 됩니다. 설명이 아직 끝나지 않았을 때 “현재 단계까지는 따라왔어요”라고 알려 주는 것이죠. 전체 내용을 완전히 이해했다는 선언이 아니라, 중간 점검에 대한 대답입니다.\n\n한국어의 “응, 거기까지는 따라왔어”가 아주 비슷합니다. 상대가 어려운 계산이나 복잡한 사건의 순서를 설명하면서 이해했는지 물을 때 특히 잘 맞습니다. 이 말을 들은 상대는 앞부분을 다시 설명할 필요 없이 다음 단계로 넘어갈 수 있습니다. 듣는 사람이 설명의 흐름에 참여하고 있다는 신호이기도 합니다.\n\n다만 so far를 썼다고 반드시 “이제부터는 못 알아듣겠다”라는 뜻이 되는 것은 아닙니다. 뒤에 반박이나 질문이 이어질 수는 있지만, 그저 설명이 진행 중이라 현재까지의 이해를 표시할 수도 있습니다. 한국어 번역의 ‘는’ 때문에 불필요하게 부정적인 뉘앙스를 강하게 넣지 않는 것이 좋습니다.\n\n짧은 대화:\n\nA: First, we divide the total by the number of people. / 먼저 총액을 사람 수로 나누는 거야.\n\nB: I\u0027m with you so far. What happens next? / 여기까지는 이해했어. 다음엔 어떻게 해?\n\n비슷한 표현인 I agree with you는 상대의 의견이 옳다고 동의하는 말입니다. 설명의 논리를 이해하는 것과 그 결론에 찬성하는 것은 다릅니다. I\u0027m with you 자체는 문맥에 따라 지지나 동의도 나타내지만, 설명 도중 so far와 함께 쓰이면 ‘이해하며 따라가고 있다’는 의미가 두드러집니다. “무슨 말인지는 알겠지만 동의하지는 않는다”라는 상태에서도 사용할 수 있습니다.\n\n기억 고리: 상대의 설명을 하나의 길로 보고, 지금 지점까지는 함께 따라왔다는 말입니다."},{"no":6,"en":"THAT DOES IT","ko":"이제 더는 못 참아","url":"https://www.youtube.com/shorts/madiKAnQslA","note":"THAT DOES IT\n\n→ 이제 더는 못 참아.\n\n→ 일을 마무리하는 상황에서는 “됐어, 이걸로 끝이야.”\n\ndo는 ‘하다’이지만, 문맥에 따라 ‘필요한 일을 해내다’, ‘충분한 결과를 만들다’라는 뜻도 됩니다. 여기서 it은 앞뒤 상황에서 이미 알려진 일을 가리킵니다. That does it의 공통적인 감각은 “바로 그것이 결정적인 결과를 만든다”입니다. 무엇이 끝나는지는 상황이 정하므로, 항상 화내는 말로만 외우면 놓치는 부분이 생깁니다.\n\n화를 내는 장면에서는 that이 방금 벌어진 마지막 사건을 가리킵니다. 앞에서 여러 번 참았는데 상대가 또 선을 넘었다면, 그 행동이 인내를 끝내는 결정타가 됩니다. 한국어의 “이제 됐어”, “너 이걸로 끝이야”, “더는 못 참아”와 비슷합니다. 지금 막 처음 불쾌해졌다는 말보다, 한계에 도달했다는 느낌이 강합니다.\n\n반대로 수리나 정리를 마무리하는 장면에서는 필요한 일이 끝났다는 뜻입니다. 나사를 마지막으로 조이고 That does it이라고 하면 “됐어, 이걸로 마무리야”가 됩니다. 같은 문장이 정반대처럼 느껴지는 이유는, 한쪽에서는 참는 과정이 끝나고 다른 쪽에서는 작업이 끝나기 때문입니다. 공통점은 마지막 한 번의 행동이 상황을 마무리한다는 것입니다.\n\n비슷한 표현인 That should do it은 “그 정도면 될 거야”라는 예상이 들어갑니다. 실제 결과를 아직 완전히 확인하지 않았거나 조심스럽게 판단하는 말입니다. That does it은 지금 그 행동으로 필요한 선에 도달했다고 더 직접적으로 말합니다. 또 That did it은 과거형이므로, 앞서 한 행동이 효과를 냈거나 문제를 일으켰다는 식으로 결과를 돌아봅니다.\n\n짧은 대화:\n\nA: He deleted my work again. / 걔가 내 작업물을 또 지웠어.\n\nB: That does it. I\u0027m changing the password. / 이제 더는 못 참아. 비밀번호 바꿀 거야.\n\n이 예시에서는 비밀번호를 바꾸겠다는 후속 행동이 표현의 뜻을 분명하게 만듭니다. 실제 회화에서도 표정, 억양, 뒤따르는 행동을 함께 보셔야 합니다. 화난 목소리로 강하게 끊으면 최후통첩처럼 들리지만, 작업 후 편안하게 말하면 만족스러운 완료 선언입니다.\n\n기억 고리: 방금 그 일이 마지막 한 방이 되어, 인내든 작업이든 끝에 도달한 것입니다."},{"no":7,"en":"IS THAT RIGHT?","ko":"아, 그래?","url":"https://www.youtube.com/shorts/m4xqO3oxJQI","note":"IS THAT RIGHT?\n\n→ 아, 그래?\n\n→ 확인하는 상황에서는 “그게 맞아?”\n\nright의 기본 뜻 가운데 하나는 ‘맞는’, ‘정확한’입니다. 따라서 문장 구조만 보면 “그것이 맞나요?”라는 확인 질문입니다. 그런데 대화에서는 이미 전달받은 말을 다시 확인하는 행동 자체가 관심과 놀라움을 나타낼 수 있습니다. 그래서 실제로는 시험 답안을 검사하듯 정확성을 묻기보다, 상대의 이야기를 받아 주는 반응으로 자주 쓰입니다.\n\n친구가 “다음 달에 이사해”라고 말했을 때 Is that right?라고 하면, 대개 “아, 그래?”, “정말?”에 가깝습니다. 상대가 거짓말을 했다고 의심하는 것이 아니라 새로운 소식을 접했다는 표시입니다. 한국어에서도 “그래요?”는 글자대로라면 사실 여부를 묻지만, 실제로는 상대에게 계속 이야기해 달라는 맞장구가 되곤 합니다.\n\n이 표현은 억양의 영향이 큽니다. 밝게 올려 말하면 흥미나 가벼운 놀라움이 됩니다. 낮고 차갑게 말하거나 right에 힘을 주면 “그래? 정말 그렇단 말이지?”라는 의심이나 도전으로 들릴 수 있습니다. 단어 자체에 항상 친절함이나 비꼼이 들어 있는 것은 아니므로, 한 가지 감정으로 고정해서 외우지 않는 것이 좋습니다.\n\n비슷한 표현인 Is that correct?는 정보가 정확한지를 보다 명시적으로 확인하는 느낌입니다. 계산 결과나 예약 내용을 점검할 때 잘 맞습니다. Are you sure?는 상대의 확신을 묻기 때문에, 이미 들은 내용을 의심하거나 재확인하는 힘이 더 큽니다. Is that right?는 상황에 따라 그런 확인도 할 수 있지만, 가벼운 맞장구로 쓰이는 범위가 넓습니다.\n\n짧은 대화:\n\nA: I used to live in Busan. / 나 예전에 부산에 살았어.\n\nB: Is that right? For how long? / 아, 그래? 얼마나 살았는데?\n\n이 대화에서는 뒤에 이어지는 질문이 관심을 분명하게 보여 줍니다. 상대가 부산에 살았다는 주장을 검증하려는 것이 아니라, 새로 알게 된 사실을 받아들이며 대화를 확장하는 것입니다. 반면 영수증 금액을 가리키며 같은 말을 하면 정말 계산이 맞는지 묻는 질문이 됩니다. 먼저 ‘소식에 대한 반응인지, 정보 검증인지’를 구분하시면 자연스럽게 해석됩니다.\n\n기억 고리: “맞아?”라는 확인의 모양으로, 실제 대화에서는 “아, 그래?”라는 관심을 건넬 수 있습니다."},{"no":8,"en":"COMES WITH THE TERRITORY","ko":"그 일을 하면 감수해야 하는 거야","url":"https://www.youtube.com/shorts/vDjn7uwvgEQ","note":"COMES WITH THE TERRITORY\n\n→ 그 일을 하면 감수해야 하는 거야.\n\ncome with는 어떤 것이 다른 것에 ‘함께 따라오다’라는 뜻입니다. 물건을 사면 설명서가 딸려 오고, 큰 집을 가지면 관리할 일도 함께 늘어납니다. territory의 기본 뜻은 ‘영역’, ‘지역’입니다. 이 표현에서는 직업이나 역할, 처한 상황을 하나의 영역처럼 바라봅니다. 그 영역에 들어가면 자연스럽게 따라오는 조건이 있다는 것입니다.\n\n예를 들어 식당을 운영하면 손님이 몰리는 시간에 바쁜 것이 따라오고, 유명해지면 사생활에 대한 관심이 따라올 수 있습니다. 그 일을 선택하면서 좋은 부분만 떼어 가지고 불편한 부분을 완전히 제거하기는 어렵다는 감각입니다. 한국어의 “그 일을 하려면 그 정도는 감수해야죠”, “그 자리에 있으면 따라오는 일이죠”와 연결됩니다.\n\n목록의 표현은 보통 It comes with the territory에서 주어가 생략된 형태로 쓰입니다. 앞서 언급한 문제나 부담을 it으로 받아 말하는 것입니다. 문장에 ‘나쁜 일’이라는 단어가 없는데도 부담을 설명하는 경우가 많은 이유는, 불편한 일을 두고 “왜 이런 것까지 해야 해?”라고 할 때 이 표현이 유용하기 때문입니다. 다만 본질적으로 부정적인 결과에만 한정되는 말은 아닙니다.\n\n비슷한 표현인 That\u0027s part of the job은 업무의 일부라는 뜻을 직접 말합니다. Comes with the territory는 직무 목록에 명시되지 않아도 역할상 자연스럽게 따라오는 조건까지 포함합니다. 또 It\u0027s your fault는 책임이나 잘못을 따지는 말이지만, 이 표현 자체는 잘못을 비난하기보다 상황에 수반되는 현실을 설명합니다.\n\n짧은 대화:\n\nA: Do you have to work weekends as a chef? / 요리사는 주말에도 일해야 해?\n\nB: Sometimes. It comes with the territory. / 가끔은. 이 일을 하면 감수해야 하는 거야.\n\n자신의 어려움을 담담하게 말할 때는 현실을 받아들이는 태도가 느껴집니다. 그러나 남이 겪는 심각한 문제를 향해 무심하게 말하면 “원래 그런 거니까 참아”처럼 들릴 수 있습니다. 어떤 일이 흔히 따라온다는 것과 그것이 정당하거나 반드시 개선할 수 없다는 것은 별개의 문제입니다. 표현의 핵심은 동반되는 조건이지, 모든 불편을 정당화하는 데 있지는 않습니다.\n\n기억 고리: 어떤 영역에 들어가면, 그 영역에 딸린 조건도 함께 따라옵니다."},{"no":9,"en":"WOULDN\u0027T THAT BE SOMETHING?","ko":"그렇게 되면 정말 대단하겠다","url":"https://www.youtube.com/shorts/_ONdvsvycik","note":"WOULDN\u0027T THAT BE SOMETHING?\n\n→ 그렇게 되면 정말 대단하겠다.\n\nsomething의 기본 뜻은 특정하지 않은 ‘무언가’입니다. 그런데 사람이나 사건을 두고 특별한 억양으로 something이라고 하면, 단순히 존재하는 무엇이 아니라 ‘보통이 아닌 것’, ‘눈에 띄는 것’이라는 평가가 실릴 수 있습니다. 한국어의 “그거 참 물건이네”, “정말 한 건이겠다”처럼 구체적인 형용사 없이 특별함을 나타내는 방식입니다.\n\nwould be는 아직 현실이 아닌 상황을 머릿속으로 그립니다. 따라서 Wouldn\u0027t that be something?은 “그 일이 실제로 일어난다면 꽤 특별하지 않겠어?”라는 흐름입니다. 부정 의문문의 형태로 상대에게 감탄을 함께 나누자고 하는 것입니다. 특별하지 않을 거라는 부정적인 예측이 아니라, 오히려 ‘참 대단하겠다’라는 반응을 기대하는 경우가 많습니다.\n\n예를 들어 무명인 친구의 노래가 세계적으로 인기를 얻는 상황을 상상하며 사용할 수 있습니다. 한국어로 “그렇게 되면 진짜 볼 만하겠다”, “와, 그러면 엄청나겠다”라고 하는 느낌입니다. 결과가 좋은 쪽이면 기대와 감탄이 되고, 터무니없거나 우스운 상황이면 놀라움이나 빈정거림이 섞일 수도 있습니다.\n\n비슷한 표현인 Wouldn\u0027t that be nice?는 그 일이 기분 좋고 바람직하다는 쪽에 초점이 있습니다. Wouldn\u0027t that be something?은 그 일이 인상적이거나 특별하다는 쪽에 더 열려 있습니다. 반드시 ‘좋다’만을 뜻하지는 않는 것이죠. 또 Isn\u0027t that something?은 눈앞에 벌어졌거나 이미 알려진 사실에 감탄할 때 자연스럽고, wouldn\u0027t는 상상 속 가능성과 더 잘 어울립니다.\n\n짧은 대화:\n\nA: Imagine if our little film won an award. / 우리 작은 영화가 상이라도 받는다고 상상해 봐.\n\nB: Wouldn\u0027t that be something? / 그렇게 되면 정말 대단하겠다.\n\n여기서 대답하는 사람은 수상 가능성을 분석하거나 성공을 약속하지 않습니다. 상대가 꺼낸 상상을 잠시 함께 바라보며 그 의미를 즐기는 것입니다. 그래서 확률이 낮아도 사용할 수 있습니다. “진짜 그렇게 되겠어?”라고 의심하는 말과 달리, 우선 그 장면이 얼마나 특별할지를 감정적으로 공유하는 데 중심이 있습니다.\n\n기억 고리: something을 ‘보통 아닌 일’로 잡으면, 아직 오지 않은 특별한 장면에 함께 감탄하는 말입니다."},{"no":10,"en":"WHO AM I KIDDING?","ko":"내가 누굴 속이겠어","url":"https://www.youtube.com/shorts/GsrM81O0x6I","note":"WHO AM I KIDDING?\n\n→ 내가 무슨 말도 안 되는 소리를 하는 거야.\n\nkid는 명사로 ‘아이’이지만, 동사로는 ‘농담하다’, ‘놀리다’, ‘속이다’라는 뜻이 있습니다. 여기서는 아이와 연결해서 해석할 필요가 없습니다. Who am I kidding?은 글자대로 “내가 지금 누구를 속이고 있는 거지?”입니다. 대개 실제로 속이고 있는 사람의 이름을 묻는 질문이 아니라, 자기 말이나 생각이 현실과 맞지 않는다는 것을 스스로 깨닫는 말입니다.\n\n예를 들어 매일 늦잠을 자던 사람이 “내일부터 새벽 다섯 시에 일어나야지”라고 말한 뒤 이 표현을 붙일 수 있습니다. 앞의 다짐이 불가능하다고 논리적으로 증명하는 것이 아니라, 자기 습관을 생각하면 너무 낙관적인 소리였다고 인정하는 것입니다. “남은커녕 나 자신도 못 속이겠네”라는 자각에 가깝습니다.\n\n한국어의 “내가 그렇지, 무슨”, “말은 잘한다”, “내가 지금 무슨 꿈같은 소리를 하냐”와 닮았습니다. 진지한 자기반성에도 쓰지만, 자기 약점을 가볍게 웃어넘기는 말로도 많이 사용합니다. 중요한 점은 앞서 한 말에서 한발 물러나 현실적인 판단으로 돌아온다는 흐름입니다.\n\n비슷한 표현인 Who are you kidding?은 대상을 상대방으로 바꿉니다. “지금 누구를 속이려고 해?”라는 뜻이 되어 상대의 말이 설득력 없다고 지적하므로 훨씬 공격적으로 들릴 수 있습니다. I\u0027m kidding은 “농담이야”라는 뜻입니다. Who am I kidding?은 앞말이 단순한 농담이었다고 설명하는 것이 아니라, 스스로도 믿기 어려운 말이었다고 인정합니다.\n\n짧은 대화:\n\nA: Are you going to save the rest of the cake? / 남은 케이크는 나중에 먹을 거야?\n\nB: Yeah… Who am I kidding? I\u0027ll eat it now. / 응… 내가 무슨 말도 안 되는 소리를 하냐. 지금 먹을 거야.\n\n이 대화에서 화자는 상대를 속이려다가 발각된 것이 아닙니다. 잠깐 그럴듯하게 말해 봤지만 자기 욕구를 알고 있어서 곧바로 말을 고칩니다. 그래서 문장 중간에 잠시 멈추었다가 이 표현을 말하면, 스스로 정신을 차리는 느낌이 살아납니다. 자기비하로만 외우기보다 ‘희망 섞인 말에서 현실로 돌아오는 전환점’으로 이해하시면 활용하기 쉽습니다.\n\n기억 고리: 남을 속이는 문제가 아니라, 나 자신도 안 믿는 소리를 했다는 자각입니다."},{"no":11,"en":"THAT\u0027S A BIG IF","ko":"그 ‘만약’부터가 불확실하잖아","url":"https://www.youtube.com/shorts/gtCUMeUjWW0","note":"THAT\u0027S A BIG IF\n\n→ 그 ‘만약’부터가 불확실하잖아.\n\nif는 보통 ‘만약 \\~라면’이라는 조건을 이끄는 말입니다. 그런데 이 표현에서는 a가 붙은 명사처럼 사용됩니다. 상대가 말한 조건 하나를 떼어 내어 “바로 그 ‘만약’”이라고 부르는 것입니다. big 역시 물리적인 크기보다는 그 조건에 걸린 불확실성이나 중요성이 크다는 뜻으로 이해하시면 됩니다.\n\n누군가 “투자만 받으면 바로 사업을 확장할 수 있어”라고 말한다고 생각해 보세요. 듣는 사람은 확장 계획 자체보다 ‘투자를 받는다’는 전제가 얼마나 확실한지 문제 삼을 수 있습니다. That\u0027s a big if는 “그 조건이 충족된다는 걸 너무 쉽게 넘어가는 거 아니야?”라는 지적입니다. 계획의 뒷부분을 논의하기 전에 앞부분의 불확실성을 보자는 것입니다.\n\n한국어의 “일단 그게 돼야 말이지”, “그 ‘되면’이 문제잖아요”와 사고방식이 같습니다. 어떤 결과가 조건부로는 가능하더라도, 그 조건 자체가 성립하기 어려우면 현실적인 계획으로 보기 어렵습니다. 이 표현은 바로 그 간격을 짚습니다. 조건이 얼마나 중대한지 강조할 수는 있지만, 반드시 절대로 불가능하다고 단정하는 것은 아닙니다.\n\n비슷한 표현인 That\u0027s impossible은 실현 가능성을 훨씬 강하게 부정합니다. That\u0027s a big if는 가능성은 남겨 두되, 확실한 전제로 삼기에는 부담이 크다고 말합니다. What if는 “만약 이러면 어떨까?” 하고 새로운 조건을 꺼내는 표현이고, a big if는 이미 나온 조건을 평가하는 표현이라는 차이도 있습니다.\n\n짧은 대화:\n\nA: If we win the contract, we can hire five more people. / 계약을 따내면 다섯 명 더 뽑을 수 있어.\n\nB: That\u0027s a big if. We haven\u0027t even submitted a proposal. / 그 ‘만약’부터가 불확실하잖아. 아직 제안서도 안 냈어.\n\n이 예시에서 반대하는 사람은 채용 자체를 싫어하는 것이 아닙니다. 계약 성사를 당연한 일처럼 놓고 이야기하는 태도를 경계합니다. 그래서 토론이나 계획 회의에서 유용하지만, 상대의 기대를 한순간에 꺾을 수도 있습니다. 말의 중심을 ‘네 계획이 틀렸다’보다 ‘그 계획의 핵심 조건이 아직 확보되지 않았다’에 두시면 뉘앙스가 정확해집니다.\n\n기억 고리: 결과보다 먼저, 그 결과를 가능하게 할 ‘만약’이 얼마나 불확실한지 보자는 말입니다."},{"no":12,"en":"ONE LESS THING TO WORRY ABOUT","ko":"걱정거리 하나 줄었네","url":"https://www.youtube.com/shorts/zb2i_BMD6Jg","note":"ONE LESS THING TO WORRY ABOUT\n\n→ 걱정거리 하나 줄었네.\n\nthing은 여기서 ‘일’이나 ‘문제’를 뜻하고, to worry about은 그 일이 어떤 종류인지 설명합니다. 즉 thing to worry about은 ‘걱정할 일’입니다. 여기에 one less가 붙으면 기존에 여러 개 있던 걱정거리 가운데 하나가 줄었다는 뜻이 됩니다. 전체 걱정이 사라졌다는 말이 아니라, 부담의 목록에서 한 항목을 지운다는 감각입니다.\n\n한국어의 “한시름 덜었네요”와 아주 가깝습니다. 여행 준비를 하면서 숙소, 교통, 짐, 날씨를 모두 신경 쓰고 있었는데 숙소 예약이 확정되면 이렇게 말할 수 있습니다. 해결된 일이 인생을 바꿀 정도로 크지 않아도 괜찮습니다. 머릿속에서 계속 확인하던 일을 더는 붙잡고 있지 않아도 된다는 안도감이 중심입니다.\n\n목록의 형태는 완전한 문장이라기보다, 상황에 맞춰 바로 꺼내는 명사구입니다. That\u0027s one less thing to worry about에서 앞부분을 생략한 것으로 이해하셔도 좋습니다. 이런 생략은 회화에서 자연스럽습니다. 상대가 문제를 해결해 주었을 때 반응으로 쓰기도 하고, 자신이 일을 하나 끝낸 뒤 혼잣말처럼 하기도 합니다.\n\nless는 줄어든 양을 나타냅니다. one less thing 전체를 ‘일 하나가 덜 있는 상태’로 잡으시면 됩니다. 셀 수 있는 명사 앞에서는 fewer를 배운 학습자가 낯설게 느낄 수 있지만, one less thing은 자연스럽게 굳어진 일상 표현입니다. 여기서 중요한 것은 문법 규칙을 억지로 끼워 맞추는 것보다 ‘기존보다 하나 줄었다’라는 비교의 기준을 보는 것입니다.\n\n짧은 대화:\n\nA: I\u0027ve already booked the hotel. / 호텔은 내가 벌써 예약했어.\n\nB: Great. One less thing to worry about. / 잘됐다. 걱정거리 하나 줄었네.\n\n비슷한 표현인 Nothing to worry about은 ‘걱정할 것이 없다’는 뜻으로, 해당 상황에 대한 걱정 자체를 덜어 줍니다. One less thing to worry about은 다른 걱정은 남아 있을 수 있음을 전제로 합니다. 또 One more thing to worry about이라고 하면 반대로 부담이 하나 추가됩니다. 같은 목록에서 항목 하나를 지우는지 더하는지에 따라 감정이 정반대로 바뀌는 셈입니다.\n\n기억 고리: 머릿속 걱정 목록에서 체크 표시 하나를 지우며 내쉬는 안도의 말입니다."},{"no":13,"en":"NOT BY A LONG SHOT","ko":"어림도 없어","url":"https://www.youtube.com/shorts/X70Pw7FUwl8","note":"NOT BY A LONG SHOT\n\n→ 전혀 아니야.\n\n→ 정도의 차이를 말할 때는 “아직 한참 멀었어.”\n\nshot의 기본 뜻 가운데 하나는 ‘발사’나 ‘한 번의 시도’입니다. long shot을 이해할 때는 멀리 있는 목표를 겨누는 장면을 보조 이미지로 떠올릴 수 있습니다. 다만 이 표현 전체를 해석할 때 핵심은 특정한 역사적 유래를 상상하는 데 있지 않고, ‘목표나 기준에 가까이 가지도 못했다’라는 강한 거리감에 있습니다.\n\nNot by a long shot은 보통 앞의 질문이나 판단을 단호하게 부정합니다. “거의 끝났어?”라는 질문에 쓰면 “아니, 아직 한참 남았어”가 됩니다. “그 사람이 최고의 선수야?”라는 말에 쓰면 “전혀 아니야”, “최고라고 하기엔 한참 멀었어”가 됩니다. 단순히 기준을 조금 못 넘은 정도가 아니라 차이가 크다는 느낌입니다.\n\n한국어의 “어림도 없죠”, “택도 없어요”, “아직 멀었어요”와 통합니다. 따라서 언제나 똑같이 ‘절대로’라고 번역하기보다는 무엇을 부정하는지 보셔야 합니다. 완료 여부를 묻는 상황에서는 남은 일이 많다는 뜻이고, 비교 평가에서는 상대가 제시한 수준과 실제 수준 사이에 큰 간격이 있다는 뜻입니다.\n\n비슷한 표현인 Not quite는 “완전히 그렇지는 않다”, “조금 부족하다”처럼 상대적으로 부드러운 부정에 잘 어울립니다. Not by a long shot은 그보다 훨씬 강하게 거리를 벌립니다. 또 It\u0027s a long shot은 어떤 시도가 성공할 가능성이 낮다는 뜻입니다. Not by a long shot 전체를 ‘가능성이 낮지 않다’처럼 조각내어 계산하면 실제 의미와 어긋납니다.\n\n짧은 대화:\n\nA: Are we done packing? / 우리 짐 다 싼 거야?\n\nB: Not by a long shot. We still have three rooms left. / 아직 한참 멀었어. 방이 세 개나 남았잖아.\n\n이 대답에는 “거의 끝났다고 생각했다면 상황을 잘못 본 거야”라는 교정의 힘이 있습니다. 그래서 친한 사이에서는 실감 나는 반응이지만, 다른 사람의 실력이나 성과를 평가할 때는 상당히 냉정하게 들릴 수 있습니다. 단순한 no보다 훨씬 강한 표현이라는 점을 염두에 두시면 좋습니다. 그 강함은 미래가 영원히 불가능하다는 뜻이 아니라, 지금 제시한 판단이 실제와 멀다는 데서 나옵니다.\n\n기억 고리: 살짝 빗나간 것이 아니라, 맞다고 하기에는 기준에서 한참 떨어져 있다는 부정입니다."},{"no":14,"en":"DON\u0027T HOLD THAT AGAINST ME","ko":"그걸로 나 나쁘게 보진 마","url":"https://www.youtube.com/shorts/p8amDqyC7WI","note":"DON\u0027T HOLD THAT AGAINST ME\n\n→ 그걸로 나 나쁘게 보진 마.\n\nhold의 기본 감각은 무언가를 ‘잡고 놓지 않다’입니다. against는 서로 맞서거나 반대 방향에 놓인 관계를 나타냅니다. hold something against someone이라는 덩어리는 어떤 일을 마음에 붙들어 두고, 그 사람을 나쁘게 평가하는 이유로 삼는다는 뜻입니다. 과거의 실수나 마음에 들지 않는 특징을 계속 불리한 증거처럼 가지고 있는 모습을 떠올리시면 됩니다.\n\n따라서 Don\u0027t hold that against me는 “그 사실을 나한테 불리하게 계속 들이대지는 말아 줘”라는 흐름입니다. 한국어의 “그걸로 미워하지는 마요”, “그거 하나 가지고 사람 판단하지 마세요”와 연결됩니다. that은 방금 말한 실수일 수도 있고, 상대와 다른 취향이나 조금 민망한 고백일 수도 있습니다.\n\n예를 들어 유명한 영화를 한 번도 본 적이 없다고 밝힌 뒤 장난스럽게 사용할 수 있습니다. 실제로 큰 잘못을 저지른 상황뿐 아니라, 상대가 의외라고 생각할 만한 사실을 말할 때도 쓰는 것입니다. “나 이런 면이 있는데, 그렇다고 나를 너무 깎아 보지는 마”라는 가벼운 방어막이 됩니다.\n\n비슷한 표현인 Don\u0027t blame me는 책임을 자신에게 돌리지 말라는 뜻입니다. Don\u0027t hold that against me는 책임 소재보다 상대가 자신에게 부정적인 감정을 갖거나 평가를 낮추는 것을 걱정합니다. 또 Don\u0027t hold it against him이라고 하면 제삼자를 두둔하는 말이 됩니다. 잘못이 없다고 주장하는 것과, 그 일 때문에 계속 나쁘게 보지 말라고 부탁하는 것은 다릅니다.\n\n짧은 대화:\n\nA: You\u0027ve never seen Star Wars? / 스타워즈를 한 번도 안 봤다고?\n\nB: No. Don\u0027t hold that against me. / 응. 그걸로 나 나쁘게 보진 마.\n\n진지한 갈등에서는 과거의 일을 앞으로도 계속 들춰내지 말아 달라는 의미로 들릴 수 있습니다. 하지만 이 한마디만으로 사과를 대신할 수 있는 것은 아닙니다. 상대가 실제로 피해를 입었다면 “그냥 넘어가 달라”는 요구로 느껴질 수 있기 때문입니다. 친근한 농담에서는 가볍고 귀엽지만, 무거운 잘못을 두고 쓰면 자기 편의적인 말이 될 수 있다는 상황 차이를 보시면 좋습니다.\n\n기억 고리: 그 일을 마음속에 붙잡아 두고 나를 깎아내리는 근거로 쓰지는 말아 달라는 부탁입니다."},{"no":15,"en":"I WOULDN\u0027T COUNT ON IT","ko":"난 그걸 너무 기대하진 않겠어","url":"https://www.youtube.com/shorts/SR-Dhiu2tnY","note":"I wouldn\u0027t count on it.\n→ 난 그걸 너무 기대하진 않겠어.\n→ 상황에 따라 \"그럴 거라고 믿지 않는 게 좋아.\" / \"그건 장담 못 해.\" / \"기대하지 마.\"\n\n이 표현은 count on이 왜 \u0027믿다, 의지하다\u0027가 되는지를 이해하면 쉽습니다.\n\n1. count on = 왜 \"믿고 기대하다\"일까?\n\ncount의 기본 뜻은 세다입니다.\n\n그런데 무언가를 count에 넣는다는 것은, 계획을 세울 때 그것을 확실히 있다고 보고 계산에 포함하는 것으로 발전합니다.\n\n예를 들어,\n\nYou can count on me.\n\n를 이미지로 이해하면\n\n계획을 세울 때 나를 확실히 존재하는 전력으로 계산해도 돼.\n→ 나는 믿어도 돼.\n→ 나한테 의지해도 돼.\n\n입니다.\n\n한국어의 \"그 사람까지 머릿수에 넣고 계산해도 돼\", \"그건 확실한 걸로 치자\"와 꽤 비슷한 사고방식입니다.\n\n2. 그래서 count on it은\n\ncount on it\n→ 그것을 확실한 것으로 계산하다\n→ 그것이 일어날 거라고 믿고 계획하다\n→ 그걸 기대하다 / 믿다\n\n가 됩니다.\n\n그런데 여기에\n\nI wouldn\u0027t count on it.\n\n이라고 했으니,\n\n직역에 가까운 사고방식은\n\n나라면 그걸 확실한 것으로 계산에 넣지는 않겠다.\n\n입니다.\n\n그래서 자연스럽게:\n\n그럴 거라고 기대하지 않는 게 좋아.\n\n가 되는 거죠.\n\n3. 왜 I won\u0027t가 아니라 I wouldn\u0027t일까?\n\n이게 중요한 뉘앙스입니다.\n\nI won\u0027t count on it.\n→ 나는 그걸 기대하지 않을 거야.\n\nI wouldn\u0027t count on it.\n→ 나라면 그걸 기대하지 않겠어.\n\nwouldn\u0027t에는 흔히 암묵적으로\n\nIf I were you, I wouldn\u0027t count on it.\n내가 너라면 그걸 기대하지 않겠어.\n\n라는 느낌이 들어 있습니다.\n\n그래서 실제 대화에서는 상대방에게 \"너무 기대하지 않는 게 좋을걸\"이라는 조언이나 경고가 됩니다.\n\n4. 실제 대화를 보면 느낌이 확실합니다\n\nDo you think he\u0027ll come to the party?\n걔 파티에 올 것 같아?\n\nI wouldn\u0027t count on it.\n글쎄, 기대 안 하는 게 좋을걸.\n\n여기서 말하는 사람은 \"절대 안 와.\"라고 단정하는 것은 아닙니다.\n\n오히려:\n\n올 수도 있긴 한데 → 그걸 전제로 생각할 만큼 확실하지는 않다.\n\n라는 미묘한 뜻입니다.\n\n그래서 이 표현의 핵심을 한 문장으로 기억하면:\n\nI wouldn\u0027t count on it.\n= \"그걸 \u0027확실한 것\u0027으로 치고 계획하진 마.\"\n\n이게 영어 원문의 감각을 가장 잘 살린 이해입니다."},{"no":16,"en":"I REST MY CASE","ko":"이걸로 내 말이 맞다는 게 증명됐네","url":"https://www.youtube.com/shorts/VOF6ntV8oXc","note":"I REST MY CASE\n\n→ 이걸로 내 말이 맞다는 게 증명됐네.\n\ncase는 ‘상자’라는 뜻도 있지만, 여기서는 자신의 입장을 뒷받침하는 ‘논거’나 법정의 ‘사건’을 가리킵니다. rest는 보통 ‘쉬다’이지만, 법정에서 자신의 입증을 마친다는 맥락으로 쓰입니다. I rest my case는 법정에서는 더 이상의 증거 제시를 마치겠다는 말이고, 일상에서는 그 장면을 빌려 자신의 주장이 충분히 뒷받침되었다고 선언합니다.\n\n예를 들어 “저 사람은 늘 약속에 늦는다”라고 이야기하고 있는데, 바로 그 사람이 또 늦는다는 연락을 보내왔다고 생각해 보세요. 이때 I rest my case라고 하면 “봐요, 제가 더 설명할 필요가 없잖아요”라는 뜻입니다. 방금 벌어진 일이 자기 주장의 증거가 되었다는 것을 재치 있게 강조하는 것입니다.\n\n한국어의 “내 말이 그 말이라니까요”, “이쯤 되면 더 말할 것도 없죠”와 비슷합니다. 다만 단순히 대화를 끝내고 싶다는 뜻은 아닙니다. 자신이 옳다는 쪽으로 논쟁이 정리되었다고 보는 태도가 들어갑니다. 그래서 상대가 인정하지 않았더라도, 화자 혼자 승리를 선언하는 듯이 들릴 수 있습니다.\n\n비슷한 표현인 I\u0027m done talking은 더 이상 말하지 않겠다는 뜻으로, 지쳤거나 대화를 거부할 때도 쓸 수 있습니다. I rest my case는 말하지 않는 이유가 ‘이미 충분한 증거가 나왔다’는 데 있습니다. 또 법정에서 이 말을 했다고 재판에서 실제로 이겼다는 뜻은 아닙니다. 일상적인 쓰임에서 나타나는 “내 말이 증명됐다”라는 뉘앙스와 법적 결과를 구분하셔야 합니다.\n\n짧은 대화:\n\nA: You said this printer always breaks. It just stopped again. / 네가 이 프린터 맨날 고장 난다고 했지? 방금 또 멈췄어.\n\nB: I rest my case. / 이걸로 내 말이 맞다는 게 증명됐네.\n\n가벼운 대화에서는 상황이 너무 절묘하게 맞아떨어졌을 때 웃음을 만드는 표현입니다. 반면 진지한 갈등에서 반복하면 상대 말을 들을 생각이 없다는 인상을 줄 수 있습니다. 스스로 “증거는 끝났다”라고 선언하는 말이기 때문입니다. 실제 논증의 완성도와 별개로, 화자가 ‘더 설명할 필요가 없다’고 느낀다는 점을 읽으시면 정확합니다.\n\n기억 고리: 내 주장을 뒷받침하는 장면이 나왔으니, 더 증거를 낼 필요도 없다는 선언입니다."},{"no":17,"en":"GET A LOAD OF THIS","ko":"이것 좀 봐","url":"https://www.youtube.com/shorts/vx1lP2q2JW0","note":"GET A LOAD OF THIS\n\n→ 이것 좀 봐.\n\nload의 기본 뜻은 짐이나 한 번에 실리는 ‘분량’입니다. 이 표현은 단어를 하나씩 직역해서 “이것의 짐을 받아라”라고 이해하면 뜻이 연결되지 않습니다. 덩어리 전체가 상대의 주의를 강하게 끌어 “이것을 한번 보거나 들어 보라”는 회화 표현으로 쓰입니다. 의미를 기억할 때는 눈이나 귀로 들어오는 정보를 한 덩어리 받아 보라는 이미지를 보조적으로 활용할 수 있습니다.\n\n그냥 정보를 전달하기보다, 상대가 보고 놀라거나 웃거나 어이없어할 만한 것을 소개할 때 잘 어울립니다. 황당한 가격표, 기묘한 사진, 예상 못 한 문자 메시지를 보여 주기 직전에 꺼내는 식입니다. 한국어의 “야, 이것 좀 봐요”, “이 얘기 한번 들어 봐요”처럼 반응을 미리 끌어올리는 말입니다.\n\nthis가 가리키는 대상이 꼭 눈앞에 있는 물건일 필요는 없습니다. 바로 다음에 할 이야기일 수도 있습니다. 그래서 상황에 따라 “이것 좀 들어 봐”가 더 자연스러운 번역이 됩니다. 중심은 시각인지 청각인지가 아니라, ‘지금부터 네 주의를 끌 만한 것이 있다’는 예고입니다.\n\n비슷한 표현인 Look at this는 대상을 보라고 비교적 직접적으로 말합니다. Get a load of this에는 “이거 꽤 놀랍지?”, “이거 정말 황당해”라는 화자의 평가가 미리 묻어나기 쉽습니다. Check this out도 흥미로운 것을 보여 줄 때 자주 쓰지만, Get a load of this는 특히 놀람이나 조롱을 담은 소개에 잘 어울립니다. 그렇다고 언제나 비꼬는 뜻으로 한정되는 것은 아닙니다.\n\n짧은 대화:\n\nA: Get a load of this. They want twenty dollars for a coffee. / 이것 좀 봐. 커피 한 잔에 20달러를 달래.\n\nB: You\u0027re joking. / 농담이지?\n\n이 대화에서는 가격이 지나치다는 평가가 표현의 분위기를 결정합니다. 신기한 발명품을 보여 주면 감탄을 유도하는 말이 될 수 있습니다. 반면 사람을 가리키며 사용하면 그 사람을 구경거리로 삼거나 우습게 보는 느낌이 생길 수 있으므로, 사물을 소개할 때와 같은 가벼움으로 받아들여지지 않을 수 있습니다. 친근하고 구어적인 주의 환기 표현이라는 점도 함께 기억하시면 좋습니다.\n\n기억 고리: 단순히 보라는 말에, “네가 반응할 만한 게 여기 있어”라는 예고를 얹는 표현입니다."},{"no":18,"en":"I\u0027LL GRANT YOU THAT","ko":"그 점은 인정할게","url":"https://www.youtube.com/shorts/41xouw08M9s","note":"I\u0027LL GRANT YOU THAT\n\n→ 그 점은 인정할게.\n\ngrant의 기본 감각은 무엇을 공식적으로 ‘주다’, ‘허락하다’, ‘인정하다’입니다. 돈이나 권리를 부여하는 데 쓰이기도 하지만, 논의에서는 상대가 제시한 어떤 점을 타당한 것으로 인정한다는 뜻이 됩니다. I\u0027ll grant you that은 “네가 말한 그 부분은 내가 인정해 줄게”라는 구조입니다.\n\n중요한 것은 that이 가리키는 범위입니다. 보통 상대의 주장 전체가 아니라 특정한 사실이나 장점 하나를 가리킵니다. 어떤 휴대전화가 비싸다고 비판하면서도 “성능이 좋은 건 인정할게”라고 말할 수 있습니다. 상대에게 논점 하나를 내어 주되, 자기의 전체적인 판단까지 철회하지는 않는 것입니다.\n\n한국어의 “그건 그렇죠”, “그 점은 인정해요”와 닮았습니다. 특히 뒤에 but을 붙여 다른 문제를 제기하기 좋습니다. “편한 건 인정하지만 너무 비싸다”라는 식입니다. 다만 반드시 뒤에 반박이 나와야 하는 문법 규칙은 아닙니다. 독립적으로 말해도 상대가 지적한 부분을 받아들이는 반응이 됩니다.\n\nwill은 여기서 먼 미래에 인정하겠다는 약속보다, 지금 대화에서 인정하기로 하는 태도를 나타냅니다. 한국어의 “그래, 그 부분은 인정할게”와 같은 현재의 양보입니다. grant가 약간 격식 있는 단어여서, 가벼운 말싸움에서는 논쟁의 심판처럼 장난스러운 느낌이 나기도 합니다. 억양에 따라 마지못해 인정하는 듯한 분위기도 생깁니다.\n\n짧은 대화:\n\nA: This apartment is expensive, but the location is great. / 이 아파트는 비싸지만 위치는 정말 좋잖아.\n\nB: I\u0027ll grant you that, but it\u0027s too small. / 그 점은 인정할게. 그래도 너무 좁아.\n\n비슷한 표현인 I agree with you는 상대의 의견에 동의한다는 뜻이며, 문맥에 따라 더 넓은 동의를 나타낼 수 있습니다. I\u0027ll grant you that은 ‘바로 그 점’으로 범위를 한정하는 힘이 더 두드러집니다. You win은 상대가 논쟁에서 이겼다고 인정하는 말이지만, 여기서는 논쟁 전체의 승패가 결정되지 않았을 수 있습니다. 상대의 장점을 인정하면서 자기 판단을 유지하는 장면에 특히 잘 맞습니다.\n\n기억 고리: 주장 전체를 받아들이는 대신, 상대에게 논점 하나를 인정해 주는 말입니다."},{"no":19,"en":"COULD\u0027VE FOOLED ME","ko":"난 전혀 그렇게 안 보이던데","url":"https://www.youtube.com/shorts/AKse2KXC5m8","note":"COULD\u0027VE FOOLED ME\n\n→ 난 전혀 그렇게 안 보이던데.\n\nfool은 명사로 ‘바보’이지만, 동사로는 ‘속이다’입니다. could\u0027ve는 could have의 줄임말이므로, 완전한 형태를 떠올리면 “나를 속일 수도 있었겠다” 정도가 됩니다. 그러나 이 표현은 보통 사기꾼의 능력을 칭찬하지 않습니다. 상대가 설명한 사실과 자신이 겉으로 보고 받은 인상이 정반대일 때 쓰는 관용적인 반응입니다.\n\n누군가 “걔는 정말 신나 있어”라고 말하는데, 당사자는 내내 무표정했다고 생각해 보세요. Could\u0027ve fooled me는 “그렇다니 알겠지만, 내가 보기에는 전혀 안 그랬어”라는 뜻입니다. 겉모습만으로 판단했다면 사실과 반대로 믿었을 것이라는 감각입니다. 한국어의 “말 안 했으면 전혀 몰랐겠다”, “난 딱 반대인 줄 알았는데요”와 연결됩니다.\n\n여기서 속인 주체를 실제 사람 하나로 찾으려고 하면 어색해집니다. 상대의 태도, 눈앞의 증거, 상황 전체가 잘못된 인상을 주었다고 이해하는 편이 자연스럽습니다. 또한 could have가 들어갔다고 반드시 오래전 일을 회상하는 것은 아닙니다. 방금 들은 설명에 지금 반응하면서도 흔히 사용할 수 있습니다.\n\n비슷한 표현인 I had no idea는 몰랐다는 사실을 비교적 중립적으로 말합니다. Could\u0027ve fooled me는 보이는 모습이 설명과 다르다는 지적을 덧붙입니다. You fooled me는 실제로 상대에게 속았다고 직접 말하지만, 이 표현은 대개 “네 설명과 달리 그렇게 보이지는 않았다”라는 빈정거림이나 의심에 가깝습니다.\n\n짧은 대화:\n\nA: He says he\u0027s really excited about the trip. / 걔는 이번 여행 엄청 기대된대.\n\nB: Could\u0027ve fooled me. He hasn\u0027t smiled once. / 난 전혀 그렇게 안 보이던데. 한 번도 안 웃었잖아.\n\n이 대답은 상대의 전달 내용을 정면으로 거짓말이라고 단정하지 않으면서도, 관찰된 모습이 뒷받침하지 않는다고 말합니다. 가볍게 하면 재치 있는 반응이지만, 당사자에게 직접 말하면 “진심이면 좀 티를 내든가”라는 비판으로 들릴 수 있습니다. 반대로 누군가 “나 사실 엄청 긴장했어”라고 할 때 사용하면, 겉으로는 침착해 보였다는 칭찬이 될 수도 있습니다.\n\n기억 고리: 네 설명을 듣기 전에는, 겉모습 때문에 정반대로 믿을 뻔했다는 말입니다."},{"no":20,"en":"YOU TOOK THE WORDS RIGHT OUT OF MY MOUTH","ko":"딱 내가 하려던 말이야","url":"https://www.youtube.com/shorts/wAt3gf1bj2M","note":"YOU TOOK THE WORDS RIGHT OUT OF MY MOUTH\n\n→ 딱 내가 하려던 말이야.\n\ntake는 ‘가져가다’, out of는 ‘안에서 밖으로’입니다. 문장을 그대로 그리면 상대가 내 입 안에 있던 말을 꺼내 가져간 장면이 됩니다. 실제로 입속에 말이 물건처럼 들어 있다는 뜻은 물론 아닙니다. 내가 곧 말하려던 내용을 상대가 먼저 말했을 때, 마치 내 말을 미리 꺼내 간 것처럼 표현하는 것입니다.\n\nright는 여기서 ‘옳은’이라는 형용사가 아니라 정확함을 강조합니다. right out of my mouth는 ‘바로 내 입에서 쏙’이라는 느낌입니다. 상대의 말이 대충 비슷한 수준을 넘어, 내가 생각하던 핵심과 정확하게 맞아떨어졌다는 반응이 됩니다. 한국어의 “내 입에서 나올 말을 네가 했네”, “내 말이 바로 그 말이야”와 감각이 같습니다.\n\n이 표현은 자신의 생각을 상대가 먼저 잘 정리해 주었을 때 특히 자연스럽습니다. 실제로 입을 열려던 순간이어야 하는 것은 아닙니다. 대화를 듣다가 ‘나도 바로 그렇게 느끼고 있었다’고 깨달아도 쓸 수 있습니다. 생각의 일치와 말의 타이밍을 함께 강조하는 표현이라고 보시면 됩니다.\n\n비슷한 표현인 I agree는 상대의 의견에 동의한다는 뜻입니다. You took the words right out of my mouth는 “나도 이미 같은 말을 하려던 참이었다”라는 느낌이 더해집니다. 반대로 You put words in my mouth는 내가 하지 않은 말을 했다고 몰아간다는 뜻입니다. out of는 내 말을 먼저 꺼내 준 일치이고, put은 남의 말을 내 입에 억지로 넣는 왜곡이라는 차이가 있습니다.\n\n짧은 대화:\n\nA: We should stop working and get some food. / 이제 일 그만하고 뭐 좀 먹자.\n\nB: You took the words right out of my mouth. / 딱 내가 하려던 말이야.\n\n이 대화에서 말을 ‘가져갔다’고 해서 상대를 나무라는 것은 아닙니다. 보통 반갑게 공감하거나, 서로 생각이 잘 맞는다는 것을 표현합니다. 누가 먼저 아이디어를 냈는지 공로를 따지는 장면과도 구분하시면 좋습니다. 긴 문장이지만 회화에서는 한 덩어리로 자주 쓰이며, 특히 right out of 부분이 정확히 맞아떨어진 느낌을 살려 줍니다. 입이라는 구체적인 이미지 덕분에 단순한 동의보다 생생하게 들립니다.\n\n기억 고리: 내가 꺼내려던 말을 상대가 먼저 꺼냈을 만큼 생각이 정확하게 겹친 것입니다."},{"no":21,"en":"YOU\u0027RE ON THIN ICE","ko":"너 지금 아슬아슬해","url":"https://www.youtube.com/shorts/LnK8OwfQYS8","note":"YOU\u0027RE ON THIN ICE\n\n→ 너 지금 아슬아슬해.\n\nthin은 ‘얇은’, ice는 ‘얼음’입니다. 얇은 얼음 위에 서 있으면 아직 물에 빠지지는 않았지만, 조금만 더 무게가 실리거나 움직임이 커져도 깨질 수 있습니다. 이 표현은 그 불안정한 상태를 인간관계나 규칙의 상황에 옮깁니다. 상대가 아직 처벌이나 관계 단절을 겪지는 않았지만, 더 잘못하면 위험하다는 경고입니다.\n\n핵심은 이미 문제가 생겼거나 신뢰가 약해진 상태라는 점입니다. 한 번도 실수하지 않은 사람에게 막연히 조심하라고 하는 말보다, 여러 번 지각했거나 경고를 받은 사람에게 “지금 더 실수하면 안 돼”라고 말할 때 잘 맞습니다. 한국어의 “너 지금 간당간당해요”, “한 번만 더 그러면 끝이에요”와 연결됩니다.\n\n얼음이 아직 깨지지 않았다는 점도 중요합니다. 완전히 끝장난 상태를 말하는 것이 아니라, 마지막으로 행동을 조심할 여지가 남아 있습니다. 그래서 대놓고 처벌을 선언하는 대신 현재의 위태로운 위치를 알려 주는 방식입니다. 다만 “정확히 한 번만 더 기회가 있다”는 횟수까지 문장에 들어 있는 것은 아닙니다.\n\n비슷한 표현인 You\u0027re in trouble은 이미 곤란한 상황에 있거나 문제에 휘말렸다는 말입니다. You\u0027re on thin ice는 지금의 불안정함과 다음 실수의 위험을 특히 강조합니다. Be careful은 훨씬 넓고 중립적인 주의입니다. 이 표현은 보통 화자가 상대를 평가하거나 결과를 줄 수 있는 위치에 있을 때 더 강한 경고로 들립니다.\n\n짧은 대화:\n\nA: I know I\u0027m late again, but it was only ten minutes. / 또 늦은 건 아는데, 고작 10분이잖아요.\n\nB: You\u0027re on thin ice. Don\u0027t let it happen again. / 너 지금 아슬아슬해. 다시는 이런 일 없게 해.\n\n친구끼리는 사소한 장난을 두고 웃으며 사용할 수도 있습니다. 예를 들어 계속 놀리는 친구에게 장난스럽게 말하면 “너 계속 그러면 혼난다” 정도가 됩니다. 반면 상사나 교사가 진지하게 말하면 경고의 무게가 큽니다. 문장 자체가 관계 속의 인내나 신뢰가 약해진 상태를 그리므로, 단순히 몸이 위험한 장소에 있다는 뜻으로만 해석하지 않으시면 됩니다.\n\n기억 고리: 아직 얼음은 안 깨졌지만, 다음 행동 하나가 결과를 바꿀 수 있는 상태입니다."},{"no":22,"en":"DON\u0027T SELL YOURSELF SHORT","ko":"너 자신을 너무 과소평가하지 마","url":"https://www.youtube.com/shorts/js0l3I-2GBs","note":"DON\u0027T SELL YOURSELF SHORT\n\n→ 너 자신을 너무 과소평가하지 마.\n\nsell은 ‘팔다’이고, short에는 기대되는 양이나 수준에 ‘못 미치는’ 감각이 있습니다. 이 표현을 이해할 때는 가치 있는 물건에 제값보다 낮은 가격표를 붙이는 장면이 도움이 됩니다. yourself가 들어가므로, 낮게 매기는 대상은 물건이 아니라 자기 능력과 가치입니다. “너 자신에게 너무 싼 값을 매기지 마”가 과소평가하지 말라는 격려로 이어집니다.\n\n예를 들어 충분한 경력이 있는 사람이 “나는 그 자리에 지원할 수준이 안 돼”라고 말할 때 쓸 수 있습니다. 말하는 사람은 상대가 실제보다 자기 가능성을 낮게 보고 있다고 판단합니다. 한국어의 “네가 뭐가 부족해서 그래요”, “너무 자신을 낮춰 보지 마세요”와 비슷한 사고방식입니다.\n\n이 표현은 무조건 자신이 최고라고 믿으라는 뜻은 아닙니다. 자신의 능력을 부풀리라는 요구보다, 이미 가진 장점과 성취를 제대로 인정하라는 쪽입니다. 취업이나 협상처럼 실제 금액과 연결되는 상황에서도 유용하지만, 판매나 돈에 한정되지는 않습니다. 인간관계, 취미, 학업처럼 자기 평가가 필요한 장면에도 사용할 수 있습니다.\n\n비슷한 표현인 Don\u0027t be so modest는 “너무 겸손하게 굴지 마”라는 뜻입니다. 상대가 자기 실력을 알면서도 말을 낮추는 상황에도 잘 맞습니다. Don\u0027t sell yourself short는 말투의 겸손함보다 실제 자기 평가가 지나치게 낮다는 점에 초점이 있습니다. Don\u0027t underestimate yourself는 의미가 매우 가깝지만, 제값보다 싸게 내놓는다는 이미지 없이 직접적으로 말합니다.\n\n짧은 대화:\n\nA: I don\u0027t think I\u0027m good enough to lead the team. / 난 팀을 이끌 만큼 실력이 있는 것 같진 않아.\n\nB: Don\u0027t sell yourself short. You\u0027ve done this before. / 너 자신을 너무 과소평가하지 마. 전에도 해 봤잖아.\n\n이 예시에서 뒤에 경험을 언급하면 격려가 더 구체적이고 설득력 있게 들립니다. 상대가 왜 자신감을 가져도 되는지 근거를 붙여 주는 것입니다. 반면 현실적인 준비가 부족한 사람에게 무작정 쓰면 막연한 응원이 될 수 있습니다. 표현의 건강한 중심은 ‘부족한 점을 무시하라’가 아니라 ‘있는 가치까지 없는 것처럼 취급하지 말라’에 있습니다.\n\n기억 고리: 자신에게 너무 낮은 가격표를 붙이지 말고, 가진 가치만큼은 인정하라는 격려입니다."},{"no":23,"en":"HOW\u0027S THAT WORKING OUT FOR YOU?","ko":"그렇게 해 보니까 어때?","url":"https://www.youtube.com/shorts/GBdBEaIiouY","note":"HOW\u0027S THAT WORKING OUT FOR YOU?\n\n→ 그렇게 해 보니까 어때?\n\n→ 비꼬는 상황에서는 “그래서 그렇게 해서 잘됐어?”\n\nwork out은 여기서 운동한다는 뜻이 아닙니다. 일이 진행되어 어떤 결과로 이어지는 것을 뜻합니다. How is that working out은 “그 선택이나 방법이 실제로 어떤 결과를 내고 있느냐”를 묻습니다. for you는 그 결과가 상대에게 어떤지 범위를 잡아 줍니다. 이론적으로 그럴듯한지보다 직접 해 본 뒤의 사정을 묻는 질문입니다.\n\n친구가 재택근무로 바꾸었거나 새로운 공부법을 시작했을 때 진심 어린 관심으로 사용할 수 있습니다. “해 보니까 잘 맞아요?”, “실제로는 어때요?”라는 뜻입니다. 현재 진행형이므로 이미 해 보고 있는 방법의 진행 상황과 효과를 함께 살펴보는 느낌이 납니다. 반드시 일이 완전히 끝나야 결과를 물을 수 있는 것은 아닙니다.\n\n하지만 이 표현은 비꼬는 용법으로도 자주 쓰입니다. 상대가 고집한 방법이 눈에 띄게 실패했을 때 “그래서 그렇게 해서 잘됐어?”라고 묻는 것입니다. 문장 안에 실패를 뜻하는 단어는 없지만, 답이 좋지 않다는 것을 서로 아는 상황에서 굳이 결과를 묻기 때문에 비꼼이 생깁니다. 한국어에서도 같은 질문을 표정과 억양에 따라 걱정으로도, 빈정거림으로도 사용할 수 있습니다.\n\n비슷한 표현인 How\u0027s it going?은 일이나 생활이 전반적으로 어떤지 넓게 묻습니다. How\u0027s that working out for you?는 앞서 나온 특정한 선택이나 방법에 초점을 맞춥니다. Does it work?는 효과가 있는지 없는지 묻는 데 가깝고, 이 표현은 실제 경험이 어떤지 더 폭넓은 설명을 기대할 수 있습니다.\n\n짧은 대화:\n\nA: I started studying before breakfast. / 아침 먹기 전에 공부하기 시작했어.\n\nB: How\u0027s that working out for you? / 그렇게 해 보니까 어때?\n\n이 예시에는 실패를 암시하는 정보가 없으므로 자연스럽게 관심 어린 질문으로 읽힙니다. 반대로 상대가 잠을 줄이겠다고 했다가 계속 졸고 있다면 같은 말이 빈정거림으로 들릴 수 있습니다. 따라서 표현 자체를 ‘비꼬는 말’로만 외우지 마시고, 질문하는 사람이 좋은 결과도 진심으로 들을 준비가 되어 있는지 살펴보시면 좋습니다.\n\n기억 고리: 네가 택한 방법을 현실에 적용해 보니, 너한테 어떤 결과가 나오고 있느냐는 질문입니다."},{"no":24,"en":"AIN\u0027T THAT THE TRUTH?","ko":"진짜 그 말이 맞아","url":"https://www.youtube.com/shorts/jk5R3AT_PTQ","note":"AIN\u0027T THAT THE TRUTH?\n\n→ 진짜 그 말이 맞아.\n\ntruth는 ‘진실’이나 ‘사실’입니다. ain\u0027t는 매우 구어적인 부정형으로, 이 문장에서는 isn\u0027t에 해당합니다. 글자대로 보면 “그게 사실 아니야?”라는 부정 의문문입니다. 그러나 보통 진위 여부를 몰라서 묻는 질문이 아니라, 상대의 말에 강하게 동의하며 “정말 그렇다”라고 호응하는 표현입니다.\n\n상대가 많은 사람이 공감할 만한 경험을 이야기할 때 특히 잘 맞습니다. “주말은 눈 깜짝할 사이에 끝나”라는 말에 이 표현으로 반응하면, 자기 경험으로도 너무 잘 아는 사실이라는 느낌이 납니다. 한국어의 “그러게 말이에요”, “진짜 맞는 말이네요”처럼 새 정보를 받아들이기보다 이미 몸으로 아는 사실에 고개를 끄덕이는 것입니다.\n\n부정 의문문이라고 해서 부정적인 답을 예상하는 것은 아닙니다. 한국어에서도 “그렇지 않아요?”는 ‘그렇다’는 공감을 요청할 수 있습니다. Ain\u0027t that the truth?도 같은 방향으로 움직입니다. 말하는 사람은 사실상 답을 알고 있고, 상대와 그 확신을 함께 나누는 것입니다. 그래서 물음표가 있어도 실제 기능은 감탄이나 강한 맞장구에 가깝습니다.\n\n비슷한 표현인 Is that true?는 어떤 정보가 사실인지 확인하는 질문입니다. Ain\u0027t that the truth?는 대체로 이미 사실이라고 받아들인 내용을 힘주어 인정합니다. That\u0027s true도 동의이지만, 이 표현에는 더 구어적이고 정서적인 공감이 실리기 쉽습니다. ‘논리적으로 맞다’뿐 아니라 ‘내가 겪어 봐서 정말 안다’라는 분위기가 잘 어울립니다.\n\n짧은 대화:\n\nA: It takes longer to choose a movie than to watch one. / 영화 보는 것보다 고르는 데 시간이 더 걸려.\n\nB: Ain\u0027t that the truth? / 진짜 그 말이 맞아.\n\nain\u0027t는 여러 영어 방언과 편한 구어에서 사용되지만, 격식 있는 글이나 표준 문법을 요구하는 상황에서는 보통 피합니다. 그렇다고 사용하는 사람의 지적 수준을 판단할 근거가 되는 것은 아닙니다. 학습할 때는 이 표현의 캐주얼한 분위기를 함께 익히시면 됩니다. 또 상대의 슬픈 경험에 쓰면 함께 한숨 쉬는 공감이 되고, 우스운 일상 관찰에 쓰면 웃으며 맞장구치는 말이 됩니다.\n\n기억 고리: 사실인지 묻는 모양을 빌려, “내 경험으로도 정말 맞다”라고 강하게 공감하는 말입니다."},{"no":25,"en":"I HEAR THAT","ko":"그 말 완전 공감돼","url":"https://www.youtube.com/shorts/liKY3lOSVYo","note":"I HEAR THAT\n\n→ 그 말 완전 공감돼.\n\nhear의 기본 뜻은 소리가 귀에 ‘들리다’입니다. 그런데 대화에서 상대의 말을 듣는다는 것은 소리를 감지하는 데서 끝나지 않습니다. 그 말에 담긴 경험이나 감정을 받아들이는 단계로 확장될 수 있습니다. I hear that은 특정한 회화 맥락에서 “네 말이 어떤 느낌인지 알겠다”, “나도 그렇다”라는 공감의 반응이 됩니다.\n\n예를 들어 친구가 “이번 주는 너무 길게 느껴진다”라고 하소연했을 때 이렇게 답할 수 있습니다. 단순히 “목소리가 들린다”는 보고가 아니라, 그 피곤함이나 답답함이 자기에게도 익숙하다는 뜻입니다. 한국어의 “내 말이 그 말이야”, “그 마음 알죠”와 가깝습니다. 짧지만 상대의 말에 같은 편으로 서는 반응입니다.\n\nthat은 상대가 방금 한 말을 하나의 내용으로 받아 줍니다. 자신이 완전히 똑같은 일을 경험했어야만 하는 것은 아닙니다. 비슷한 감정을 알거나 상대의 불만이 납득될 때도 사용할 수 있습니다. 다만 이 용법은 편한 구어에 어울립니다. 공식적인 자리에서 자세한 이해나 동의를 보여 줘야 한다면, 무엇을 이해했는지 더 구체적으로 설명하는 편이 분명합니다.\n\n비슷한 표현인 I can hear you는 주로 상대의 목소리가 들린다는 뜻입니다. 통화 품질을 확인할 때 자연스럽습니다. I hear you도 이해와 공감을 나타내지만, 뒤에 반대 의견을 붙여 “무슨 말인지는 알겠지만”이라는 양보로 쓰기도 합니다. I hear that은 짧은 맞장구로 사용될 때 “정말 그래”라는 공감이 더 두드러지는 경우가 많습니다.\n\n짧은 대화:\n\nA: I need a weekend with absolutely no plans. / 아무 약속도 없는 주말이 필요해.\n\nB: I hear that. / 그 말 완전 공감돼.\n\n또 I hear that 뒤에 주어와 동사가 이어지면 구조가 달라질 수 있습니다. 예를 들어 I hear that he\u0027s moving은 “그가 이사한다고 들었어”라는 정보 전달입니다. 목록의 표현처럼 that에서 문장을 끝내며 상대의 말에 반응하는 경우와 구분하셔야 합니다. 똑같은 단어 배열이라도 뒤에 내용이 이어지는지, 이미 나온 말을 가리키며 끝나는지에 따라 듣는 방식이 달라집니다.\n\n기억 고리: 소리만 귀에 들어온 것이 아니라, 그 말에 담긴 마음까지 와닿았다는 반응입니다."},{"no":26,"en":"THAT\u0027S NOT HOW THIS WORKS","ko":"이건 그런 식으로 하는 게 아니야","url":"https://www.youtube.com/shorts/xw6K6sjwVYQ","note":"THAT\u0027S NOT HOW THIS WORKS\n\n→ 이건 그런 식으로 하는 게 아니야.\n\nhow는 ‘어떻게’, work는 여기서 ‘작동하다’입니다. 따라서 전체 구조는 “그것은 이것이 작동하는 방식이 아니다”입니다. that은 상대가 방금 제안하거나 시도한 방식을 가리키고, this는 지금 다루는 제도나 절차, 활동 전체를 가리킵니다. 두 지시어가 서로 다른 대상을 받는다는 점을 이해하면 문장의 구조가 선명해집니다.\n\n예를 들어 시험지를 제출한 뒤 답을 바꾸겠다는 사람에게 사용할 수 있습니다. 상대가 원하는 결과를 부정하는 데 그치지 않고, 그 결과를 얻으려는 방식이 절차와 맞지 않는다고 지적하는 것입니다. 한국어의 “그렇게 되는 게 아니에요”, “이건 그런 식으로 돌아가는 게 아니죠”와 같은 사고방식입니다.\n\n여기서 work는 기계에만 해당하지 않습니다. 환불 규정, 채용 과정, 인간관계, 토론의 원칙처럼 어떤 일이 성립하는 방식에도 쓸 수 있습니다. “내가 사과했으니까 너는 당장 기분이 풀려야 해”라는 말에 사용하면, 감정이나 화해가 그런 공식대로 작동하지는 않는다는 뜻이 됩니다.\n\n비슷한 표현인 That doesn\u0027t work는 특정한 방법이 효과를 내지 못한다는 말입니다. That\u0027s not how this works는 그 방법이 해당 체계의 규칙이나 원리를 잘못 이해했다는 점에 초점이 있습니다. That\u0027s not a thing은 개념이나 관행 자체를 부정하지만, 이 표현은 활동의 존재를 인정하면서 ‘방법이 틀렸다’고 교정합니다.\n\n짧은 대화:\n\nA: I returned half the sandwich. Can I get a full refund? / 샌드위치 반 남겨서 가져왔는데 전액 환불돼?\n\nB: That\u0027s not how this works. / 이건 그런 식으로 하는 게 아니야.\n\n이 말은 상대의 이해가 잘못되었다고 직접 지적하므로, 설명 없이 단독으로 쓰면 답답함이나 짜증이 강하게 느껴질 수 있습니다. 친구끼리 우스운 주장을 받아칠 때는 재치 있지만, 처음 배우는 사람에게 말하면 무안하게 만들 수도 있습니다. 차분하게 사용하려면 무엇이 올바른 절차인지 뒤에 붙이면 됩니다. 핵심은 “네가 싫다”가 아니라 “네가 전제한 작동 원리가 맞지 않는다”라는 교정입니다.\n\n기억 고리: 상대가 제시한 방식과, 이 일이 실제로 성립하는 방식 사이의 어긋남을 짚는 말입니다."},{"no":27,"en":"I WALKED RIGHT INTO THAT ONE","ko":"내가 딱 걸려들었네","url":"https://www.youtube.com/shorts/IFtcsvl2Yh8","note":"I WALKED RIGHT INTO THAT ONE\n\n→ 내가 딱 걸려들었네.\n\nwalk into의 기본 모습은 어떤 공간 ‘안으로 걸어 들어가는’ 것입니다. 그런데 들어간 곳이 함정이라면, 스스로 움직여 곤란한 상황에 빠졌다는 의미가 생깁니다. 이 표현에서는 실제 함정보다 상대가 던질 농담이나 반격에 자기 말로 좋은 빌미를 제공한 상황을 가리키는 경우가 많습니다.\n\nright는 여기서 ‘정확히’, ‘그대로’라는 강조입니다. 피하거나 눈치채지 못하고 함정 한가운데로 곧장 들어갔다는 느낌입니다. that one은 방금 나온 농담, 놀림, 함정 질문 같은 것을 받습니다. 단순히 남에게 공격당했다는 말이 아니라 “내가 너무 좋은 기회를 줬네”라고 자신의 역할을 인정하는 것이 핵심입니다.\n\n한국어의 “내가 빌미를 줬네”, “제 발로 걸려들었네요”와 비슷합니다. 예를 들어 자신을 칭찬해 달라는 뜻으로 질문했는데 상대가 그 구조를 이용해 놀렸다면, 민망함을 웃어넘기며 사용할 수 있습니다. 보통 심각한 자책보다는 상대의 재치에 패배를 인정하는 가벼운 분위기와 잘 맞습니다.\n\n비슷한 표현인 You got me는 “당했네”, “들켰네”, “모르겠네”처럼 여러 상황에서 쓸 수 있습니다. I walked right into that one은 그중에서도 자기 말이나 행동이 상대의 반격을 쉽게 만들었다는 점을 강조합니다. I had it coming은 이전의 잘못 때문에 좋지 않은 결과를 당할 만했다는 뜻이므로, 반드시 말장난이나 순간적인 함정에 걸린 상황을 가리키지는 않습니다.\n\n짧은 대화:\n\nA: Why does everyone think I\u0027m lazy? / 왜 다들 내가 게으르다고 생각하지?\n\nB: Want me to answer, or is that too much work for you? / 대답해 줄까, 아니면 듣는 것도 귀찮아?\n\nA: I walked right into that one. / 내가 딱 걸려들었네.\n\n이 예시에서 마지막 말은 “네가 부당하게 공격했다”는 항의가 아닙니다. 자기 질문이 놀리기 좋은 공을 던져 주었다는 인정입니다. 그래서 분위기를 부드럽게 만들고, 자신도 농담을 받아들일 줄 안다는 것을 보여 줍니다. 다만 실제로 심각한 사기나 함정에 빠진 상황에서도 비유적으로 가능하므로, 항상 유쾌한 뜻이라고 고정할 필요는 없습니다.\n\n기억 고리: 상대가 친 함정에 끌려간 것이 아니라, 내 말로 길을 열고 스스로 들어간 것입니다."},{"no":28,"en":"I\u0027LL TAKE THAT AS A YES","ko":"그럼 동의한 걸로 알게","url":"https://www.youtube.com/shorts/2vMWnkz8ufU","note":"I\u0027LL TAKE THAT AS A YES\n\n→ 그럼 동의한 걸로 알게.\n\ntake는 ‘가져가다’ 외에 어떤 말을 특정한 뜻으로 ‘받아들이다’, ‘해석하다’라는 의미로도 쓰입니다. take A as B는 ‘A를 B로 받아들이다’라는 구조입니다. 따라서 I\u0027ll take that as a yes는 상대가 방금 보인 반응을 긍정의 대답으로 해석하겠다는 말입니다. 물리적으로 yes라는 물건을 가져간다는 뜻은 아닙니다.\n\nthat이 가리키는 것은 반드시 실제로 말한 “응”이 아닙니다. 미소, 고개를 끄덕이는 행동, 반가운 표정, 애매한 대답일 수 있습니다. 상대가 명확한 긍정문을 말하지 않았기 때문에 화자가 그 반응의 의미를 정리해 주는 것입니다. 한국어의 “그럼 좋다는 뜻으로 알게요”, “찬성한 걸로 이해할게요”와 같은 흐름입니다.\n\nwill은 여기서 먼 미래의 계획보다 지금의 해석을 선언하는 역할을 합니다. “나는 방금 그 반응을 이렇게 받아들일게”라는 뜻입니다. a yes처럼 관사가 붙는 것은 yes를 하나의 긍정 응답으로 취급하기 때문입니다. 영어에서는 이런 식으로 평소에는 명사가 아닌 말을 하나의 답변이나 선택으로 묶어 표현할 수 있습니다.\n\n비슷한 표현인 Is that a yes?는 상대에게 확인을 요청합니다. I\u0027ll take that as a yes는 화자가 먼저 긍정으로 해석하겠다고 선언합니다. 그래서 장난스럽고 자신감 있게 들릴 수 있지만, 반응이 불분명한 상황에서는 자기 편의적으로 결론을 내리는 말처럼 들릴 수도 있습니다. 상대의 침묵이 언제나 동의가 된다는 원칙을 말하는 표현은 아닙니다.\n\n짧은 대화:\n\nA: Want the last slice of pizza? / 마지막 피자 한 조각 먹을래?\n\nB: I\u0027ve been staring at it for five minutes. / 나 5분째 그것만 보고 있었어.\n\nA: I\u0027ll take that as a yes. / 그럼 먹겠다는 걸로 알게.\n\n이 대화에서는 상대가 먹고 싶다는 뜻을 충분히 드러냈기 때문에 자연스럽고 유쾌합니다. 반대로 중요한 결정에서 상대가 난처해하며 대답하지 못한다면 같은 말이 압박처럼 들릴 수 있습니다. 표현을 이해할 때는 화자가 ‘명확한 대답을 들은 것’과 ‘반응을 해석한 것’ 사이의 차이를 남겨 두고 있다는 점을 보시면 좋습니다.\n\n기억 고리: 상대가 직접 yes라고 하지는 않았지만, 방금 반응을 긍정으로 받아들이겠다는 말입니다."},{"no":29,"en":"WHAT ELSE IS NEW?","ko":"뭐, 늘 그렇지","url":"https://www.youtube.com/shorts/XwdB__DA87M","note":"WHAT ELSE IS NEW?\n\n→ 뭐, 늘 그렇지.\n\nnew는 ‘새로운’이고, else는 ‘그 밖의 다른’이라는 뜻입니다. 글자대로 보면 “그 밖에 새 소식은 뭐가 있어?”라는 질문입니다. 실제로 다른 소식을 요청하는 뜻으로 사용할 수도 있지만, 관용적으로는 방금 들은 이야기가 너무 익숙하고 예상 가능해서 새로울 것이 없다는 반응으로 자주 쓰입니다.\n\n친구가 “걔 또 늦는대”라고 말했을 때 What else is new?라고 하면, 보통 다른 뉴스를 들려 달라는 요청이 아닙니다. “걔가 늦는 게 하루 이틀 일이야?”라는 뜻입니다. 말의 표면에서는 새로운 것을 묻지만, 실제로는 지금 들은 내용이 하나도 새롭지 않다고 평가하는 것이죠.\n\n한국어의 “뭐, 새삼스럽게”, “늘 있는 일이지”, “하루 이틀이냐”와 감각이 잘 맞습니다. 대체로 반복되는 불편, 나쁜 습관, 예상 가능한 문제를 두고 체념하거나 가볍게 비꼬는 경우가 많습니다. 새로운 정보에 놀라는 대신, 너무 익숙해서 놀랄 힘도 없다는 분위기가 들어갈 수 있습니다.\n\n비슷한 표현인 What\u0027s new?는 오랜만에 만난 사람에게 “새로운 일 있어?” 하고 근황을 물을 때 자연스럽습니다. What else is new?도 문맥에 따라 추가 소식을 물을 수 있지만, 뻔한 문제를 들은 직후 짧게 말하면 관용적인 체념으로 읽히기 쉽습니다. That\u0027s surprising은 예상 밖이라는 반응이므로 감정의 방향이 반대입니다.\n\n짧은 대화:\n\nA: The meeting started late again. / 회의가 또 늦게 시작했어.\n\nB: What else is new? / 뭐, 늘 그렇지.\n\n이 대답은 회의가 늦게 시작한 사실을 부정하지 않습니다. 오히려 늘 반복되는 일이라는 전제를 받아들입니다. 그래서 상대가 처음 겪은 일에 진지하게 속상해하고 있다면 무심하게 들릴 수 있습니다. 반대로 두 사람이 같은 문제를 여러 번 겪었다면, 설명 없이도 피곤함을 공유하는 한마디가 됩니다. 실제로 질문의 답을 기다리는지, 어깨를 으쓱하며 대화를 마무리하는지를 보면 문자 그대로의 질문과 관용적 반응을 구분하기 쉽습니다.\n\n기억 고리: 새 소식을 묻는 척하면서, 방금 이야기는 너무 뻔해서 새롭지도 않다고 말하는 표현입니다."},{"no":30,"en":"THAT\u0027S A HARD PASS","ko":"그건 절대 사양할게","url":"https://www.youtube.com/shorts/aJsQhTUHamo","note":"THAT\u0027S A HARD PASS\n\n→ 그건 절대 사양할게.\n\npass의 기본 뜻에는 ‘지나가다’가 있습니다. 선택이나 참여의 기회 앞에서 그 차례를 넘기면, 그 제안을 받아들이지 않고 지나간다는 의미가 됩니다. 카드 게임에서 차례를 넘기거나, 권유받은 것을 사양하는 장면을 연결해 보시면 됩니다. 여기서 a pass는 하나의 거절이나 불참 의사로 이해하시면 자연스럽습니다.\n\nhard는 여기서 ‘어려운’보다 ‘단단한’, ‘강한’, ‘확고한’ 쪽입니다. 따라서 hard pass는 결정하기 어려운 선택이 아니라, 흔들릴 여지가 거의 없는 단호한 거절입니다. “고민해 봤는데 약간 망설여져”가 아니라 “그건 생각만 해도 싫어”, “나는 확실히 안 할래”라는 반응에 가깝습니다.\n\n한국어의 “그건 진짜 사양할게요”, “그건 됐어요 // ── 이번 주 카드 번호 정하기 ────────────────────────────────────────────────
// 1) URL 파라미터 ?w=11,12,13  2) 없으면 시작일·평일·제외번호로 역산
function paramNos() {
  // 구분자는 쉼표와 밑줄 둘 다 받는다 — 카톡 자동 링크가 쉼표에서 잘리는 경우가 있어서.
  var q = (location.search + location.hash).match(/[?&#]w=([0-9,_\-]+)/);
  if (!q) return null;
  var out = [];
  q[1].split(/[,_]/).forEach(function (part) {
    var m = part.match(/^(\d+)-(\d+)$/);
    if (m) { for (var i = +m[1]; i <= +m[2]; i++) out.push(i); }
    else if (part) out.push(+part);
  });
  return out.length ? out : null;
}

function kstToday() {
  var now = new Date();
  return new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (9 * 3600000));
}

// 발송 규칙대로 순서를 만든다: 시작 번호부터, 제외 번호는 건너뛰며 평일마다 하나씩
function scheduleUpTo(date) {
  var skip = {};
  DATA.skipNos.forEach(function (n) { skip[n] = 1; });
  var order = DATA.cards.map(function (c) { return c.no; }).filter(function (n) { return !skip[n]; });
  var d = new Date(DATA.startDate + 'T00:00:00Z'), sent = [], i = 0;
  while (d <= date && i < order.length) {
    var day = d.getUTCDay();
    if (day >= 1 && day <= 5) { sent.push(order[i]); i++; }
    d = new Date(d.getTime() + 86400000);
  }
  return sent;
}

function weekNos() {
  var p = paramNos();
  if (p) return p;
  return scheduleUpTo(kstToday()).slice(-5);
}

function loadState() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { seen: {}, nos: [] }; }
  catch (e) { return { seen: {}, nos: [] }; }
}
function saveState(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { } }

  if (changed) { state.nos.sort(function (a, b) { return a - b; }); saveState(state); }
})();

// ── 세션 ────────────────────────────────────────────────────────────────────
var dir = 'ko2en', scope = 'week', queue = [], idx = 0, flipped = false;
var tally = { 0: 0, 1: 0, 2: 0 }, again = [];

// 누적 풀 = 이 도구로 받은 번호 + 이전에 이미 학습한 번호(priorNos).
// priorNos 는 발송에서는 제외되지만(skipNos) 복습 대상에는 들어간다.
function allPool() {
  var pool = state.nos.slice();
  if (!pool.length) pool = scheduleUpTo(kstToday());
  (DATA.priorNos || []).forEach(function (n) { if (pool.indexOf(n) < 0) pool.push(n); });
  return pool.filter(function (n) { return byNo[n]; }).sort(function (a, b) { return a - b; });
}

function pickAll() {
  // 누적: 최근에 틀린 것 먼저, 잘 아는 것은 가끔만. 최대 20장.
  var pool = allPool();
  var scored = pool.map(function (n) {
    var s = state.seen[n];
    var weight = s ? (s.g === 0 ? 3 : s.g === 1 ? 2 : 0.6) : 2.5;
    return { no: n, w: weight * (0.6 + Math.random()) };
  });
  scored.sort(function (a, b) { return b.w - a.w; });
  return scored.slice(0, 20).map(function (x) { return x.no; });
}

// 아침 카톡의 "📖 설명" 링크는 ?open=1 로 온다 — 바로 뜻과 설명을 펼쳐 준다.
var openFirst = /[?&#]open=1/.test(location.search + location.hash);

function startSession(nos) {
  queue = nos.filter(function (n) { return byNo[n]; });
  idx = 0;
  flipped = openFirst;
  openFirst = false;          // 첫 카드에만 적용한다
  tally = { 0: 0, 1: 0, 2: 0 };
  again = [];
  render();
}

function currentDir() {
  if (dir !== 'mix') return dir;
  return (idx % 2 === 0) ? 'ko2en' : 'en2ko';
}

function render() {
  var stage = document.getElementById('stage');
  var prog = document.getElementById('prog');
  var count = document.getElementById('count');
  var note = document.getElementById('footNote');

  note.textContent = scope === 'week'
    ? '이번 주 ' + queue.length + '문장'
    : '누적 ' + allPool().length + '문장 중 ' + queue.length + '장';

  if (!queue.length) {
    count.textContent = '';
    prog.style.width = '0';
    stage.innerHTML = '<div class="empty">아직 복습할 카드가 없습니다.<br>평일 아침 문장을 받은 뒤 토요일에 열어 보세요.</div>';
    return;
  }

  if (idx >= queue.length) {
    prog.style.width = '100%';
    count.textContent = queue.length + ' / ' + queue.length;
    var retry = again.length ? '<button class="btn" id="retry">헷갈린 ' + again.length + '장 다시</button>' : '';
    stage.innerHTML =
      '<div class="done"><h2>한 바퀴 끝</h2><p>' +
      (again.length ? '모름·애매로 표시한 것만 다시 볼까요?' : '전부 알고 계시네요.') + '</p>' +
      '<div class="tally">' +
      '<div style="color:var(--no)"><b class="mono">' + tally[0] + '</b>모름</div>' +
      '<div style="color:var(--mid)"><b class="mono">' + tally[1] + '</b>애매</div>' +
      '<div style="color:var(--ok)"><b class="mono">' + tally[2] + '</b>알아</div></div>' +
      retry + '<button class="btn ghost" id="restart">처음부터</button></div>';
    var r = document.getElementById('retry');
    if (r) r.onclick = function () { startSession(again.slice()); };
    document.getElementById('restart').onclick = function () { startSession(queue.slice()); };
    return;
  }

  var card = byNo[queue[idx]];
  var d = currentDir();
  var frontTxt = d === 'ko2en' ? card.ko : card.en;
  var backTxt = d === 'ko2en' ? card.en : card.ko;
  var frontLabel = d === 'ko2en' ? '한글' : 'English';
  var backLabel = d === 'ko2en' ? 'English' : '한글';

  count.textContent = (idx + 1) + ' / ' + queue.length;
  prog.style.width = Math.round((idx / queue.length) * 100) + '%';

  stage.innerHTML =
    '<div class="card" id="card">' +
    '<div class="stamp mono"><span>' + frontLabel + '</span><b>#' + String(card.no).padStart(3, '0') + '</b></div>' +
    '<div class="face"><div class="line' + (d === 'en2ko' ? ' en' : '') + '">' + esc(frontTxt) + '</div>' +
    (flipped ? '' : '<div class="prompt">먼저 소리 내어 답해 보세요 · 탭하면 정답</div>') + '</div>' +
    (flipped
      ? '<div class="plate"><div class="lbl mono">' + backLabel + '</div><div class="txt">' + esc(backTxt) + '</div>' +
        (card.url ? '<div class="links"><a href="' + card.url + '" target="_blank" rel="noopener">쇼츠로 확인하기</a></div>' : '') + '</div>'
      : '') +
    '</div>' +
    (flipped && card.note ? detailHtml(card.note) : '') +
    '<div class="grade' + (flipped ? ' on' : '') + '">' +
    '<button class="g0" data-g="0">모름</button>' +
    '<button class="g1" data-g="1">애매</button>' +
    '<button class="g2" data-g="2">알아</button></div>';

  document.getElementById('card').onclick = function () {
    if (!flipped) { flipped = true; render(); }
  };
  Array.prototype.forEach.call(document.querySelectorAll('.grade button'), function (b) {
    b.onclick = function () { grade(+b.dataset.g); };
  });
}

function grade(g) {
  var no = queue[idx];
  tally[g]++;
  if (g < 2 && again.indexOf(no) < 0) again.push(no);
  state.seen[no] = { g: g, at: kstToday().toISOString().slice(0, 10) };
  saveState(state);
  idx++; flipped = false;
  render();
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
  });
}

// 상세 설명 — 원문 줄바꿈을 그대로 살리고, "→" 로 시작하는 줄만 강조한다.
// (마크다운 파서를 넣지 않는다. 설명 형식이 사람마다 달라 깨지기 쉽다)
function detailHtml(text) {
  var lines = String(text).split('\n');
  // 첫 줄은 영어 문장 자체라 카드 앞면과 겹친다 — 뺀다
  if (lines.length && lines[0].trim()) { lines = lines.slice(1); }
  // 빈 줄 기준으로 덩어리를 나눈다
  var blocks = [], cur = [];
  lines.forEach(function (l) {
    if (l.trim()) { cur.push(l.trim()); }
    else if (cur.length) { blocks.push(cur); cur = []; }
  });
  if (cur.length) { blocks.push(cur); }

  // "예를 들어," 처럼 다음 문장으로 이어지는 짧은 도입부는 뒤 덩어리에 붙인다
  var merged = [];
  blocks.forEach(function (b) {
    var prev = merged[merged.length - 1];
    if (prev && prev.length === 1 && prev[0].length < 24 && /[,，]$/.test(prev[0]) &&
        !isEnglishLine(prev[0]) && !isEnglishLine(b[0])) {
      prev.push.apply(prev, b);
      return;
    }
    merged.push(b.slice());
  });
  blocks = merged;

  var html = '';
  var first = true;
  blocks.forEach(function (b) {
    // 핵심 한 줄 — 아침 카톡에 나가는 그 문장
    if (b.length === 1 && /^(핵심|기억 고리|한 줄 요약|요약)\s*[:：]/.test(b[0])) {
      html += '<p class="key"><span>' + rich(b[0].replace(/^[^:：]*[:：]\s*/, '')) + '</span></p>';
      return;
    }
    // "짧은 대화:" 같은 꼬리표
    if (b.length === 1 && /[:：]\s*$/.test(b[0]) && b[0].length <= 20) {
      var icon = /대화|예시|예문/.test(b[0]) ? '💬' : '▸';
      html += '<div class="label">' + icon + ' ' + esc(b[0].replace(/[:：]\s*$/, '')) + '</div>';
      return;
    }
    // A: / B: 로 시작하는 대화 (영어 / 한국어 가 슬래시로 붙어 오는 경우가 많다)
    if (b.every(function (l) { return /^[A-Za-z가-힣]{1,3}\s*[:：]\s*\S/.test(l); })) {
      html += b.map(function (l) {
        var m = l.match(/^([A-Za-z가-힣]{1,3})\s*[:：]\s*(.+)$/);
        var rest = m[2];
        var parts = rest.split(/\s+\/\s+/);
        var en = parts[0], ko = parts.length > 1 ? parts.slice(1).join(' / ') : '';
        return '<div class="dlg"><span class="who">' + esc(m[1]) + '</span>' +
               '<span class="en">' + esc(en) + '</span>' +
               (ko ? '<span class="ko">' + esc(ko) + '</span>' : '') + '</div>';
      }).join('');
      return;
    }
    // 화살표 줄만 모인 덩어리
    if (b.every(function (l) { return l.indexOf('→') === 0; })) {
      html += '<div class="arrows">' + b.map(function (l) {
        return '<p class="arrow">' + esc(l) + '</p>';
      }).join('') + '</div>';
      return;
    }
    // 번호 붙은 절 제목
    if (/^\d+[.)]\s+/.test(b[0])) {
      html += '<h4>' + esc(b[0]) + '</h4>';
      b = b.slice(1);
      if (!b.length) { return; }
    }
    // 영어 문장만 홀로 있는 덩어리 (You can count on me. 같은 인용)
    if (b.length === 1 && isEnglishLine(b[0])) {
      html += '<div class="ex"><span class="en">' + esc(b[0]) + '</span></div>';
      return;
    }
    // 영어 예시 + 해석이 번갈아 오는 덩어리 (대화 예시)
    if (b.length >= 2 && isEnglishLine(b[0]) && !isEnglishLine(b[1])) {
      for (var i = 0; i + 1 < b.length; i += 2) {
        html += '<div class="ex"><span class="en">' + esc(b[i]) + '</span>' +
                '<span class="ko">' + esc(b[i + 1]) + '</span></div>';
      }
      if (b.length % 2) { html += '<p>' + esc(b[b.length - 1]) + '</p>'; }
      return;
    }
    // 그 밖에는 문단으로 다시 흘린다 (원문 줄바꿈은 채팅창 폭 기준이라 버린다)
    var cls = first ? ' class="lead"' : '';
    var para = [];
    b.forEach(function (l) {
      if (l.indexOf('→') === 0) {
        if (para.length) { html += '<p' + cls + '>' + rich(para.join(' ')) + '</p>'; para = []; cls = ''; }
        html += '<p class="arrow">' + rich(l) + '</p>';
      }
      else if (isEnglishLine(l) && b.length > 1) {
        if (para.length) { html += '<p' + cls + '>' + rich(para.join(' ')) + '</p>'; para = []; cls = ''; }
        html += '<div class="ex"><span class="en">' + esc(l) + '</span></div>';
      }
      else { para.push(l); }
    });
    if (para.length) { html += '<p' + cls + '>' + rich(para.join(' ')) + '</p>'; }
    first = false;
  });

  var open = /[?&#]open=1/.test(location.search + location.hash) ? ' open' : '';
  return '<details class="detail"' + open + '><summary><span class="lbl-txt">📖 이 표현 자세히 보기</span></summary>' +
         '<div class="body">' + html + '</div></details>';
}

// 한국어 설명 안에 섞인 영어 표현과 따옴표로 묶인 뜻을 눈에 걸리게 만든다.
// 설명이 "한국어 문장 속 영어 단어" 구조라, 이 둘만 구분해도 훨씬 잘 읽힌다.
function rich(s) {
  // 태그를 넣기 전에 엔티티를 임시 기호로 바꿔 둔다 (영어 매칭이 &quot; 안의 quot 를 물지 않도록)
  var t = esc(s)
    .replace(/&quot;/g, '\u0001').replace(/&amp;/g, '\u0002')
    .replace(/&lt;/g, '\u0003').replace(/&gt;/g, '\u0004');

  // 1) 문장 속 영어 표현 — 굵게 + 다른 색 (태그는 여기서 처음 들어간다)
  t = t.replace(/[A-Za-z][A-Za-z\u2019'.\-]*(?:\s+[A-Za-z][A-Za-z\u2019'.\-]*){0,6}/g, function (m) {
    if (m.replace(/[^A-Za-z]/g, '').length < 2) { return m; }
    return '<b class="w">' + m + '</b>';
  });

  // 2) 따옴표로 묶인 한국어 뜻 — 밑줄 (임시 기호만 노리므로 위에서 넣은 태그는 건드리지 않는다)
  t = t.replace(/\u0001([^\u0001]{1,60})\u0001/g, '\u0001<u class="q">$1</u>\u0001');
  t = t.replace(/\u2018([^\u2019]{1,60})\u2019/g, '\u2018<u class="q">$1</u>\u2019');

  return t.replace(/\u0001/g, '&quot;').replace(/\u0002/g, '&amp;')
    .replace(/\u0003/g, '&lt;').replace(/\u0004/g, '&gt;');
}

// 한글보다 영문이 뚜렷이 많은 줄이면 예시 문장으로 본다
function isEnglishLine(s) {
  var latin = (s.match(/[A-Za-z]/g) || []).length;
  var hangul = (s.match(/[가-힣]/g) || []).length;
  return latin > 0 && latin >= hangul * 2;
}

// ── 조작 ────────────────────────────────────────────────────────────────────
document.getElementById('tabWeek').onclick = function () {
  scope = 'week';
  this.setAttribute('aria-selected', 'true');
  document.getElementById('tabAll').setAttribute('aria-selected', 'false');
  startSession(weekNos());
};
document.getElementById('tabAll').onclick = function () {
  scope = 'all';
  this.setAttribute('aria-selected', 'true');
  document.getElementById('tabWeek').setAttribute('aria-selected', 'false');
  startSession(pickAll());
};
Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (b) {
  b.onclick = function () {
    dir = b.dataset.dir;
    Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (x) {
      x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
    });
    try { localStorage.setItem('dbj-dir', dir); } catch (e) { }
    startSession(scope === 'week' ? weekNos() : pickAll());
  };
});
document.getElementById('reset').onclick = function (e) {
  e.preventDefault();
  if (!confirm('이 기기에 저장된 복습 기록을 모두 지웁니다.')) return;
  state = { seen: {}, nos: [] };
  saveState(state);
  startSession(weekNos());
};

try {
  var savedDir = localStorage.getItem('dbj-dir');
  if (savedDir) {
    dir = savedDir;
    Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (x) {
      x.setAttribute('aria-pressed', x.dataset.dir === dir ? 'true' : 'false');
    });
  }
} catch (e) { }

startSession(weekNos());
</script>
