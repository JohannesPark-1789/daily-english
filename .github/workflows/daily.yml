name: 오늘의 영어 (월~금 07:00 KST)

# ── 예약을 왜 네 번 거는가 ──────────────────────────────────────────────────
# GitHub 의 cron 은 "그 시각에 깨운다"는 보장이 없다. 이 저장소 실측으로는 예약이
# 매번 1~3시간 늦게 깨어났다 (10-24 2h05m / 10-26 1h46m / 10-27 3h05m /
# 10-28 2h57m / 10-29 2h+). 분을 0 에서 53 으로 옮겨도 그대로였다 — 정각 혼잡
# 때문이 아니라 예약 발화 자체가 best-effort 이기 때문이다.
#
# 그래서 "깨어난 시각"을 발송 시각으로 쓰지 않는다.
#   1) 목표(07:00 KST)보다 한참 앞에서 한 시간 간격으로 네 번 깨운다
#   2) 깨어난 run 은 scripts/wait-for-send-time.ps1 로 07:00 까지 기다렸다 보낸다
#   3) 아직 100분 넘게 남은 run 은 아무것도 하지 않고 끝낸다 — 뒤 예약이 맡는다
#   4) 이미 07:00 을 지나 깨어났으면 기다리지 않고 바로 보낸다
# 지연이 0~3.5시간이면 네 번 중 하나는 반드시 05:20~07:00 사이에 깨어난다.
# 둘 이상이 발송까지 가더라도 progress.json 의 lastSentDate 가 중복을 막는다.
#
# UTC 18:30/19:30/20:30/21:30 = KST 03:30/04:30/05:30/06:30 (다음 날).
# 월~금(KST) = 일~목(UTC) 이라 0-4 가 된다.
on:
  schedule:
    - cron: '30 18 * * 0-4'
    - cron: '30 19 * * 0-4'
    - cron: '30 20 * * 0-4'
    - cron: '30 21 * * 0-4'
  workflow_dispatch:
    inputs:
      no:
        description: '특정 번호를 보낼 때만 입력 (비우면 다음 차례). 진행 번호는 그대로 둔다'
        required: false
        default: ''
      force:
        description: '오늘 이미 보냈어도 다시 보낸다'
        type: boolean
        default: false

concurrency:
  group: daily-english-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    # 대기 한도(100분) + 발송 시간보다 넉넉하게.
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 07:00 KST 까지 대기
        id: gate
        shell: pwsh
        run: |
          & ./scripts/wait-for-send-time.ps1 -Target '07:00' -MaxWaitMinutes 100

      # 기다리는 동안 다른 run 이나 수동 발송이 진행 상태를 올렸을 수 있다.
      # 묵은 체크아웃으로 보내면 같은 문장을 두 번 보내게 된다.
      - name: 진행 상태 새로 받기
        if: steps.gate.outputs.send == 'yes'
        run: |
          git pull --rebase --autostash || echo "진행 상태 갱신 실패 — 체크아웃 시점 상태로 진행합니다"

      - name: 발송
        if: steps.gate.outputs.send == 'yes'
        shell: pwsh
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          DE_REFRESH_OUT: ${{ runner.temp }}/refresh.txt
          IN_NO: ${{ inputs.no }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          # 스플래팅은 반드시 해시테이블로 한다. 배열로 넘기면 '-Force' 가 이름이 아니라
          # 첫 위치 인자로 들어간다 (2026-10-24 주간 발송이 정확히 이것 때문에 실패했다).
          # 입력값은 run 본문에 직접 박지 않고 env 로 받는다. run 블록은 YAML 주석이
          # 아니라 문자열이라, 여기 적는 표현식 기호는 GitHub 이 먼저 해석한다.
          $p = @{}
          if ($env:IN_NO -match '^\d+$') { $p['No'] = [int]$env:IN_NO }
          if ($env:IN_FORCE -eq 'true') { $p['Force'] = $true; $p['Yes'] = $true }
          & ./scripts/send-today.ps1 @p

      # 카카오 갱신 토큰은 2개월마다 바뀐다. 새로 받은 값을 Secret 에 다시 넣지 않으면
      # 언젠가 조용히 만료되어 발송이 멎는다. 실패했을 때도 토큰은 갱신됐을 수 있어 always().
      - name: 갱신 토큰을 Secret 에 반영
        if: always() && steps.gate.outputs.send == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -s "${RUNNER_TEMP}/refresh.txt" ]; then
            gh secret set KAKAO_REFRESH_TOKEN --body "$(cat "${RUNNER_TEMP}/refresh.txt")" --repo "${GITHUB_REPOSITORY}"
            echo "갱신 토큰 Secret 갱신함"
          else
            echo "갱신 토큰 변화 없음"
          fi

      - name: 진행 상태 커밋
        if: always() && steps.gate.outputs.send == 'yes'
        run: |
          if git diff --quiet -- state/progress.json; then
            echo "진행 상태 변화 없음"
            exit 0
          fi
          git config user.name  "daily-english bot"
          git config user.email "noreply@github.com"
          git add state/progress.json
          git commit -m "chore(daily-english): 발송 진행 상태 갱신 [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "진행 상태 push 실패" >&2
          exit 1
